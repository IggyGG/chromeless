# .github/workflows/native-peer-gate.yml — ChromelessV2 M0 R8 CI gate.
#
# Two jobs:
#
#   native-peer-gate-scaffold  — Permissive mode. Runs on every PR (any base)
#     and on every push to `integration/native-peer`. Permits NOT_YET_IMPLEMENTED
#     for assertions not yet enabled per the ratified gate-blocking schedule
#     (CV2-11). This is the always-on signal; the operator sees it green from
#     M0 landing through M6 work.
#
#   native-peer-gate-strict    — Strict mode. Runs on push to
#     `integration/native-peer` (so operators can probe live) and on PRs
#     targeting `main` (so the M7 squash-merge MUST come in green-strict).
#     Every assertion must PASS; NYI is a FAIL.
#
# OSS-W1: both jobs need a real cloud_browser_worker image, supplied via the
# CHROMELESS_IMAGE repository variable. They previously depended on a
# `build-image` job that built infra/Dockerfile — the legacy stock-Chromium +
# getDisplayMedia image, which had been unbuildable since the M7 native-peer
# migration deleted capture/streamer-page/ while the Dockerfile still COPYd
# it, and which in any case contained none of the native-peer surface these
# gates assert on. With CHROMELESS_IMAGE unset both jobs report a notice and
# pass, so the gate is opt-in rather than permanently red.
#
# Branch-protection (required-check): Forgejo's "required status checks"
# rule lives outside the repo. Operators set
# `native-peer-gate / native-peer-gate-scaffold` as required on
# `integration/native-peer` and `main` per
# verification/README.md#branch-protection. The helper
# `verification/scripts/check-branch-protection.sh` queries the Forgejo
# API and reports whether the rule exists.

name: native-peer-gate

on:
  pull_request:
  push:
    branches:
      - integration/native-peer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-peer-gate-scaffold:
    name: native-peer-gate-scaffold (permissive)
    if: github.server_url != 'https://github.com' || vars.CHROMELESS_IMAGE != ''
    # Forgejo stopgap (2026-08-20): use `priority`; GitHub uses its hosted runner.
    #
    # `docker` and `ubuntu-latest` are served by the SAME 10 general runners, and
    # tf-multiverse saturated them: measured 470 queued `docker` jobs against 19
    # `ubuntu-latest`, all 18 general slots held by `docker`, and **zero**
    # `ubuntu-latest` jobs started in 30 minutes. chromeless jobs waited 56-61
    # min and were not going to get a slot — arrivals were running at 285/30min
    # against 147 completing, so the backlog was growing, not draining.
    #
    # The `priority` pool (6 express replicas x capacity 2 = 12 slots) had 3 in
    # use. It has the same shape as the general pool — dind + dind-gc + runner,
    # 16Gi docker storage, capacity 2 — so nothing here depends on a runner
    # feature the general pool had and this one lacks.
    #
    # ⚠ It is NOT free: `priority` exists for tf-multiverse's own fast lane
    # (portal SSR check, cargoless-serve image builds). This borrows capacity
    # that belongs to someone else, so it is a stopgap until chromeless has its
    # own pool — see the split design. If the express pool starts queueing,
    # this is why.
    #
    # ⚠ Express dind has 8Gi memory vs the general pool's 16Gi. The e2e stack
    # (Chromium + 1GB shm + three small services) is expected to fit, but this
    # is the one difference between the pools that could bite. An OOM in
    # `compose up` here is THIS, not a product defect.
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'priority' }}
    steps:
      - uses: actions/checkout@v4

      # OSS-W2: no `actions/setup-node@v4` — it installs a glibc node onto
      # this host's musl (Alpine) job container, poisoning PATH so every
      # later JS action's post-step exits 255 and the job fails with none of
      # its own work having run. Full write-up in ci.yml's "Node version
      # (image-provided)" step. The gate only needs `node` + `docker`, both
      # of which ci-tools ships.
      - name: Node version (image-provided)
        run: |
          command -v node >/dev/null 2>&1 || {
            echo "::error::no node in the job image; the gate is a node script"
            exit 1
          }
          echo "node: $(node --version)"

      # Resolve the worker image from the TREE, not from a forge setting.
      # See e2e.yml's copy of this step for the full account: the repo variable
      # is invisible to a checkout, and it went three weeks stale (2026-08-19,
      # task 340536) with no check able to say so. The file is the reviewable
      # default; the variable still wins when set, as an explicit override.
      # tools/lint/guest_release_lint.py fails if this file stops being read.
      - name: Resolve the worker image
        id: image
        env:
          CHROMELESS_IMAGE_OVERRIDE: ${{ vars.CHROMELESS_IMAGE }}
        run: |
          set -eu
          # Absence is legitimate — a fork with no build of its own has nothing
          # to pin (guest_release_lint.py makes the same allowance), so this
          # must not hard-fail. It falls through to the override, and then to
          # the probe's skip.
          pinned=""
          if [ -f build/guest-release.json ]; then
            pinned=$(python3 -c "import json;print(json.load(open('build/guest-release.json')).get('image',''))")
          fi
          if [ -n "${CHROMELESS_IMAGE_OVERRIDE}" ]; then
            resolved="${CHROMELESS_IMAGE_OVERRIDE}"
            echo "::notice::worker image from the CHROMELESS_IMAGE repo variable (OVERRIDE): ${resolved}"
            echo "  tree pin (build/guest-release.json) says: ${pinned}"
          else
            resolved="${pinned}"
            echo "worker image from build/guest-release.json: ${resolved}"
          fi
          echo "CHROMELESS_IMAGE=${resolved}" >> "$GITHUB_ENV"

      - name: Check for a supplied worker image
        id: probe
        run: |
          # CHROMELESS_IMAGE comes from GITHUB_ENV, set by the resolve step.
          if [ -z "${CHROMELESS_IMAGE:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no worker image resolved — build/guest-release.json has no image, or the CHROMELESS_IMAGE override is an empty string."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # C2: private-registry login — see ci.yml's identical step for the
      # conditional-secrets rationale (forks / GitHub keep working with a
      # public image and no secrets).
      - name: Registry login (if credentials provided)
        if: steps.probe.outputs.present == 'true' && env.REGISTRY_PASSWORD != ''
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          registry="${CHROMELESS_IMAGE%%/*}"
          echo "${REGISTRY_PASSWORD}" | docker login "${registry}" \
            --username "${REGISTRY_USERNAME}" --password-stdin

      - name: Pull the worker image
        if: steps.probe.outputs.present == 'true'
        run: docker pull "${CHROMELESS_IMAGE}"

      - name: Run gate (scaffold)
        if: steps.probe.outputs.present == 'true'
        run: node verification/native-peer-gate.mjs --scaffold --image="${CHROMELESS_IMAGE}" > gate-output.json
        # Scaffold permits NYI per the gate-blocking schedule; expected to be
        # green for the whole M0..M6 window (and after M7 if implementation
        # holds).

      # OSS-W2: `actions/upload-artifact@v4` cannot work on this CI host. It
      # resolves and runs, then fails the step outright:
      #   GHESNotSupportedError: @actions/artifact v2.0.0+, upload-artifact@v4+
      #   and download-artifact@v4+ are not currently supported on GHES.
      # v4 talks to GitHub's artifact backend service, which Forgejo does not
      # implement (v3 used the older API and is deprecated upstream). Because
      # the step ran with `if: always()`, it failed the job AFTER the gate had
      # already printed `verdict=PASS exitCode=0` — a green gate reported red
      # by its own artifact upload (observed 2026-07-30, run 208899).
      #
      # The JSON is small and its only consumer is a human reading the run, so
      # print it into the log instead. `Print gate JSON` above already does
      # exactly that; this makes the log the artifact rather than pretending
      # an upload happened.
      - name: Print gate JSON
        if: always() && steps.probe.outputs.present == 'true'
        run: |
          echo "--- gate-output.json (artifact upload is unsupported on this host) ---"
          cat gate-output.json || true

  native-peer-gate-strict:
    name: native-peer-gate-strict (M7 gate)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'priority' }}
    # Strict runs on PRs targeting main (so the M7 squash-merge MUST be
    # green-strict) AND on pushes to integration/native-peer (operator
    # check). Other PRs see only the scaffold job.
    if: |
      (github.server_url != 'https://github.com' || vars.CHROMELESS_IMAGE != '') &&
      ((github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/integration/native-peer'))
    steps:
      - uses: actions/checkout@v4

      # OSS-W2: see the scaffold job's identical step — setup-node ships a
      # glibc node this musl job container cannot exec.
      - name: Node version (image-provided)
        run: |
          command -v node >/dev/null 2>&1 || {
            echo "::error::no node in the job image; the gate is a node script"
            exit 1
          }
          echo "node: $(node --version)"

      # Resolve the worker image from the TREE, not from a forge setting.
      # See e2e.yml's copy of this step for the full account: the repo variable
      # is invisible to a checkout, and it went three weeks stale (2026-08-19,
      # task 340536) with no check able to say so. The file is the reviewable
      # default; the variable still wins when set, as an explicit override.
      # tools/lint/guest_release_lint.py fails if this file stops being read.
      - name: Resolve the worker image
        id: image
        env:
          CHROMELESS_IMAGE_OVERRIDE: ${{ vars.CHROMELESS_IMAGE }}
        run: |
          set -eu
          # Absence is legitimate — a fork with no build of its own has nothing
          # to pin (guest_release_lint.py makes the same allowance), so this
          # must not hard-fail. It falls through to the override, and then to
          # the probe's skip.
          pinned=""
          if [ -f build/guest-release.json ]; then
            pinned=$(python3 -c "import json;print(json.load(open('build/guest-release.json')).get('image',''))")
          fi
          if [ -n "${CHROMELESS_IMAGE_OVERRIDE}" ]; then
            resolved="${CHROMELESS_IMAGE_OVERRIDE}"
            echo "::notice::worker image from the CHROMELESS_IMAGE repo variable (OVERRIDE): ${resolved}"
            echo "  tree pin (build/guest-release.json) says: ${pinned}"
          else
            resolved="${pinned}"
            echo "worker image from build/guest-release.json: ${resolved}"
          fi
          echo "CHROMELESS_IMAGE=${resolved}" >> "$GITHUB_ENV"

      - name: Check for a supplied worker image
        id: probe
        run: |
          # CHROMELESS_IMAGE comes from GITHUB_ENV, set by the resolve step.
          if [ -z "${CHROMELESS_IMAGE:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CHROMELESS_IMAGE repo variable not set — strict gate skipped. Set it to a cloud_browser_worker image to enable."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # C2: private-registry login — see ci.yml's identical step for the
      # conditional-secrets rationale (forks / GitHub keep working with a
      # public image and no secrets).
      - name: Registry login (if credentials provided)
        if: steps.probe.outputs.present == 'true' && env.REGISTRY_PASSWORD != ''
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          registry="${CHROMELESS_IMAGE%%/*}"
          echo "${REGISTRY_PASSWORD}" | docker login "${registry}" \
            --username "${REGISTRY_USERNAME}" --password-stdin

      - name: Pull the worker image
        if: steps.probe.outputs.present == 'true'
        run: docker pull "${CHROMELESS_IMAGE}"

      # OSS-W2: strict cannot pass today, and that is a property of the gate,
      # not of the image. Strict requires every assertion to be PASS —
      # NOT_YET_IMPLEMENTED counts as FAIL (verdict.mjs computeVerdict). But
      # #3 codec-cap and #4 native-peer are still M0 shims that return NYI
      # unconditionally, and #3's real probe needs `ctx.client` from the R7
      # boot harness — which `runGate` never constructs. So there is no
      # --position value, and no image, that makes strict green: it is
      # unsatisfiable by construction until M1/M3 wire those two probes.
      #
      # Before CHROMELESS_IMAGE was set, this job "passed" only by skipping
      # (probe present=false → no gate run at all). Setting the var in C2 made
      # it run for the first time — and it failed, correctly, reporting
      # exactly the two NYIs. #1 and #2 now PASS against the real image with
      # `mode: docker` evidence, which is new and is the part that was worth
      # having.
      #
      # Keep running it (the JSON is the honest status of the M7 surface), but
      # don't fail the PR on a gate whose own probes are unimplemented. The
      # scaffold job is the required check per verification/README.md; strict
      # becomes required when M1+M3 land and this continue-on-error comes off.
      - name: Run gate (strict)
        if: steps.probe.outputs.present == 'true'
        continue-on-error: true
        run: node verification/native-peer-gate.mjs --strict --image="${CHROMELESS_IMAGE}" > gate-strict-output.json

      # OSS-W2: no upload-artifact — see the scaffold job's note (v4 is
      # GHES-unsupported on this host and fails the job even when the gate
      # itself passed).
      - name: Print gate JSON
        if: always() && steps.probe.outputs.present == 'true'
        run: |
          echo "--- gate-strict-output.json (artifact upload is unsupported on this host) ---"
          cat gate-strict-output.json || true
