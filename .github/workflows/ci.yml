# .github/workflows/ci.yml — chromeless CI baseline
#
# Triggers: every PR, plus pushes to main. concurrency: in-flight runs on
# the same ref are cancelled when a new commit arrives, so superseded
# work doesn't pin runners.
#
# Job map:
#   lint        hadolint Dockerfile, gofmt+vet signaling, tsc client
#   build-image docker build infra/Dockerfile, push layer cache to gha
#   smoke       runs tests/smoke/container-boot.sh if present (T9 gates)
#   docs        lychee link check across markdown
#
# Wall-time target: <10 min total. We split lint and build-image so a
# typo in a Go file doesn't block image builds and vice versa, and the
# Docker layer cache is shared between build-image and smoke via gha.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dockerfile lint
      - name: hadolint
        # Forgejo resolves bare third-party actions against data.forgejo.org,
        # which does not mirror this repository. Pin the upstream host so the
        # lint gate can actually start.
        uses: https://github.com/hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: infra/Dockerfile

      # Go signaling server: gofmt + vet
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: signaling/go.sum

      - name: gofmt
        working-directory: signaling
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: signaling
        run: go vet ./...

      # Client: TypeScript typecheck. ESLint is run only when the project
      # actually has a config file — webrtc-dev hasn't added one yet, so
      # we skip cleanly with a notice instead of failing.
      # The runner image already carries Node. setup-node writes to a shared
      # host toolcache, and concurrent jobs can delete that runtime underneath
      # one another. Install only npm inside this isolated job container.
      - name: Install npm
        run: apk add --no-cache npm

      - name: Install client deps
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        working-directory: client
        run: npm run typecheck

      - name: ESLint (if configured)
        working-directory: client
        run: |
          if [ -f .eslintrc.cjs ] || [ -f .eslintrc.json ] || [ -f .eslintrc.yaml ] || [ -f eslint.config.js ] || [ -f eslint.config.mjs ]; then
            npx eslint .
          else
            echo "::notice::No ESLint config in client/ — skipping. Add eslint.config.js to enable."
          fi

  build-image:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build chromeless:ci
        uses: docker/build-push-action@v5
        with:
          # Context is repo root: the Dockerfile COPYs both
          # capture/streamer-page/ (T28) and infra/*, so it needs the
          # whole tree in build context.
          context: .
          file: infra/Dockerfile
          tags: chromeless:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4

      # T9 owns tests/smoke/container-boot.sh. Until that lands, skip the
      # whole job with a clear notice rather than fail. Once T9 ships,
      # this branch is taken automatically — no workflow edit required.
      - name: Probe for smoke script
        id: probe
        run: |
          if [ -f tests/smoke/container-boot.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tests/smoke/container-boot.sh not present (T9 pending) — smoke test skipped."
          fi

      - name: Set up Buildx
        if: steps.probe.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Restore image (uses build-image's cache)
        if: steps.probe.outputs.present == 'true'
        uses: docker/build-push-action@v5
        with:
          # Context is repo root: the Dockerfile COPYs both
          # capture/streamer-page/ (T28) and infra/*, so it needs the
          # whole tree in build context.
          context: .
          file: infra/Dockerfile
          tags: chromeless:ci
          load: true
          cache-from: type=gha

      - name: Run smoke
        if: steps.probe.outputs.present == 'true'
        run: |
          chmod +x tests/smoke/container-boot.sh
          ./tests/smoke/container-boot.sh

  docs:
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lychee link check
        shell: sh
        run: |
          set -eu
          version=0.24.2
          asset=lychee-x86_64-unknown-linux-musl.tar.gz
          base="https://github.com/lycheeverse/lychee/releases/download/lychee-v${version}"
          curl -fsSLO "${base}/${asset}"
          curl -fsSLO "${base}/${asset}.sha256"
          sha256sum -c "${asset}.sha256"
          tar -xzf "${asset}"
          lychee=./lychee-x86_64-unknown-linux-musl/lychee
          test -x "${lychee}"
          "${lychee}" \
            --verbose \
            --no-progress \
            --max-concurrency 4 \
            --exclude-path node_modules \
            './**/*.md'
