# .github/workflows/ci.yml — chromeless CI baseline
#
# Triggers: every PR, plus pushes to main. concurrency: in-flight runs on
# the same ref are cancelled when a new commit arrives, so superseded
# work doesn't pin runners.
#
# Job map:
#   lint        hadolint runtime Dockerfile, gofmt+vet signaling,
#               tsc + vitest client
#   smoke       runs tests/smoke/container-boot.sh against a supplied
#               worker image (opt-in via the CHROMELESS_IMAGE repo var)
#   docs        lychee link check across markdown
#
# Wall-time target: <10 min total.
#
# OSS-W1 note: there is no image-build job. The browser is a from-source
# Chromium build (4-8h cold — see build/chromeless-build.sh) that cannot be
# produced on a GHA runner. The previous `build-image` job built
# infra/Dockerfile, the legacy stock-Chromium + getDisplayMedia image, which
# had been unbuildable since the M7 native-peer migration deleted
# capture/streamer-page/ while the Dockerfile still COPYd it.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    # Forgejo stopgap (2026-08-20): use `priority`; GitHub uses its hosted runner.
    #
    # `docker` and `ubuntu-latest` are served by the SAME 10 general runners, and
    # tf-multiverse saturated them: measured 470 queued `docker` jobs against 19
    # `ubuntu-latest`, all 18 general slots held by `docker`, and **zero**
    # `ubuntu-latest` jobs started in 30 minutes. chromeless jobs waited 56-61
    # min and were not going to get a slot — arrivals were running at 285/30min
    # against 147 completing, so the backlog was growing, not draining.
    #
    # The `priority` pool (6 express replicas x capacity 2 = 12 slots) had 3 in
    # use. It has the same shape as the general pool — dind + dind-gc + runner,
    # 16Gi docker storage, capacity 2 — so nothing here depends on a runner
    # feature the general pool had and this one lacks.
    #
    # ⚠ It is NOT free: `priority` exists for tf-multiverse's own fast lane
    # (portal SSR check, cargoless-serve image builds). This borrows capacity
    # that belongs to someone else, so it is a stopgap until chromeless has its
    # own pool — see the split design. If the express pool starts queueing,
    # this is why.
    #
    # ⚠ Express dind has 8Gi memory vs the general pool's 16Gi. The e2e stack
    # (Chromium + 1GB shm + three small services) is expected to fit, but this
    # is the one difference between the pools that could bite. An OOM in
    # `compose up` here is THIS, not a product defect.
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'priority' }}
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-public-ownership

      # Dockerfile lint.
      #
      # OSS-W1: retargeted from the deleted infra/Dockerfile (legacy
      # stock-Chromium image) to the real runtime image definition.
      #
      # OSS-W2: run via the container image rather than
      # `uses: hadolint/hadolint-action`, which 404s on Forgejo's action
      # mirror. Forgejo resolves every `uses:` before running ANY step, so
      # that one unresolvable action killed the whole Lint job — the log
      # shows "skipping post step for 'hadolint'; step was not executed"
      # followed immediately by "Job failed". Nothing in Lint ever ran.
      #
      # Two details that cost a red run on 2026-07-30 (Lint passed at 09:10Z
      # and failed at 13:06Z with an unchanged Dockerfile):
      #
      #   * the image tag was `:latest`, unpinned. hadolint rolled between the
      #     two runs and the new version reports two more findings. Pin it, so
      #     a lint result is a property of this repo, not of what upstream
      #     published this morning.
      #   * no --failure-threshold was set, so hadolint's default (`info`)
      #     applies and ANY info-level finding fails the job. The two it now
      #     reports are both deliberate:
      #       DL3025 (line 239) — HEALTHCHECK must be shell form; the check is
      #         `curl … || exit 1`, and JSON/exec form cannot express `||`.
      #       DL3066 (line 242) — `USER cbuser` is a named user on purpose
      #         (the image creates it); a bare uid would lose that intent.
      #     Threshold `warning` keeps error-class findings fatal (which is
      #     what a Dockerfile lint is for) without gating on style advice we
      #     have already considered and rejected.
      - name: hadolint
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 \
            hadolint --failure-threshold warning - < build/Dockerfile.runtime

      # OSS-W2: static include check for the Chromium embedder. capture/
      # only compiles inside a full Chromium checkout (4-8 h), so a missing
      # #include otherwise surfaces hours later in the build lane — or not
      # at all, if the lane isn't watched. Runs in ~1 s with no Chromium.
      # Also runs the linter's own self-tests, so a broken linter fails
      # loudly rather than silently passing everything.
      - name: C++ include lint
        run: |
          python3 tools/lint/test_cxx_include_lint.py
          python3 tools/lint/cxx_include_lint.py capture

      # OSS-W2: every `uses:` must resolve on the CI host's action mirror.
      # Forgejo git-clones them all BEFORE running any step, so one missing
      # action fails the whole job regardless of its `if:`. This caused the
      # majority of this repo's historical CI failures.
      - name: Workflow actions lint
        run: python3 tools/lint/workflow_actions_lint.py

      # OSS-W2: `local` outside a function is a RUNTIME error in bash, and
      # `bash -n` does not catch it — it is not a syntax error. The build
      # orchestrator is ~700 lines of top-level shell where one such slip
      # aborts a step silently: STEP 7 logged its START banner and stopped,
      # 27 minutes into a t7 build, after a clean 745-second compile
      # (2026-07-30). This runs in milliseconds and fails on the same
      # condition.
      - name: Shell top-level `local` lint
        run: python3 tools/lint/shell_toplevel_local_lint.py

      - name: Build credential log containment
        run: bash tests/runtime/build-credential-log-contract.sh

      # Go signaling server: gofmt + vet
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: signaling/go.sum

      - name: gofmt
        working-directory: signaling
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: signaling
        run: go vet ./...

      # Every Go module, not just signaling/. `make test-unit-go-modules`
      # already discovers them with `find -name go.mod`; this mirrors that
      # inline, because the CI host runs no make target.
      #
      # Nothing here ran ANY Go test until 2026-08-19. infra/gateway/ landed
      # with 31 of them and CI was green about none — which matters because the
      # only automated proof that `cmd/keygen` emits the worker's token is a
      # test in that module. A test no lane runs is not a check, it is a
      # comment; this repo has a lint for exactly that shape
      # (tools/lint/tests_wired_lint.py) and CI had the same hole.
      #
      # `find` rather than a hand-kept list, for the same reason the make
      # target uses one: a new module joins the gate automatically instead of
      # silently joining the ungated pile. tests/integration/ is excluded — it
      # builds a binary and boots it, which is `make test-integration`, not a
      # unit test.
      #
      # No -mod=mod: readonly is Go's default and the right one here. The
      # `replace` directives point at sibling directories, which readonly
      # resolves fine — what it refuses is silently rewriting a go.mod to
      # paper over a missing go.sum entry, and that refusal is the check.
      #
      # The loop does not stop at the first failure, for the same reason the
      # build lane has --keep-going: one pass should collect every broken
      # module rather than costing a full CI cycle per finding.
      #
      # NOTE: this widens the gate to modules never tested by any lane, and
      # infra/controllers/browser-session-controller pulls ~227 dependencies.
      # If it goes red on a resolution failure rather than a test failure,
      # that is a genuine finding — a module CI cannot even build — not a
      # reason to narrow the list back.
      - name: go test (every module)
        run: |
          set -uo pipefail
          fail=0
          for gomod in $(find . -name go.mod \
                           -not -path "./.claude/*" \
                           -not -path "./tests/integration/*" | sort); do
            d=$(dirname "$gomod")
            echo "::group::go test $d"
            if ( cd "$d" && go test -timeout 300s ./... ); then
              echo "ok"
            else
              echo "::error::go test failed in $d"
              fail=1
            fi
            echo "::endgroup::"
          done
          [ "$fail" -eq 0 ]

      # Client: TypeScript typecheck + unit tests. ESLint is run only when
      # the project actually has a config file, so we skip cleanly with a
      # notice instead of failing.
      #
      # OSS-W2: `actions/setup-node@v4` is deliberately NOT used. The CI host
      # maps `ubuntu-latest` to an ALPINE job container (ci-tools, musl libc),
      # and setup-node downloads the official node tarball — which is
      # dynamically linked against glibc. It extracts fine, so setup-node
      # reports success ("Adding to the cache…", "npm: 10.8.2"), then every
      # later step that resolves `node` from PATH dies:
      #
      #   /opt/hostedtoolcache/node/20.20.2/x64/bin/node: cannot execute:
      #     required file not found            <- /lib64/ld-linux-x86-64.so.2
      #   exec .../bin/node: no such file or directory   <- post-steps, 255
      #
      # Because the poisoned PATH persists, EVERY `post` step of EVERY
      # JS action in the job then fails with exit 255 and the job fails even
      # when its real work passed. Observed 2026-07-30: Lint's tsc + all 217
      # vitest tests PASSED, then "Post Set up Node"/"Post Set up Go"/"Post
      # checkout" each 255'd and the job reported failure. Both native-peer
      # gates and e2e died the same way with nothing of theirs having run.
      # `setup-go` is unaffected only because Go ships static binaries.
      #
      # ci-tools ships node v22 built against musl, which runs the whole
      # client suite (verified in-container: npm ci + tsc + 15 files / 217
      # tests green). Use what the image provides rather than installing an
      # ABI-incompatible one. If you re-add setup-node, pin a glibc job
      # container too, or this comes back.
      #
      # It does NOT ship npm (`npm: not found`, no npx) — node alone is
      # enough for the gate workflows but not for `npm ci`. Install npm from
      # the distro so it matches the image's own node ABI, which is the whole
      # point of not using setup-node. Guarded on apk/apt so this stays
      # portable to a GitHub-hosted runner, where npm is already present and
      # neither branch runs.
      - name: Node + npm (image-provided)
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::no node in the job image; add one or pin a container with node"
            exit 1
          fi
          if ! command -v npm >/dev/null 2>&1; then
            echo "npm absent; installing from the distro to match node's ABI"
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache npm >/dev/null
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq && apt-get install -y -qq npm >/dev/null
            fi
          fi
          if ! command -v npm >/dev/null 2>&1; then
            echo "::error::node present but npm could not be installed in this image"
            exit 1
          fi
          echo "node: $(node --version)  npm: $(npm --version)"

      - name: Install client deps
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        working-directory: client
        run: npm run typecheck

      # OSS-W1: the client carries 14 vitest suites (~200 assertions over
      # the input/cursor/clipboard/file-upload/stats/sdp/reconnect/auth/
      # turn/probe/simulcast/codec modules) that CI never ran — only
      # `typecheck` was wired, so every one of those tests was ungated.
      - name: Client unit tests
        working-directory: client
        run: npm test

      - name: ESLint (if configured)
        working-directory: client
        run: |
          if [ -f .eslintrc.cjs ] || [ -f .eslintrc.json ] || [ -f .eslintrc.yaml ] || [ -f eslint.config.js ] || [ -f eslint.config.mjs ]; then
            npx eslint .
          else
            echo "::notice::No ESLint config in client/ — skipping. Add eslint.config.js to enable."
          fi

      # Track 7: the conformance kit's OWN tests. These are pure node:test
      # with no network and no image — they lock the kit's IO contract
      # (stdout/stderr separation, exit codes, evidence shape) and its
      # verdict algebra. Running the kit AGAINST a deployment is a separate
      # thing and lives in the smoke job, where an image actually exists.
      #
      # `node --test <dir>` stopped accepting a bare directory in newer
      # Node (26 errors with MODULE_NOT_FOUND), so glob explicitly rather
      # than depending on the runner's Node minor.
      - name: Conformance kit self-tests
        run: node --test 'conformance/__tests__/*.test.mjs'

  smoke:
    name: Container smoke test
    # The tree pin currently lives in Triform's private registry. Public GitHub
    # runs must not receive that registry credential; opt them in only after a
    # public worker image is configured as a repository variable.
    if: github.server_url != 'https://github.com' || vars.CHROMELESS_IMAGE != ''
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'priority' }}
    steps:
      - uses: actions/checkout@v4

      # OSS-W1: the smoke needs a real cloud_browser_worker image, and there
      # is no way to produce one here — the browser is a from-source Chromium
      # build (4-8h cold; see build/chromeless-build.sh) that cannot run on a
      # 4-vCPU GHA runner, and this project does not publish images.
      #
      # So the job is opt-in: set the CHROMELESS_IMAGE repository variable to
      # an image your own build produced and the smoke runs against it.
      # Unset, the job reports a notice and passes.
      #
      # This replaces a `build-image` job that built infra/Dockerfile — the
      # legacy stock-Chromium + getDisplayMedia image, which had been
      # unbuildable since the M7 native-peer migration deleted
      # capture/streamer-page/ (the Dockerfile still COPYd it). That job had
      # been failing on every run; it is deleted rather than repaired
      # because the image contained none of the product.
      # Resolve the worker image from the TREE, not from a forge setting.
      # See e2e.yml's copy of this step for the full account: the repo variable
      # is invisible to a checkout, and it went three weeks stale (2026-08-19,
      # task 340536) with no check able to say so. The file is the reviewable
      # default; the variable still wins when set, as an explicit override.
      # tools/lint/guest_release_lint.py fails if this file stops being read.
      - name: Resolve the worker image
        id: image
        env:
          CHROMELESS_IMAGE_OVERRIDE: ${{ vars.CHROMELESS_IMAGE }}
        run: |
          set -eu
          # Absence is legitimate — a fork with no build of its own has nothing
          # to pin (guest_release_lint.py makes the same allowance), so this
          # must not hard-fail. It falls through to the override, and then to
          # the probe's skip.
          pinned=""
          if [ -f build/guest-release.json ]; then
            pinned=$(python3 -c "import json;print(json.load(open('build/guest-release.json')).get('image',''))")
          fi
          if [ -n "${CHROMELESS_IMAGE_OVERRIDE}" ]; then
            resolved="${CHROMELESS_IMAGE_OVERRIDE}"
            echo "::notice::worker image from the CHROMELESS_IMAGE repo variable (OVERRIDE): ${resolved}"
            echo "  tree pin (build/guest-release.json) says: ${pinned}"
          else
            resolved="${pinned}"
            echo "worker image from build/guest-release.json: ${resolved}"
          fi
          echo "CHROMELESS_IMAGE=${resolved}" >> "$GITHUB_ENV"

      - name: Check for a supplied worker image
        id: probe
        run: |
          # CHROMELESS_IMAGE comes from GITHUB_ENV, set by the resolve step.
          if [ -z "${CHROMELESS_IMAGE:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no worker image resolved — build/guest-release.json has no image, or the CHROMELESS_IMAGE override is an empty string."
          elif [ ! -f tests/smoke/container-boot.sh ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tests/smoke/container-boot.sh missing — container smoke skipped."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # C2: CHROMELESS_IMAGE points at a private registry
      # (registry.triform.cloud). Login is conditional on the secrets
      # existing so a fork (or GitHub, where these secrets are absent)
      # that sets a PUBLIC image still works without them. `docker login`
      # via stdin keeps the password out of argv/process listings.
      - name: Registry login (if credentials provided)
        if: steps.probe.outputs.present == 'true' && env.REGISTRY_PASSWORD != ''
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          registry="${CHROMELESS_IMAGE%%/*}"
          echo "${REGISTRY_PASSWORD}" | docker login "${registry}" \
            --username "${REGISTRY_USERNAME}" --password-stdin

      - name: Pull the worker image
        if: steps.probe.outputs.present == 'true'
        run: docker pull "${CHROMELESS_IMAGE}"

      # SMOKE_IMAGE_TAG must be the RESOLVED image, not the raw repo variable.
      # Reading `vars.CHROMELESS_IMAGE` here meant the step above pulled one
      # image and this step booted another — and with the variable unset (the
      # state this repo was actually in) it booted the empty string, so the
      # script fell through to its `chromeless:ci` auto-detect default and
      # smoke-tested an image nobody had asked for.
      - name: Run smoke
        if: steps.probe.outputs.present == 'true'
        env:
          SMOKE_IMAGE_TAG: ${{ env.CHROMELESS_IMAGE }}
        run: |
          chmod +x tests/smoke/container-boot.sh
          ./tests/smoke/container-boot.sh

      # Track 7: run the conformance kit against the SAME image the smoke
      # just proved boots. This is the kit's own dogfood — if the reference
      # implementation cannot pass its own conformance suite, the suite is
      # wrong and we want to know from CI rather than from a third party.
      #
      # Three mechanics, all learned the hard way:
      #
      #   * DevTools binds 127.0.0.1 only (Chromium 147 ignores
      #     --remote-debugging-address), so `-p 9222` cannot reach it. We
      #     join the worker's network namespace with
      #     `--network container:<id>` instead — the same reason
      #     tests/smoke/container-boot.sh drives CDP via `docker exec`.
      #
      #   * the runtime image ships no node (correct — it is a browser, not
      #     a toolchain), so the kit runs from node:22-alpine.
      #
      #   * DO NOT bind-mount the kit with `-v "${PWD}/conformance:/conf"`.
      #     Bind sources are resolved by the DAEMON, which on this host is a
      #     sibling dind with its own filesystem — it cannot see the job's
      #     checkout, silently creates an empty directory at that path, and
      #     the run dies with `Cannot find module '/conf/run.mjs'`. That is
      #     the identical trap e2e.yml's "Probe daemon filesystem sharing"
      #     step exists for, and this step walked into it on its first run
      #     (2026-07-30). `docker cp` moves the files through the daemon's
      #     own API, so it works whether or not the filesystem is shared.
      - name: Conformance kit vs the worker image
        if: steps.probe.outputs.present == 'true'
        run: |
          set -euo pipefail
          cid=$(docker run -d --rm --shm-size=1g "${CHROMELESS_IMAGE}")
          runner=""
          cleanup() {
            [ -n "${runner}" ] && docker rm -f "${runner}" >/dev/null 2>&1 || true
            docker rm -f "$cid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if docker exec "$cid" curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then
              echo "devtools up after ${i}s"; break
            fi
            sleep 1
          done
          # Create → copy → start, so the kit is inside the container's own
          # filesystem before node looks for it.
          runner=$(docker create --network "container:${cid}" node:22-alpine \
            node /conf/run.mjs --target=http://127.0.0.1:9222 --role=cdp)
          docker cp conformance/. "${runner}:/conf"
          docker start -a "${runner}"

  docs:
    name: Docs link check
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'priority' }}
    steps:
      - uses: actions/checkout@v4

      # OSS-W2: run lychee from its container rather than
      # `uses: lycheeverse/lychee-action`, which 404s on Forgejo's action
      # mirror and therefore failed this job before any step executed.
      #
      # --no-progress keeps logs short. --max-concurrency caps load on
      # third-party hosts. Localhost examples are not external links; the three
      # named research sources return bot-only 403/406 responses while remaining
      # reachable in browsers, so exclude those exact citation URLs. The image
      # digest is the one proven by the first public GitHub run.
      - name: lychee link check
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            lycheeverse/lychee@sha256:eaff3e0a13603c9a701accfcc84f44158bb77bf36ecfa4622b626056c3463892 \
            --verbose \
            --no-progress \
            --max-concurrency 4 \
            --exclude '^https?://localhost(:[0-9]+)?/' \
            --exclude '^https://www\.cdnetworks\.com/blog/media-delivery/compression-standards-explained/' \
            --exclude '^https://bitmovin\.com/blog/apple-av1-support/' \
            --exclude '^https://www\.neowin\.net/news/firefox-134-finally-gets-windows-hardware-h265-support-improves-popup-blocking-and-more/' \
            --exclude-path node_modules \
            --exclude-path .claude \
            './**/*.md'
