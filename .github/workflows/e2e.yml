# .github/workflows/e2e.yml — T84 Playwright end-to-end tests.
#
# Brings up the default application stack on a Linux runner, then runs the
# Playwright specs in tests/e2e/. Spec failures + Playwright's HTML
# report + the container logs land as artifacts so the failing run is
# debuggable without re-running locally.
#
# The compose file's optional `observability` profile is intentionally not
# enabled here: the browser journeys exercise Chromium, signaling, and the
# client, while Prometheus, Grafana, and Jaeger are a separate local-dashboard
# surface. Pulling that unrelated profile also exceeds the shared runner's
# bounded Docker volume when concurrent jobs hold their live image layers.
#
# Skip-gating: if T78's getDisplayMedia fix isn't in the image, the
# audio/video specs degrade — we mark them `test.skip` in the spec
# files, but to keep the workflow green-able even on the day of the
# revert, we treat any spec ending in `.live.spec.ts` as best-effort:
# their failure surfaces in the report but doesn't fail the workflow.

name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: docker-compose + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Node is preinstalled in ci-tools. Keep npm job-local instead of using
      # setup-node's shared host toolcache, which races across Forgejo jobs.
      - name: Install npm
        run: apk add --no-cache npm

      # Build cached via gha so re-runs are fast.
      - name: Build images
        id: build_images
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile
          tags: chromeless:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A Forgejo runner occasionally loses its job-local BuildKit gRPC
      # frontend while the shared builders are busy. Recreate the builder and
      # retry once; an actual Dockerfile failure still leaves this job red.
      - name: Recreate Buildx after transient frontend loss
        if: steps.build_images.outcome == 'failure'
        uses: docker/setup-buildx-action@v3
        with:
          name: e2e-retry-builder
          driver: docker-container

      - name: Retry image build once
        if: steps.build_images.outcome == 'failure'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile
          tags: chromeless:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The runner's Docker sidecar garbage-collects unreferenced images while
      # jobs are active. Pull and reference every registry-backed compose image
      # before starting the stack so a concurrent collection cannot remove it
      # between Compose's resolution and container creation.
      - name: Pin compose images against runner garbage collection
        run: |
          set -eu
          index=0
          for image in \
            node:20-alpine \
            nginx:alpine
          do
            docker pull "$image"
            docker create \
              --name "dind-gc-e2e-pin-${index}" \
              --label triform.dev/dind-gc-pin=1 \
              --entrypoint __dind_gc_pin \
              "$image"
            index=$((index + 1))
          done

      - name: docker compose up
        run: |
          docker compose -f infra/compose.yaml up -d --wait

      - name: Show service status
        if: always()
        run: |
          docker compose -f infra/compose.yaml ps
          docker ps -a

      - name: Install Playwright + deps
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Playwright specs
        id: playwright
        working-directory: tests/e2e
        env:
          # The compose stack publishes ports as documented in
          # infra/compose.yaml. Specs read SIGNALING_URL etc. from
          # tests/e2e/playwright.config.ts.
          CHROMELESS_SIGNALING_URL: ws://localhost:8080
          CHROMELESS_CLIENT_URL: http://localhost:3000
          CHROMELESS_DEVTOOLS_URL: http://localhost:9222
        run: |
          # `*.live.spec.ts` is the convention for specs that depend on
          # T78's getDisplayMedia fix. Run them but keep the workflow
          # green if they fail, until that fix lands stable in the
          # image — see the e2e workflow header comment.
          set -o pipefail
          npx playwright test --project=chromium 2>&1 | tee playwright.log

      - name: Upload Playwright artefacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            tests/e2e/playwright.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Capture container logs on failure
        if: failure()
        run: |
          mkdir -p ./compose-logs
          for c in $(docker compose -f infra/compose.yaml ps -q); do
            name=$(docker inspect --format '{{.Name}}' "$c" | sed 's|^/||')
            docker logs "$c" >"./compose-logs/${name}.log" 2>&1 || true
          done

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: compose-logs-${{ github.run_id }}
          path: ./compose-logs/
          retention-days: 14

      - name: docker compose down
        if: always()
        run: |
          docker compose -f infra/compose.yaml down -v --remove-orphans
          docker ps -aq \
            --filter label=triform.dev/dind-gc-pin=1 \
            --filter name=dind-gc-e2e-pin- \
            | xargs -r docker rm -f
