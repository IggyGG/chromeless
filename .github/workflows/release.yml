# .github/workflows/release.yml — T84 release pipeline.
#
# Triggered by pushing a `v*.*.*` tag. Builds the four shippable
# images, signs them with cosign (keyless / OIDC), pushes to GHCR with
# semver and `latest` tags, attaches an SBOM per image as a workflow
# artifact, and publishes auto-generated release notes.
#
# Image set — the Go control-plane services only:
#   chromeless-signaling    signaling/Dockerfile
#   chromeless-controller   infra/controllers/.../Dockerfile
#   chromeless-turn-issuer  infra/turn-issuer/Dockerfile
#
# The browser itself is deliberately absent — see the matrix comment below.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "version tag (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write       # for gh release create
  packages: write       # for ghcr push
  id-token: write       # for cosign keyless signing
  attestations: write   # for build provenance attestations

env:
  REGISTRY: ghcr.io
  REPO_LOWER: ${{ github.repository }}

jobs:
  build:
    name: Build + sign images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # OSS-W1: the `chromeless` row is gone. It built infra/Dockerfile,
          # the legacy stock-Chromium + getDisplayMedia image — not the
          # product, and unbuildable since the M7 native-peer migration
          # deleted capture/streamer-page/ while the Dockerfile still COPYd
          # it. The real browser (build/Dockerfile.runtime, wrapping
          # cloud_browser_worker) is NOT published here: it is a from-source
          # Chromium build (4-8h cold, see build/chromeless-build.sh) that
          # cannot run on a GHA runner. Build it yourself with
          # build/chromeless-build.sh and push to your own registry; see
          # docs/contribute/build-chromium.md.
          - image: chromeless-signaling
            dockerfile: signaling/Dockerfile
            context: signaling
          - image: chromeless-controller
            dockerfile: infra/controllers/browser-session-controller/Dockerfile
            context: infra/controllers/browser-session-controller
          - image: chromeless-turn-issuer
            dockerfile: infra/turn-issuer/Dockerfile
            context: infra/turn-issuer

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo path
        id: repo
        run: |
          echo "lower=$(echo '${{ env.REPO_LOWER }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lower }}/${{ matrix.image }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lower }}/${{ matrix.image }}:latest
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless / OIDC)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ steps.repo.outputs.lower }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}"

      # OSS-W2: `anchore/sbom-action` 404s on Forgejo's action mirror, which
      # would fail this job before any step ran. The action only installs
      # syft, so use anchore's own installer script directly.
      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          syft version

      - name: Generate SBOM (SPDX-JSON)
        run: |
          syft \
            "${{ env.REGISTRY }}/${{ steps.repo.outputs.lower }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}" \
            -o spdx-json="sbom-${{ matrix.image }}-${{ steps.tag.outputs.value }}.spdx.json"

      - name: Upload SBOM artefact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}-${{ steps.tag.outputs.value }}
          path: sbom-${{ matrix.image }}-${{ steps.tag.outputs.value }}.spdx.json
          retention-days: 90

      # OSS-W2: the `actions/attest-build-provenance@v2` step that lived here
      # is REMOVED, not disabled.
      #
      # It does not exist on Forgejo's action mirror
      # (data.forgejo.org/actions/attest-build-provenance → 404), and the
      # attestation API it calls is GitHub-specific. Critically, an `if:`
      # guard would NOT have helped: Forgejo's runner resolves (git-clones)
      # every `uses:` in the job BEFORE executing any step, so an
      # unresolvable action fails the whole job regardless of its condition.
      # That is exactly how `actions/github-script` in harness-loopback.yml
      # failed 56 runs — the log shows "step was not executed" for every
      # step, including checkout.
      #
      # Images are still cosign-signed and carry an SBOM above, which is the
      # portable half of the supply-chain story. A GitHub mirror that wants
      # keyless attestation should add it in a GitHub-only workflow file
      # rather than here.

  release-notes:
    name: Generate release notes
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tags
        id: tags
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            CURRENT="${{ inputs.tag }}"
          else
            CURRENT="${GITHUB_REF#refs/tags/}"
          fi
          PREVIOUS=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n2 | tail -n1)
          [ "$PREVIOUS" = "$CURRENT" ] && PREVIOUS=""
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          {
            echo "## Chromeless ${{ steps.tags.outputs.current }}"
            echo
            if [ -n "${{ steps.tags.outputs.previous }}" ]; then
              echo "### Commits since ${{ steps.tags.outputs.previous }}"
              echo
              git log --pretty=format:'- %s (%h)' \
                  "${{ steps.tags.outputs.previous }}..${{ steps.tags.outputs.current }}"
              echo
            else
              echo "### Initial release"
              echo
              git log --pretty=format:'- %s (%h)' "${{ steps.tags.outputs.current }}"
              echo
            fi
            echo
            echo "### Images"
            echo
            for img in chromeless chromeless-signaling chromeless-controller chromeless-turn-issuer; do
              echo "- \`${{ env.REGISTRY }}/$(echo "${{ env.REPO_LOWER }}" | tr '[:upper:]' '[:lower:]')/${img}:${{ steps.tags.outputs.current }}\`"
            done
            echo
            echo "Each image is signed (cosign keyless) and accompanied by an SBOM (SPDX-JSON) attached as a workflow artefact."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # OSS-W2: `softprops/action-gh-release` 404s on Forgejo's action
      # mirror, which would fail this job before any step ran. Forgejo's
      # release API is GitHub-compatible enough for this, so call it
      # directly and stay portable across both hosts.
      - name: Create / update release
        env:
          API_TOKEN: ${{ secrets.RELEASE_API_TOKEN || github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tags.outputs.current }}
        run: python3 tools/ci/publish_release.py
