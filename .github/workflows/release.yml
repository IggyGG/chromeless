# .github/workflows/release.yml — T84 release pipeline.
#
# Triggered by pushing a `v*.*.*` tag. Builds the four shippable
# images, signs them with cosign (keyless / OIDC), pushes to GHCR with
# semver and `latest` tags, attaches an SBOM per image as a workflow
# artifact, and publishes auto-generated release notes.
#
# Image set (matches T7/T13/T71/T76 commits):
#   cb-chromium                  infra/Dockerfile          (whole-pod runtime)
#   cb-signaling                 signaling/Dockerfile      (T13)
#   cb-browser-session-controller infra/controllers/.../Dockerfile (T71)
#   cb-turn-issuer               infra/turn-issuer/Dockerfile (T76)

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "version tag (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write       # for gh release create
  packages: write       # for ghcr push
  id-token: write       # for cosign keyless signing
  attestations: write   # for build provenance attestations

env:
  REGISTRY: ghcr.io
  REPO_LOWER: ${{ github.repository }}

jobs:
  build:
    name: Build + sign images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cb-chromium
            dockerfile: infra/Dockerfile
            context: .
          - image: cb-signaling
            dockerfile: signaling/Dockerfile
            context: signaling
          - image: cb-browser-session-controller
            dockerfile: infra/controllers/browser-session-controller/Dockerfile
            context: infra/controllers/browser-session-controller
          - image: cb-turn-issuer
            dockerfile: infra/turn-issuer/Dockerfile
            context: infra/turn-issuer

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo path
        id: repo
        run: |
          echo "lower=$(echo '${{ env.REPO_LOWER }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lower }}/${{ matrix.image }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lower }}/${{ matrix.image }}:latest
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless / OIDC)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ steps.repo.outputs.lower }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (SPDX-JSON)
        run: |
          syft \
            "${{ env.REGISTRY }}/${{ steps.repo.outputs.lower }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}" \
            -o spdx-json="sbom-${{ matrix.image }}-${{ steps.tag.outputs.value }}.spdx.json"

      - name: Upload SBOM artefact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}-${{ steps.tag.outputs.value }}
          path: sbom-${{ matrix.image }}-${{ steps.tag.outputs.value }}.spdx.json
          retention-days: 90

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lower }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release-notes:
    name: Generate release notes
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tags
        id: tags
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            CURRENT="${{ inputs.tag }}"
          else
            CURRENT="${GITHUB_REF#refs/tags/}"
          fi
          PREVIOUS=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n2 | tail -n1)
          [ "$PREVIOUS" = "$CURRENT" ] && PREVIOUS=""
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          {
            echo "## Cloud-browser-webrtc ${{ steps.tags.outputs.current }}"
            echo
            if [ -n "${{ steps.tags.outputs.previous }}" ]; then
              echo "### Commits since ${{ steps.tags.outputs.previous }}"
              echo
              git log --pretty=format:'- %s (%h)' \
                  "${{ steps.tags.outputs.previous }}..${{ steps.tags.outputs.current }}"
              echo
            else
              echo "### Initial release"
              echo
              git log --pretty=format:'- %s (%h)' "${{ steps.tags.outputs.current }}"
              echo
            fi
            echo
            echo "### Images"
            echo
            for img in cb-chromium cb-signaling cb-browser-session-controller cb-turn-issuer; do
              echo "- \`${{ env.REGISTRY }}/$(echo "${{ env.REPO_LOWER }}" | tr '[:upper:]' '[:lower:]')/${img}:${{ steps.tags.outputs.current }}\`"
            done
            echo
            echo "Each image is signed (cosign keyless) and accompanied by an SBOM (SPDX-JSON) attached as a workflow artefact."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tags.outputs.current }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: false
