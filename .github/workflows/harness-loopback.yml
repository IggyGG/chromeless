# .github/workflows/harness-loopback.yml — T84 nightly harness
# regression. Runs the harness's loopback / aliased-warning / sink-lag /
# input-latency baselines on a fixed runner, compares the results to a
# stored baseline file, and files an issue when a sustained regression
# crosses the gate.
#
# The runner is intentionally `ubuntu-latest` — runner CPU varies
# day-to-day, so we use generous regression thresholds (5ms p50, 10ms
# p95). The "ground-truth" glass-to-glass measurements happen on the
# stable test rig (off CI); see docs/operations/runbook.md.

name: Harness regression

on:
  schedule:
    # 06:00 UTC daily; off business hours in most TZs.
    - cron: "7 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "harness/**"
      - "tests/harness/**"

permissions:
  contents: read
  issues: write

jobs:
  harness:
    name: Harness baselines
    # Forgejo stopgap (2026-08-20): use `priority`; GitHub uses its hosted runner.
    #
    # `docker` and `ubuntu-latest` are served by the SAME 10 general runners, and
    # tf-multiverse saturated them: measured 470 queued `docker` jobs against 19
    # `ubuntu-latest`, all 18 general slots held by `docker`, and **zero**
    # `ubuntu-latest` jobs started in 30 minutes. chromeless jobs waited 56-61
    # min and were not going to get a slot — arrivals were running at 285/30min
    # against 147 completing, so the backlog was growing, not draining.
    #
    # The `priority` pool (6 express replicas x capacity 2 = 12 slots) had 3 in
    # use. It has the same shape as the general pool — dind + dind-gc + runner,
    # 16Gi docker storage, capacity 2 — so nothing here depends on a runner
    # feature the general pool had and this one lacks.
    #
    # ⚠ It is NOT free: `priority` exists for tf-multiverse's own fast lane
    # (portal SSR check, cargoless-serve image builds). This borrows capacity
    # that belongs to someone else, so it is a stopgap until chromeless has its
    # own pool — see the split design. If the express pool starts queueing,
    # this is why.
    #
    # ⚠ Express dind has 8Gi memory vs the general pool's 16Gi. The e2e stack
    # (Chromium + 1GB shm + three small services) is expected to fit, but this
    # is the one difference between the pools that could bite. An OOM in
    # `compose up` here is THIS, not a product defect.
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'priority' }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness deps
        working-directory: harness
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run baselines
        id: baselines
        run: |
          mkdir -p .baselines-out
          # Each script writes a JSON summary to .baselines-out/<name>.json.
          for s in loopback-baseline.sh aliased-warning-baseline.sh \
                   sink-lag-baseline.sh input-latency-loopback.sh; do
            if [ -x "tests/harness/$s" ]; then
              echo "::group::$s"
              CHROMELESS_BASELINE_OUT=".baselines-out/${s%.sh}.json" \
                  bash "tests/harness/$s" || echo "$s exited non-zero"
              echo "::endgroup::"
            else
              echo "skip: tests/harness/$s missing or not executable"
            fi
          done

      - name: Compare against stored baseline
        id: compare
        run: |
          # tests/harness/baseline-thresholds.json holds:
          #   {"<script>.json": {"p50_ms": <num>, "p95_ms": <num>}, ...}
          # Threshold for fail: regression > 5ms p50 / 10ms p95.
          if [ ! -f tests/harness/baseline-thresholds.json ]; then
            echo "::warning::no baseline thresholds present; this run only records, doesn't compare"
            echo "regression=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tests/harness/compare-baselines.py \
              --baseline tests/harness/baseline-thresholds.json \
              --current-dir .baselines-out/ \
              --p50-tolerance-ms 5 \
              --p95-tolerance-ms 10 \
              > comparison.txt
          rc=$?
          cat comparison.txt
          if [ "$rc" -ne 0 ]; then
            echo "regression=true" >> "$GITHUB_OUTPUT"
          else
            echo "regression=false" >> "$GITHUB_OUTPUT"
          fi
          # Don't fail this step yet; we want the artefact upload + issue
          # creation to run before the workflow exits non-zero.
          exit 0

      # OSS-W2: this was `uses: actions/upload-artifact@v4`. Unlike
      # github-script below it RESOLVES on the mirror, so it looked fine —
      # and then failed at runtime:
      #   GHESNotSupportedError: @actions/artifact v2.0.0+ … are not
      #   currently supported on GHES
      # v4 talks to GitHub's artifact backend service, which Forgejo does not
      # implement. With `if: always()` that failed the job even when the
      # comparison itself was clean. Same lesson as github-script, one step
      # later in the pipeline: resolvable is not the same as runnable.
      # tools/lint/workflow_actions_lint.py now catches this class too.
      - name: Baseline outputs
        if: always()
        run: |
          echo "--- comparison.txt (artifact upload is unsupported on this host) ---"
          cat comparison.txt 2>/dev/null || echo "(no comparison.txt)"
          echo "--- .baselines-out/ ---"
          for f in .baselines-out/*; do
            [ -f "$f" ] || continue
            echo "::group::${f}"
            head -200 "$f"
            echo "::endgroup::"
          done

      # OSS-W2: this was `uses: actions/github-script@v7`, which DOES NOT
      # EXIST on Forgejo's action mirror — `data.forgejo.org/actions/
      # github-script` 404s. Action resolution happens before the `if:` is
      # evaluated, so this step failed EVERY run of this workflow, not just
      # the scheduled regression case. It is the single largest bucket of
      # CI failures in this repo's history (56 of 171).
      #
      # Rewritten as a plain API call so it works on Forgejo and GitHub
      # alike. Best-effort: a failure to file the issue must not mask the
      # regression itself, which the next step fails on.
      - name: File regression issue
        if: steps.compare.outputs.regression == 'true' && github.event_name == 'schedule'
        continue-on-error: true
        env:
          API_TOKEN: ${{ secrets.ISSUE_API_TOKEN || github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: python3 tools/ci/file_regression_issue.py

      - name: Fail on regression
        if: steps.compare.outputs.regression == 'true'
        run: |
          echo "::error::harness regression detected; see comparison.txt"
          exit 1
