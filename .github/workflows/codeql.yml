# .github/workflows/codeql.yml — T84 CodeQL static analysis for Go +
# JS/TS. Runs on PR + a weekly cron so we catch newly-disclosed CVEs
# in vendored deps and slow-burn code-quality drift.
#
# OSS-W2 — THIS WORKFLOW ONLY RUNS ON GITHUB.
#
# `github/codeql-action` does not exist on Forgejo's action mirror
# (data.forgejo.org/github/codeql-action -> 404), and CodeQL itself is a
# GitHub-hosted analysis service — there is nothing to port it to. On this
# repo's actual remote (forgejo.triform.dev) the job failed at action
# resolution, before any step ran: 38 failures, every one identical.
#
# Rather than leave it permanently red, the job is gated on running under
# github.com. On Forgejo it is skipped with a notice. If you want static
# analysis that works on both hosts, add a separate workflow using a tool
# that ships as a container (semgrep, golangci-lint, trivy) — do NOT
# re-enable this one here.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Friday 04:13 UTC — off-peak, off-business-hours, picked-minute-non-zero
    # so we don't pile onto GitHub's hourly traffic spike.
    - cron: "13 4 * * 5"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    # OSS-W2: skip entirely off github.com — see the header. A job whose
    # `if:` is false is never dispatched, so its `uses:` are never resolved;
    # that is what keeps the unresolvable github/codeql-action from failing
    # the run on Forgejo. (Verified against this Forgejo instance, where
    # conditional jobs record status=skipped rather than failure.)
    if: github.server_url == 'https://github.com'
    # STOPGAP (2026-08-20): `priority`, not `ubuntu-latest`.
    #
    # `docker` and `ubuntu-latest` are served by the SAME 10 general runners, and
    # tf-multiverse saturated them: measured 470 queued `docker` jobs against 19
    # `ubuntu-latest`, all 18 general slots held by `docker`, and **zero**
    # `ubuntu-latest` jobs started in 30 minutes. chromeless jobs waited 56-61
    # min and were not going to get a slot — arrivals were running at 285/30min
    # against 147 completing, so the backlog was growing, not draining.
    #
    # The `priority` pool (6 express replicas x capacity 2 = 12 slots) had 3 in
    # use. It has the same shape as the general pool — dind + dind-gc + runner,
    # 16Gi docker storage, capacity 2 — so nothing here depends on a runner
    # feature the general pool had and this one lacks.
    #
    # ⚠ It is NOT free: `priority` exists for tf-multiverse's own fast lane
    # (portal SSR check, cargoless-serve image builds). This borrows capacity
    # that belongs to someone else, so it is a stopgap until chromeless has its
    # own pool — see the split design. If the express pool starts queueing,
    # this is why.
    #
    # ⚠ Express dind has 8Gi memory vs the general pool's 16Gi. The e2e stack
    # (Chromium + 1GB shm + three small services) is expected to fit, but this
    # is the one difference between the pools that could bite. An OOM in
    # `compose up` here is THIS, not a product defect.
    runs-on: priority
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go (for go modules)
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Restrict scan to in-repo source so we don't choke on
          # vendored prom client + controller-runtime trees.
          source-root: .
          config: |
            paths-ignore:
              - "**/dist/**"
              - "**/node_modules/**"
              - "**/vendor/**"
              - "tests/e2e/playwright-report/**"

      # autobuild covers our Go modules well enough; no custom build
      # step required for the JS/TS path (build-mode: none).
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
