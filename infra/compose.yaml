# infra/compose.yaml — local dev stack for cloud-browser-webrtc
#
# Default stack: four services on a shared bridge network. The
# `observability` profile (T66) layers on Prometheus + Grafana for
# people who want dashboards locally.
#
# Brings up four services on a shared bridge network so the browser
# client can reach signaling and signaling can reach Chromium DevTools:
#
#   client-build — one-shot node:20-alpine that runs `npm install && npm
#                  run build` against ../client. Populates ../client/dist
#                  with bundled main.js + a copy of index.html. Exits 0
#                  before the client service starts (T40).
#   chromium   — the T7 + T28 + T31 image. Boots Chromium under Xvfb
#                with the streamer page (T23) opened as --app; runs
#                cold-start.sh + idle-watchdog.sh per T31. DevTools
#                on :9222.
#   signaling  — Go WebSocket signaling server (T13). Distroless image,
#                so no in-container healthcheck (see service block
#                comment); depending services use service_started.
#   client     — nginx:alpine serving ../client/dist on :3000 with a
#                runtime-generated config.js carrying SIGNALING_URL.
#
# Usage (from repo root):
#   docker compose -f infra/compose.yaml up --build
#
# Then open http://localhost:3000 in a browser.
#
# Override the signaling endpoint the client uses (defaults to
# ws://signaling:8080 per project spec; that DNS name only resolves
# inside the docker network, so for browser access from the host you'll
# usually want to override):
#   SIGNALING_URL=ws://localhost:8080 docker compose -f infra/compose.yaml up

name: cloud-browser-webrtc

networks:
  cbnet:
    driver: bridge

services:
  # T40: one-shot build of the browser client. Without this, the client
  # service would bind-mount ../client (source) which has index.html
  # importing ./main.js — but main.js only exists at ../client/dist/
  # main.js after esbuild runs. We bind-mount the source, write dist/
  # back to the host, and exit; node_modules lives in a named volume
  # so the host filesystem isn't polluted with per-arch native binaries
  # (esbuild ships a CPU-arch-specific binary that would conflict on
  # macOS+Linux mixed dev).
  client-build:
    image: node:20-alpine
    container_name: cbwrtc-client-build
    working_dir: /work
    volumes:
      - ../client:/work
      - client_node_modules:/work/node_modules
    # mkdir before install/build keeps `docker compose up` working on
    # the very first run, when ../client/dist may not yet exist on the
    # host (the client service then bind-mounts it).
    command:
      - sh
      - -c
      - |
        set -eu
        echo "[client-build] mkdir -p dist"
        mkdir -p dist
        echo "[client-build] npm install"
        npm install --no-audit --no-fund
        echo "[client-build] npm run build"
        npm run build
        echo "[client-build] done; ../client/dist is ready"
    restart: "no"

  chromium:
    # Build context is the repo root because the Dockerfile copies
    # capture/streamer-page/ (T28) and infra/* into the image.
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: cloud-browser-webrtc:dev
    container_name: cbwrtc-chromium
    networks: [cbnet]
    ports:
      - "9222:9222"
      # cb-metrics-sidecar (T38) — Prometheus scrape target.
      - "9100:9100"
    environment:
      # Streamer launch (T28). Override per session as the lifecycle
      # scripts (T31) come online.
      SESSION_ID: dev
      SIGNALING_URL: ws://signaling:8080/ws
      STREAMER_FPS: "30"
      # T86: route the dev-compose stack through Chromium's synthetic
      # media source (test pattern + tone) instead of real
      # getDisplayMedia. Two reasons this is the dev default:
      #   1. Real getDisplayMedia under Chromium 147 + Xvfb fails with
      #      `NotReadableError: Could not start video source` even
      #      after T78's X11+SwiftShader pin (the UA confirms the X11
      #      ozone backend is in use; the screen capturer's `start`
      #      step is what's failing). Xvfb itself is fine — see
      #      supervisord.conf line 42, screen 0 is 1920x1080x24.
      #   2. Phase 2's FrameSinkVideoCapturer (T47/T55) doesn't go
      #      through getDisplayMedia at all — it taps Viz directly.
      #      Spending more cycles fixing the v1 path that Phase 2
      #      replaces is wrong-shaped work; route around the bug,
      #      validate the rest of the pipeline, fix it durably in
      #      Phase 2.
      # Set to "" (empty) to flip back to real-getDisplayMedia for
      # diagnostic runs once Phase 2 capture is in place.
      CBWRTC_USE_FAKE_MEDIA: "1"
      # T109: replay a pre-recorded harness y4m through the synthetic
      # camera so reconcile.py sees real per-frame QR codes (the
      # default synthetic-media moving-green-square produces zero
      # decode rate per qa-tester's T65 finding). The fixtures
      # directory is bind-mounted at /opt/cb-fixtures (see
      # `volumes:` below); generate the y4m via
      # harness/latency/record-y4m.sh on the dev host first.
      #
      # Empty CBWRTC_USE_FAKE_MEDIA_FILE → fall back to the
      # synthetic green square. We default it to the standard 720p30
      # filename; the launch script gracefully degrades when the
      # file isn't readable.
      CBWRTC_USE_FAKE_MEDIA_FILE: ${CBWRTC_USE_FAKE_MEDIA_FILE:-/opt/cb-fixtures/harness-loop-720p30.y4m}
      # T99: OTel for cb-metrics-sidecar (which runs inside this container
      # under supervisord). Empty by default → SDK installs a no-op
      # provider, so the service-without-jaeger case stays quiet.
      # Enable at run time with:
      #   OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317 \
      #     docker compose -f infra/compose.yaml --profile observability up
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      CBWRTC_TRACE_SAMPLE_RATIO: ${CBWRTC_TRACE_SAMPLE_RATIO:-1.0}
    # T109: bind-mount the harness y4m fixtures dir read-only so
    # CBWRTC_USE_FAKE_MEDIA_FILE can point at a y4m generated by
    # harness/latency/record-y4m.sh. The dir may be empty on a
    # fresh checkout — Chromium degrades gracefully (warning + the
    # synthetic green square) per launch-chromium.sh.
    volumes:
      - ../harness/latency/fixtures:/opt/cb-fixtures:ro
    # /dev/shm at default 64m is too small for Chromium tabs; either bump
    # shm_size or rely on the Dockerfile's --disable-dev-shm-usage. Both
    # is belt-and-braces for stability.
    shm_size: "1gb"
    # The Dockerfile already sets a HEALTHCHECK; we restate it here so
    # other services can depend_on: condition: service_healthy without
    # surprises if someone overrides the image tag.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9222/json/version"]
      interval: 10s
      timeout: 3s
      # Cold-start.sh + Xvfb + Pulse + streamer-static + Chromium need
      # a generous grace on the first boot.
      start_period: 45s
      retries: 3
    depends_on:
      # streamer page tries to dial signaling immediately at --app load,
      # so we want signaling at least started before chromium boots.
      signaling:
        condition: service_started
    restart: unless-stopped

  # Real signaling service (T13 + T31 sub-A). Built from signaling/.
  # The signaling image is gcr.io/distroless/static — no shell, no
  # busybox, no curl — so we can't author a healthcheck command that
  # runs *inside* the container without modifying webrtc-dev's
  # Dockerfile. Chromium and client therefore depend on
  # `condition: service_started` rather than service_healthy.
  # If/when signaling grows a healthcheck (e.g. a CGO-free static probe
  # binary copied alongside /signaling), upgrade those depends_on.
  signaling:
    build:
      context: ../signaling
      dockerfile: Dockerfile
    image: cloud-browser-webrtc-signaling:dev
    container_name: cbwrtc-signaling
    networks: [cbnet]
    ports:
      - "8080:8080"
    environment:
      SIGNALING_PORT: "8080"
      # T99: same OTel opt-in pattern as chromium. webrtc-dev's
      # signaling/tracing.go reads these.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      CBWRTC_TRACE_SAMPLE_RATIO: ${CBWRTC_TRACE_SAMPLE_RATIO:-1.0}
    restart: unless-stopped

  client:
    image: nginx:alpine
    container_name: cbwrtc-client
    networks: [cbnet]
    ports:
      - "3000:80"
    # Bind-mount the *built* client/dist for live reload during dev:
    # esbuild's --watch mode (npm run watch) updates ../client/dist on
    # disk and nginx serves it directly. Read-only so the container
    # can't accidentally write into the source tree. The generated
    # config.js is written to a tmpfs overlay path inside the container
    # that's served alongside via an alias in the nginx server block.
    volumes:
      - ../client/dist:/usr/share/nginx/html:ro
      - client_runtime:/srv/runtime
    environment:
      # Project spec says ws://signaling:8080. That DNS name resolves
      # inside cbnet only; from a host browser the page can't reach it.
      # Override SIGNALING_URL at compose-up time when testing from the
      # host (e.g. SIGNALING_URL=ws://localhost:8080).
      SIGNALING_URL: ws://signaling:8080
    # NOTE: $$ in command/heredoc bodies escapes compose's own variable
    # interpolation so the literal $ reaches the container shell / nginx.
    command:
      - /bin/sh
      - -c
      - |
        cat > /srv/runtime/config.js <<EOF
        // Generated at container start by infra/compose.yaml.
        // Override SIGNALING_URL in the environment to change.
        window.__CBWRTC_CONFIG__ = {
          signalingUrl: "$${SIGNALING_URL}"
        };
        EOF
        # Serve the generated config.js out of /srv/runtime alongside
        # the client/ bind mount. We patch nginx with a tiny location
        # block via a default.conf override.
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;
          index index.html;

          location = /config.js {
            alias /srv/runtime/config.js;
            add_header Cache-Control "no-store";
          }

          location / {
            try_files $$uri $$uri/ =404;
          }
        }
        NGINX
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/config.js >/dev/null || exit 1"]
      interval: 5s
      timeout: 2s
      start_period: 5s
      retries: 3
    depends_on:
      # See the signaling service block: distroless image can't host an
      # in-container healthcheck, so we settle for service_started here.
      signaling:
        condition: service_started
      chromium:
        condition: service_healthy
      # T40: ensure the client bundle is built before nginx tries to
      # serve it. service_completed_successfully waits for client-build
      # to exit 0.
      client-build:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Optional observability stack (T66). Bring up with:
  #
  #   docker compose -f infra/compose.yaml --profile observability up
  #
  # without --profile the default stack starts unchanged and these two
  # services are skipped. Grafana provisioning auto-loads the cb-*
  # dashboards from infra/observability/dashboards/ and a Prometheus
  # datasource pointing at the prometheus service.
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cbwrtc-prometheus
    profiles: [observability]
    networks: [cbnet]
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: cbwrtc-grafana
    profiles: [observability]
    networks: [cbnet]
    ports:
      # 3001 on the host so it doesn't collide with the client (3000).
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cb-cluster-overview.json
    volumes:
      - ./observability/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
    restart: unless-stopped

  # T99: Jaeger all-in-one for the observability profile. Receives
  # OTLP/gRPC on 4317 (which the signaling, controller, and sidecar
  # ship to when CBWRTC_TRACE_ENABLED=1) and serves the query UI on
  # 16686.
  #
  # Why all-in-one: dev compose. Production runs Tempo or Grafana
  # Cloud with a real backend; see docs/operations/tracing.md for the
  # K8s manifest and the Helm-templatable equivalent.
  #
  # The image bundles agent + collector + storage (Badger) + query
  # in one binary. Traces are kept in /tmp; restart wipes them, which
  # is exactly what dev wants.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: cbwrtc-jaeger
    profiles: [observability]
    networks: [cbnet]
    ports:
      - "16686:16686" # query UI
      - "4317:4317"   # OTLP/gRPC ingress
      - "4318:4318"   # OTLP/HTTP ingress (handy for browser-side OTel)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Single-process, in-memory storage: dev defaults are fine.
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: "10000"
    restart: unless-stopped

volumes:
  client_runtime:
  # T40: cached node_modules for client-build. Speeds up successive
  # `compose up` runs and avoids the host filesystem inheriting per-
  # arch native binaries from inside the container.
  client_node_modules:
  # T66: persistent storage for the observability profile. Both are
  # only created when the profile is active.
  prometheus_data:
  grafana_data:
