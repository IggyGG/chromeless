; infra/supervisord.conf — process supervisor for chromeless
;
; T57: supervisord runs as cbuser (uid 1000), as do all programs. The
; image's USER directive plus the entrypoint chain set this up; here
; we just drop the historic `user=root` lines so supervisord doesn't
; try a setuid that's no longer permitted under the K8s
; runAsNonRoot: true contract.
;
; Startup ordering: Xvfb (virtual display) -> pulseaudio (audio sink) ->
; chromium -> devtools-proxy -> metrics-sidecar. We rely on priority=
; rather than a hard wait because supervisord has no native readiness
; gate; Chromium tolerates one or two restarts while Xvfb comes up if
; startup is racy. Native peer (M1) instantiates PeerConnectionFactory
; in cloud_browser_main_parts.cc; no in-container streamer page.
;
; Socket + pid file under /run/supervisor/, which the Dockerfile and
; cold-start.sh ensure is cbuser-owned. logs under /var/log/supervisor.

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisor/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[unix_http_server]
file=/run/supervisor/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ---------------------------------------------------------------------------
; Xvfb — virtual framebuffer on display :99 at 1920x1080x24.
; -ac disables host-based access control (we're inside a container, the
; only clients are siblings under cbuser).
; ---------------------------------------------------------------------------
[program:xvfb]
priority=10
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp -ac
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err.log

; ---------------------------------------------------------------------------
; PulseAudio — user-mode daemon. /etc/pulse/default.pa was overwritten in
; the Dockerfile with our null-sink-only script, so the daemon loads
; exactly what we want at startup.
;   --exit-idle-time=-1   never auto-exit when no clients are connected
;   --log-target=stderr   route logs to supervisord
; ---------------------------------------------------------------------------
[program:pulseaudio]
priority=20
command=/usr/bin/pulseaudio --exit-idle-time=-1 --log-target=stderr
environment=HOME="/home/cbuser",XDG_RUNTIME_DIR="/run/user/1000",PULSE_RUNTIME_PATH="/run/user/1000/pulse"
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/pulseaudio.log
stderr_logfile=/var/log/supervisor/pulseaudio.err.log

; ---------------------------------------------------------------------------
; Chromium — headed instance under Xvfb, DevTools listening on :9222.
; The full flag list lives in /usr/local/bin/launch-chromeless.sh so it
; is shellcheck-friendly and can expand SESSION_ID / SIGNALING_URL at
; runtime without rebuilding the image. M7: no in-container streamer
; page; native peer (M1) instantiates the PeerConnectionFactory in
; cloud_browser_main_parts.cc, native signaling (M3) is browser-process.
;
; Audio: --autoplay-policy=no-user-gesture-required.
; --use-fake-ui-for-media-stream auto-grants the picker (does NOT
; synthesize media; that's --use-fake-device-for-media-stream which we
; omit so real PulseAudio routes through cb_audio.monitor).
; PULSE_SERVER below pins the renderer to the in-container socket.
; ---------------------------------------------------------------------------
; environment= is additive over supervisord's inherited environment (per
; supervisord docs), so SESSION_ID / SIGNALING_URL set on
; `docker run -e ...` flow through to launch-chromeless.sh without us
; needing to name them here.
[program:chromium]
priority=30
command=/usr/local/bin/launch-chromeless.sh
environment=HOME="/home/cbuser",DISPLAY=":99",XDG_RUNTIME_DIR="/run/user/1000",PULSE_SERVER="unix:/run/user/1000/pulse/native"
autorestart=true
startretries=10
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium.err.log

; ---------------------------------------------------------------------------
; devtools-proxy (T52) — socat bridge that forwards container_eth0:9222
; to 127.0.0.1:9222 because Chromium 147 ignores
; --remote-debugging-address=0.0.0.0 and only binds loopback. Without
; this, `docker run -p 9222:9222` cannot reach DevTools from the host.
; See infra/devtools-proxy.sh.
;
; Priority 32 places it after Chromium (30) so we don't waste retries
; before Chromium's listener exists; socat tolerates not-yet-up
; backends per-connection.
; ---------------------------------------------------------------------------
[program:devtools-proxy]
priority=32
command=/usr/local/bin/devtools-proxy.sh
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/devtools-proxy.log
stderr_logfile=/var/log/supervisor/devtools-proxy.err.log

; ---------------------------------------------------------------------------
; chromeless-metrics-sidecar (T38) — Prometheus metrics on :9100. Polls
; Chromium DevTools (port 9222) for WebRTC stats and /proc for
; aggregate Chromium CPU/RSS. Runs as cbuser (no special privileges
; needed for /proc reads); priority 35 places it after Chromium so
; DevTools is at least started before the first poll. See
; infra/observability.md.
; ---------------------------------------------------------------------------
[program:metrics-sidecar]
priority=35
command=/usr/local/bin/chromeless-metrics-sidecar
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/metrics-sidecar.log
stderr_logfile=/var/log/supervisor/metrics-sidecar.err.log
environment=DEVTOOLS_URL="http://127.0.0.1:9222",METRICS_LISTEN=":9100",POLL_INTERVAL_S="10",LOG_LEVEL="info"

; idle-watchdog removed in M7 R3: it polled the streamer page's
; RTCPeerConnection state via DevTools. With native peer (M1+M3) the
; PeerConnection lives in the browser process and idle detection is
; folded into native peer teardown (M6 R5). Re-introduce against the
; native RTCPeerConnection observer if pod-level supervisord-driven
; idle shutdown is still needed.
