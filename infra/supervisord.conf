; infra/supervisord.conf — process supervisor for cloud-browser-webrtc
;
; Startup ordering: Xvfb (virtual display) -> pulseaudio (audio sink) ->
; chromium (renderer connecting to both). We rely on priority= rather than
; a hard wait because supervisord has no native readiness gate; Chromium
; tolerates one or two restarts while Xvfb comes up if startup is racy.
;
; Logs land under /var/log/supervisor/<program>.{log,err.log}. Stream them
; out with `docker logs` via the redirect_stderr config below.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ---------------------------------------------------------------------------
; Xvfb — virtual framebuffer on display :99 at 1920x1080x24.
; -ac disables host-based access control (we're inside a container, the
; only clients are siblings under cbuser).
; ---------------------------------------------------------------------------
[program:xvfb]
priority=10
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp -ac
user=cbuser
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err.log

; ---------------------------------------------------------------------------
; PulseAudio — user-mode daemon. /etc/pulse/default.pa was overwritten in
; the Dockerfile with our null-sink-only script, so the daemon loads
; exactly what we want at startup.
;   --exit-idle-time=-1   never auto-exit when no clients are connected
;   --log-target=stderr   route logs to supervisord
; ---------------------------------------------------------------------------
[program:pulseaudio]
priority=20
command=/usr/bin/pulseaudio --exit-idle-time=-1 --log-target=stderr
user=cbuser
environment=HOME="/home/cbuser",XDG_RUNTIME_DIR="/run/user/1000",PULSE_RUNTIME_PATH="/run/user/1000/pulse"
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/pulseaudio.log
stderr_logfile=/var/log/supervisor/pulseaudio.err.log

; ---------------------------------------------------------------------------
; streamer-static (T28) — Python's stdlib http.server hosting the
; streamer page (capture/streamer-page/, COPYed in the Dockerfile to
; /opt/cloud-browser/streamer/). Bound to 127.0.0.1 so it's reachable
; only by Chromium in this container; not exposed to the docker network.
; Priority 25 puts it between PulseAudio (20) and Chromium (30) so the
; URL Chromium opens at startup is already serving.
; ---------------------------------------------------------------------------
[program:streamer-static]
priority=25
command=/usr/bin/python3 -m http.server --bind 127.0.0.1 --directory /opt/cloud-browser 9000
user=cbuser
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/streamer-static.log
stderr_logfile=/var/log/supervisor/streamer-static.err.log

; ---------------------------------------------------------------------------
; Chromium — headed instance under Xvfb, DevTools listening on :9222,
; running the T23 streamer page as an --app. The full flag list lives
; in /usr/local/bin/launch-chromium.sh so it's shellcheck-friendly and
; can expand SESSION_ID / SIGNALING_URL / STREAMER_FPS at runtime
; without rebuilding the image. Source of truth for flag rationale:
; capture/streamer-page/launch.md.
;
; Audio (T24): --autoplay-policy=no-user-gesture-required so the streamer
; can start audio without a synthetic click. --use-fake-ui-for-media-stream
; auto-grants the getUserMedia/getDisplayMedia picker (it does NOT
; synthesize media — that's --use-fake-device-for-media-stream, which we
; deliberately omit so real PulseAudio routes through cb_audio.monitor).
; PULSE_SERVER below pins the renderer to the in-container socket.
; ---------------------------------------------------------------------------
; environment= is additive over supervisord's inherited environment (per
; supervisord docs), so SESSION_ID / SIGNALING_URL / STREAMER_FPS set on
; `docker run -e ...` flow through to launch-chromium.sh without us
; needing to name them here.
[program:chromium]
priority=30
command=/usr/local/bin/launch-chromium.sh
user=cbuser
environment=HOME="/home/cbuser",DISPLAY=":99",XDG_RUNTIME_DIR="/run/user/1000",PULSE_SERVER="unix:/run/user/1000/pulse/native"
autorestart=true
startretries=10
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium.err.log

; ---------------------------------------------------------------------------
; idle-watchdog (T31) — polls the streamer page's RTCPeerConnection
; state via DevTools and asks supervisord to shut down when the
; container has been idle for IDLE_TIMEOUT_S (default 600s). Runs as
; root so it can talk to /run/supervisor.sock at chmod 0700. See
; infra/lifecycle/README.md for the full heuristic and limitations.
; ---------------------------------------------------------------------------
[program:idle-watchdog]
priority=40
command=/usr/local/bin/idle-watchdog.sh
user=root
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/idle-watchdog.log
stderr_logfile=/var/log/supervisor/idle-watchdog.err.log
environment=DEVTOOLS_URL="http://127.0.0.1:9222",IDLE_TIMEOUT_S="600",WATCHDOG_GRACE_S="60",WATCHDOG_POLL_S="30"
