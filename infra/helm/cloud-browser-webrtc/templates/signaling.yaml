{{- if .Values.signaling.enabled -}}
{{- $ns := include "cb.namespace" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: signaling
  namespace: {{ $ns }}
  labels:
    {{- include "cb.labels" . | nindent 4 }}
    app.kubernetes.io/component: signaling
automountServiceAccountToken: false
---
{{- if .Values.signaling.authPubkey }}
apiVersion: v1
kind: Secret
metadata:
  name: signaling-auth
  namespace: {{ $ns }}
  labels:
    {{- include "cb.labels" . | nindent 4 }}
    app.kubernetes.io/component: signaling
type: Opaque
stringData:
  CBWRTC_AUTH_PUBKEY: {{ .Values.signaling.authPubkey | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signaling
  namespace: {{ $ns }}
  labels:
    {{- include "cb.labels" . | nindent 4 }}
    app.kubernetes.io/component: signaling
spec:
  replicas: {{ .Values.signaling.replicas }}
  selector:
    matchLabels:
      {{- include "cb.selectorLabels" (merge (dict "component" "signaling") .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "cb.selectorLabels" (merge (dict "component" "signaling") .) | nindent 8 }}
      {{- if .Values.prometheusAnnotations.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      {{- end }}
    spec:
      serviceAccountName: signaling
      automountServiceAccountToken: false
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: signaling
          image: {{ include "cb.image" (dict "component" "signaling" "values" .Values "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SIGNALING_PORT
              value: "8080"
            {{- if .Values.signaling.authPubkey }}
            - name: CBWRTC_AUTH_PUBKEY
              valueFrom:
                secretKeyRef:
                  name: signaling-auth
                  key: CBWRTC_AUTH_PUBKEY
            {{- end }}
          resources:
            {{- toYaml .Values.signaling.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "cb.selectorLabels" (merge (dict "component" "signaling") .) | nindent 14 }}
---
apiVersion: v1
kind: Service
metadata:
  name: signaling
  namespace: {{ $ns }}
  labels:
    {{- include "cb.labels" . | nindent 4 }}
    app.kubernetes.io/component: signaling
spec:
  type: ClusterIP
  selector:
    {{- include "cb.selectorLabels" (merge (dict "component" "signaling") .) | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
{{- if .Values.signaling.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signaling
  namespace: {{ $ns }}
  labels:
    {{- include "cb.labels" . | nindent 4 }}
    app.kubernetes.io/component: signaling
  {{- with .Values.signaling.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.signaling.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.signaling.ingress.host }}
      secretName: {{ .Values.signaling.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.signaling.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signaling
                port:
                  number: 8080
{{- end }}
{{- if .Values.signaling.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: signaling
  namespace: {{ $ns }}
  labels:
    {{- include "cb.labels" . | nindent 4 }}
    app.kubernetes.io/component: signaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: signaling
  minReplicas: {{ .Values.signaling.hpa.minReplicas }}
  maxReplicas: {{ .Values.signaling.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.signaling.hpa.cpuTargetUtilization }}
{{- end }}
{{- end }}
