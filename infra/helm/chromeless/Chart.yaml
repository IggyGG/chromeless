apiVersion: v2
name: chromeless
description: |
  Chromeless Phase 1 deployment chart. Installs the
  signaling tier, BrowserSession + BrowserSessionPool CRDs, the
  session controller, the TURN issuer, and an example default
  BrowserSessionPool. coturn is deployed via this chart as well, with
  a strong recommendation in values.yaml to use a managed TURN
  service (Cloudflare TURN / metered.ca / Twilio) instead for prod.

  See infra/helm/chromeless/README.md for the full install
  story; values.yaml has every knob.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - webrtc
  - cloud-browser
  - chromium
  - turn
  - phase-1
home: https://github.com/iggy/chromeless
sources:
  - https://github.com/iggy/chromeless
maintainers:
  - name: chromeless team
    url: https://github.com/iggy/chromeless
icon: ""
annotations:
  category: Networking
