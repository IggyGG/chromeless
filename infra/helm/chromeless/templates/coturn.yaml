{{- if .Values.coturn.enabled -}}
{{- $ns := include "chromeless.namespace" . -}}
{{- include "chromeless.requireValue" (dict "value" .Values.coturn.staticAuthSecret "name" "coturn.staticAuthSecret" "context" "coturn enabled") -}}
apiVersion: v1
kind: Secret
metadata:
  name: turn-rest-secret
  namespace: {{ $ns }}
  labels:
    {{- include "chromeless.labels" . | nindent 4 }}
    app.kubernetes.io/component: coturn
type: Opaque
stringData:
  static-auth-secret: {{ .Values.coturn.staticAuthSecret | quote }}
  static-auth-secret-prev: {{ .Values.coturn.staticAuthSecretPrev | default "" | quote }}
  realm: {{ .Values.coturn.realm | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
  namespace: {{ $ns }}
  labels:
    {{- include "chromeless.labels" . | nindent 4 }}
    app.kubernetes.io/component: coturn
data:
  turnserver.conf: |
    listening-port=3478
    tls-listening-port=5349
    fingerprint
    use-auth-secret
    static-auth-secret=$ENV{TURN_STATIC_AUTH_SECRET}
    realm=$ENV{TURN_REALM}
    no-multicast-peers
    denied-peer-ip=10.0.0.0-10.255.255.255
    denied-peer-ip=172.16.0.0-172.31.255.255
    denied-peer-ip=192.168.0.0-192.168.255.255
    denied-peer-ip=169.254.0.0-169.254.255.255
    no-tlsv1
    no-tlsv1_1
    min-port=49152
    max-port=65535
    log-file=stdout
    no-stdout-log
    simple-log
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: coturn
  namespace: {{ $ns }}
  labels:
    {{- include "chromeless.labels" . | nindent 4 }}
    app.kubernetes.io/component: coturn
spec:
  serviceName: coturn
  replicas: {{ .Values.coturn.replicas }}
  selector:
    matchLabels:
      {{- include "chromeless.selectorLabels" (merge (dict "component" "coturn") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chromeless.selectorLabels" (merge (dict "component" "coturn") .) | nindent 8 }}
    spec:
      hostNetwork: {{ .Values.coturn.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      {{- with .Values.coturn.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.coturn.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: coturn
          image: coturn/coturn:4.6
          imagePullPolicy: IfNotPresent
          env:
            - name: TURN_STATIC_AUTH_SECRET
              valueFrom: { secretKeyRef: { name: turn-rest-secret, key: static-auth-secret } }
            - name: TURN_REALM
              valueFrom: { secretKeyRef: { name: turn-rest-secret, key: realm } }
          args: ["-c", "/etc/coturn/turnserver.conf"]
          ports:
            - { name: stun-udp,  containerPort: 3478, protocol: UDP, hostPort: 3478 }
            - { name: stun-tcp,  containerPort: 3478, protocol: TCP, hostPort: 3478 }
            - { name: turns,     containerPort: 5349, protocol: TCP, hostPort: 5349 }
          volumeMounts:
            - { name: config, mountPath: /etc/coturn, readOnly: true }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
          livenessProbe:
            tcpSocket: { port: stun-tcp }
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
      volumes:
        - { name: config, configMap: { name: coturn-config } }
{{- end }}
