{{- if .Values.swPool.enabled -}}
{{- /*
T119: software-encoder BrowserSessionPool. Mirrors default-pool.yaml
in shape; differs in resource shape (no GPU pin), placement (no
GPU node), and recycle cadence. Kept as a separate template (rather
than refactoring default-pool into a generic loop) so the existing
defaultPool values shape stays stable for callers that don't enable
the SW pool.

Pool name is fixed to "sw-pool" — it's not a settable knob today
because the only other pool name is .Values.controller.defaultPool,
and the controller's defaultPool wiring already covers that.
*/ -}}
{{- $ns := include "chromeless.namespace" . -}}
{{- $poolName := "sw-pool" -}}
apiVersion: cloud-browser-webrtc.example.com/v1alpha1
kind: BrowserSessionPool
metadata:
  name: {{ $poolName }}
  namespace: {{ $ns }}
  labels:
    {{- include "chromeless.labels" . | nindent 4 }}
    app.kubernetes.io/component: pool
    chromeless.session/pool: {{ $poolName | quote }}
spec:
  warmReplicas: {{ .Values.swPool.warmReplicas }}
  maxSessions: {{ .Values.swPool.maxSessions }}
  maxAgeSeconds: {{ .Values.swPool.maxAgeSeconds }}
  recyclePolicy: {{ .Values.swPool.recyclePolicy }}
  template:
    metadata:
      labels:
        {{- include "chromeless.labels" . | nindent 8 }}
        app.kubernetes.io/component: session
        chromeless.session/state: warm
        chromeless.session/pool: {{ $poolName | quote }}
      annotations:
        chromeless.io/snapshot-id: ""
    spec:
      {{- if .Values.swPool.runtimeClassName }}
      runtimeClassName: {{ .Values.swPool.runtimeClassName | quote }}
      {{- else if .Values.gvisor.enabled }}
      runtimeClassName: gvisor
      {{- end }}
      {{- with .Values.swPool.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.swPool.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.swPool.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.swPool.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      shareProcessNamespace: true
      restartPolicy: Always
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: Localhost
          localhostProfile: chromeless.json
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: supervisor-log
          emptyDir:
            sizeLimit: 64Mi
        - name: home
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: x11-socket
          emptyDir:
            sizeLimit: 16Mi
      containers:
        - name: chromeless
          image: {{ include "chromeless.image" (dict "component" "chromium" "values" .Values "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: SESSION_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SIGNALING_URL
              value: "ws://signaling.{{ $ns }}.svc.cluster.local:8080/ws"
            - name: STREAMER_FPS
              value: "30"
            - name: IDLE_TIMEOUT_S
              value: {{ .Values.swPool.idleTimeoutSeconds | quote }}
            # T119: SW encoder hint. The chromeless image checks for
            # CHROMELESS_ENCODER_PREFERENCE on startup; "sw" pins libvpx /
            # libx264 zero-latency and skips the NVENC factory probe.
            - name: CHROMELESS_ENCODER_PREFERENCE
              value: "sw"
            {{- $region := include "chromeless.region" (dict "context" . "component" "") }}
            {{- if $region }}
            - name: CHROMELESS_REGION
              value: {{ $region | quote }}
            {{- end }}
          ports:
            - name: devtools
              containerPort: 9222
            - name: streamer
              containerPort: 9000
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: run, mountPath: /run }
            - { name: supervisor-log, mountPath: /var/log/supervisor }
            - { name: home, mountPath: /home/cbuser }
            - { name: tmp, mountPath: /tmp }
            - { name: x11-socket, mountPath: /tmp/.X11-unix }
          resources:
            {{- toYaml .Values.swPool.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /json/version, port: devtools }
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /json/version, port: devtools }
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
        - name: chromeless-metrics-sidecar
          image: {{ include "chromeless.image" (dict "component" "metricsSidecar" "values" .Values "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - { name: DEVTOOLS_URL, value: "http://127.0.0.1:9222" }
            - { name: METRICS_LISTEN, value: ":9100" }
            - { name: POLL_INTERVAL_S, value: "10" }
            {{- if .Values.observability.otlpLogsEndpoint }}
            - { name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT, value: {{ .Values.observability.otlpLogsEndpoint | quote }} }
            {{- end }}
            {{- $region := include "chromeless.region" (dict "context" . "component" "") }}
            {{- if $region }}
            - { name: CHROMELESS_REGION, value: {{ $region | quote }} }
            {{- end }}
          ports:
            - { name: metrics, containerPort: 9100 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
{{- end }}
