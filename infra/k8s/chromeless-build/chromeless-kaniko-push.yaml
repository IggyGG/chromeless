# chromeless-kaniko-push — push the runtime chromeless image after a chromeless-build
# Job has staged the build context.
#
# WHY: build-job-{x264,x264-t7,vaapi,nvenc}.yaml all run chromeless-build.sh
# which in Step 9 stages the runtime image build context to
# ${CHROMELESS_WORK_ROOT}/artifacts/context/ on the chromium-src hostPath.
# That step writes Dockerfile + cloud_browser_worker + supervisord +
# launch-chromeless.sh + IMAGE_TAG. It does NOT push: the planned
# in-Job kaniko sidecar (T112) is not wired in, on purpose, so push
# auth lives outside the build container.
#
# This Job picks up where the build left off and pushes to the
# forgejo registry.
#
# WHEN: apply this AFTER chromeless-build-<variant> reaches Succeeded. Do
# not chain it onto the build Job itself — the registry needs to be
# scaled to 1 replica before the push (BUGS-513 workaround) and that
# is an operator step today.
#
# >>> THIS MANIFEST IS A TEMPLATE — DO NOT `kubectl apply -f` DIRECTLY <<<
#
# Four fields are envsubst placeholders driven by the operator's environment:
#   - CHROMELESS_KANIKO_TAG  — REQUIRED, the unique destination tag.
#                              MUST match what chromeless-build.sh Step 9
#                              wrote to ${CHROMELESS_WORK_ROOT}/artifacts/
#                              context/IMAGE_TAG on the build node (the
#                              "cr<branch>-<commit-sha>" form, e.g.
#                              cr7727-8367359). Auditability is broken
#                              if this is reused across distinct builds.
#   - KANIKO_JOB_NAME        — REQUIRED, assigned by the wrapper for this attempt.
#   - KANIKO_NODE            — REQUIRED, "triform-7" or "triform-8" (the
#                              node whose hostPath holds the build
#                              artifacts). Operator hard-constraint:
#                              T7/T8 only — never T2/T3/T5/T6.
#   - KANIKO_VARIANT_LABEL   — REQUIRED, the variant tag for k8s labels
#                              ("sw", "x264-t7", "vaapi", "nvenc").
#                              Informational only — the actual binary
#                              shipped is whatever Step 9 staged.
#
# Use the wrapper script (canonical path):
#
#   ./infra/k8s/chromeless-build/chromeless-kaniko-push.sh triform-7
#
# That script reads IMAGE_TAG over ssh from the build node, exports the
# three vars, substitutes via `envsubst '${...} ${...} ${...}'` (allowlist
# form — does NOT clobber the unrelated ${VAR} mentions in this header
# or in the Kaniko args' $(VAR) downward-API interpolation), applies,
# and tails the kaniko logs into /tmp/kaniko-push.log.
#
# See:
#   - infra/k8s/chromeless-build/chromeless-kaniko-push.README.md (full activation
#     procedure, variant overrides, BUGS-513 dance, future work)
#   - infra/k8s/chromeless-build/chromeless-kaniko-push.sh (canonical apply wrapper)
#   - infra/k8s/chromeless-build/build-job-x264-t7.yaml (build context on T7)
#   - infra/k8s/chromeless-build/build-job-x264.yaml (build context on T8)
#   - build/chromeless-build.sh Step 9 (where /work/artifacts/context comes
#     from and where IMAGE_TAG is written)

apiVersion: batch/v1
kind: Job
metadata:
  # Tag-suffixed Job name so successive pushes don't collide on the
  # immutable Job resource (kubectl apply on an existing Job is a no-op
  # for spec changes — we want a fresh Job per tag).
  name: ${KANIKO_JOB_NAME}
  namespace: chromeless-build
  labels:
    app.kubernetes.io/name: chromeless
    app.kubernetes.io/component: image-push
    app.kubernetes.io/variant: ${KANIKO_VARIANT_LABEL}
    chromeless.triform.cloud/tag: ${CHROMELESS_KANIKO_TAG}
spec:
  # backoffLimit:1 — kaniko push is short-lived; one retry on a
  # transient registry 502 is fine. More than that and it's
  # almost always a cred / scale-down / context-missing bug that
  # retries won't fix.
  # backoffLimit 1 -> 5. An admission rejection (OutOfcpu) costs about a
  # second and produces no container, so ONE retry is exhausted before a
  # neighbouring pod could possibly free capacity — the job then reports
  # BackoffLimitExceeded, which looks identical to a push that actually
  # failed. Retries are cheap here precisely because rejection is instant:
  # the expensive part only begins once a pod is admitted.
  backoffLimit: 5
  # 5 min hard ceiling. Cold layer push is ~30-60s; this leaves
  # generous headroom for registry flakes.
  activeDeadlineSeconds: 300
  # Keep the Pod around for a day so post-mortem logs are
  # available without resurrecting from k8s events.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromeless
        app.kubernetes.io/component: image-push
        app.kubernetes.io/variant: ${KANIKO_VARIANT_LABEL}
        chromeless.triform.cloud/tag: ${CHROMELESS_KANIKO_TAG}
    spec:
      # Never (not OnFailure) — backoffLimit:1 + Never means at most
      # 2 pod attempts total, with no in-place container restarts. An
      # OnFailure pod can churn its container before the Job gives up,
      # which masks the failure mode in the logs and confuses the
      # post-mortem. Kaniko push is short and either works or doesn't —
      # we want the failure mode preserved cleanly.
      restartPolicy: Never
      # Pin to the node that holds the build artifacts on its
      # hostPath. T7/T8 only — operator hard-constraint.
      nodeName: ${KANIKO_NODE}
      nodeSelector:
        kubernetes.io/hostname: ${KANIKO_NODE}
      initContainers:
        - name: verify-build-tag
          image: busybox:1.36.1
          command:
            - sh
            - -ec
            - |
              if [ "$(cat /workspace/IMAGE_TAG)" != "$CHROMELESS_KANIKO_TAG" ]; then
                echo "ERROR: staged build tag differs from the requested image" >&2
                exit 1
              fi
          env:
            - name: CHROMELESS_KANIKO_TAG
              value: "${CHROMELESS_KANIKO_TAG}"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
              readOnly: true
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
              ephemeral-storage: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
              ephemeral-storage: "32Mi"
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.23.2
          # K8s interpolates $(VAR) in args from container env at
          # pod-create time. CHROMELESS_KANIKO_TAG below drives both the
          # destination tag and the IMAGE_TAG build-arg.
          # NOTE: $(VAR) is K8s downward-API, NOT ${VAR} envsubst —
          # the envsubst wrapper leaves these alone.
          args:
            - --dockerfile=/workspace/Dockerfile
            - --context=/workspace
            - --destination=registry.triform.cloud/chromeless/chromeless:$(CHROMELESS_KANIKO_TAG)
            - --build-arg=IMAGE_TAG=$(CHROMELESS_KANIKO_TAG)
            # Always rebuild layers locally — tag floats across
            # variant runs and we want every push to reflect the
            # current /workspace contents, not a layer cache from
            # a prior tag.
            - --cache=false
            # Forgejo registry is occasionally flaky on the manifest
            # PUT (BUGS-511 / BUGS-513). Let kaniko retry inside a
            # single Job invocation rather than relying on
            # backoffLimit (which respawns the whole pod).
            - --push-retry=3
            - --image-fs-extract-retry=3
            # INFO output is small and post-mortem-useful; DEBUG
            # is verbose enough to drown the actual error.
            - --verbosity=info
          env:
            # REQUIRED — substituted by the wrapper from IMAGE_TAG on
            # the build node. Must be unique per build SHA for
            # auditability; CV2-era convention is "cr<branch>-<sha>"
            # (e.g. cr7727-8367359 for chromeless commit 8367359).
            - name: CHROMELESS_KANIKO_TAG
              value: "${CHROMELESS_KANIKO_TAG}"
            # kaniko reads docker auth from $DOCKER_CONFIG/config.json.
            - name: DOCKER_CONFIG
              value: /kaniko/.docker
          volumeMounts:
            - name: workspace
              mountPath: /workspace
              readOnly: true
            - name: docker-config
              mountPath: /kaniko/.docker
              readOnly: true
          resources:
            requests:
              # 1 -> 200m (2026-08-25). Same reasoning as build-job-x264.yaml:
              # the request buys ADMISSION, the limit does the work. On
              # 2026-08-25 this job died OutOfcpu twice in ten seconds
              # ("requested: 1000, used: 47725, capacity: 48000") on a node
              # whose ACTUAL usage was 13241m — 34 cores idle behind a wall of
              # other teams' reservations. A push that takes ~70s of mostly-IO
              # work should not hold a full core reserved to start.
              cpu: "200m"
              memory: "1Gi"
              # Explicit ephemeral REQUEST decoupled from the 8Gi limit
              # (2026-06-29, tightened 2026-07-02). Setting only the limit
              # makes K8s mirror an implicit 8Gi request; the build nodes run
              # ~97% ephemeral-RESERVED (triform-7: 88.2Gi requested / 92.3Gi
              # allocatable = ~2.06Gi headroom, so even a 2Gi request lost the
              # admission race by 90MB). Kaniko mounts the build context as a
              # read-only hostPath (NOT ephemeral); its ephemeral use is just
              # scratch for extracting the debian-slim base layer + assembling
              # the cloud_browser_worker layer (a few hundred MB). 512Mi is
              # the schedulability floor; the 8Gi limit keeps runtime burst.
              # Same fix as build-job-x264-t7.yaml's ephemeral decoupling.
              ephemeral-storage: "512Mi"
            limits:
              cpu: "4"
              memory: "4Gi"
              ephemeral-storage: "8Gi"
      volumes:
        # Mount the build artifact context that chromeless-build.sh Step 9
        # wrote. Kaniko reads Dockerfile + cloud_browser_worker +
        # supervisord.conf + launch-chromeless.sh + IMAGE_TAG from
        # here.
        #
        # Path is identical on T7 and T8 (parallel build lanes share the
        # same on-node layout); only the nodeName above differs.
        #   T7/T8: /var/lib/longhorn/chromeless-build/chromium-src/artifacts/context
        #   T5 (nvenc, out-of-scope for CV2 M-stack): /mnt/data/chromeless-build-t5/...
        - name: workspace
          hostPath:
            path: /var/lib/longhorn/chromeless-build/chromium-src/artifacts/context
            type: Directory
        # Same Secret the build-job manifests use for imagePullSecret;
        # already exists in chromeless-build ns (see README § Prereqs in
        # the chromeless-build README for how to create it).
        - name: docker-config
          secret:
            secretName: registry-pull
            items:
              - key: .dockerconfigjson
                path: config.json
