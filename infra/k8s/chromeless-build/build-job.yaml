# build-job.yaml — Chromium build Job for triform-8 (T112 + T119 + CV2-rehome).
#
# Drives T113's `build/chromeless-build.sh` end-to-end on a single Pod
# scheduled to triform-8. The script handles gclient sync, symlink,
# patch apply, sccache, gn gen, autoninja, unit tests, and binary
# packaging.
#
# Volume model: hostPath on triform-8's /var/lib/longhorn (the
# dedicated vg-storage/lv-longhorn LVM, ~983GB capacity). The original
# PVC path required openebs-localpv-provisioner which silently refused
# new claims during T119 across openebs-hostpath, triform-data, AND
# ceph-rbd. We replaced the PVCs with hostPath dirs pinned to a named
# build node and stayed there — provisioner-side reliability never
# recovered enough to be worth re-introducing the dependency.
#
# Why triform-8 (over triform-2/6): the build state lives forever on
# whichever node we pin it to (gclient checkout + sccache must not
# travel across nodes), so the right answer is the node with the most
# compute headroom AND a big fast-disk. Picks per node:
#   - triform-6: 5.5T /data but CONTROL-PLANE (etcd, apiserver) +
#     heavy multi-tenant (forgejo-postgres, infra-staging postgres,
#     coder-postgres, nats, isolation-workers). A 16-CPU compile
#     would crowd these out. CPU is the bind, not disk.
#   - triform-2: 1.4T /mnt/data, similar tenancy concerns.
#   - triform-8: 48 CPU (vs 32 on triform-6), NOT control-plane,
#     lighter workload (isolation-builders + coder workspace +
#     ingress), and Longhorn's pool here is nearly empty (~937G
#     free of 983G). Co-tenanting with Longhorn is operator-
#     accepted — competition is fine, S3 backups exist for nuke
#     recovery.
#
# Trade-offs of putting hostPath inside /var/lib/longhorn:
#   - PRO: works without any provisioner involvement.
#   - PRO: ~937G free at chosen path; well beyond what the build
#          needs (chromium-src ~40GB, sccache up to 80G).
#   - CON: shares the LV with Longhorn replica storage. If Longhorn
#          schedules replicas here, we compete for space. Operator-
#          accepted; S3 backups + ability to bump storageReserved
#          later if it becomes an issue.
#   - CON: a future `kubectl delete -f` of Longhorn that wipes
#          /var/lib/longhorn/ would nuke our state. S3 backups
#          mitigate, but expect a multi-hour re-bootstrap.
#   - CON: requires runAsUser:0 in an init container to chown the
#          dir for cbuser (uid 1000). The chart-wide PSP / pod-
#          security baseline allows it; the chromeless-build ns is
#          labelled triform.ai/purpose=build precisely to scope this
#          kind of thing.
#
# CPU is burstable (request: 12, limit: 40) sized for triform-8's
# actual idle pattern: peers reserve ~41/48 CPU but actually use ~18,
# so ~30 CPU sits idle. Request 12 fits scheduler headroom (peers'
# reservations); limit 40 lets autoninja burst into the idle CPUs.
# Memory limit 192Gi accommodates ~30+ parallel compile RSS + the
# chromium link's 10-15GB spike. NINJA_PARALLELISM=36 matches the
# CPU limit minus 4 cores of headroom for sccache server + linker.
#
# Contract with T113 (see ../../../build/chromeless-build.sh header):
#   /workspace            — our repo, read-only mount.
#   /work                 — work-tree root: src/, artifacts/, logs/.
#   /sccache              — sccache cache.
#   CHROMELESS_REPO=/workspace
#   CHROMELESS_WORK_ROOT=/work
#   CHROMIUM_BRANCH_NUMBER=7727 (M147 stable; verify on chromiumdash)
#   SCCACHE_DIR=/sccache
#   CHROMELESS_BUILD_TARGETS=cloud_browser_worker cloud_browser_encoder_unittests cloud_browser_framesink_capturer_unittests cloud_browser_pcf_unittests
#
# Resources: 12 CPU req / 40 CPU limit, 96 GiB req / 192 GiB limit
# on a 48/128 box (triform-8). See the burstable-QoS rationale at
# lines 49-55 above. Headroom for kubelet, sshd, the sccache server,
# and the linker's RSS spike during the chrome-target link.
#
# restartPolicy + backoffLimit: OnFailure + 2 = 3 attempts max.
# Each retry's bootstrap initContainers are idempotent; the hostPath
# dirs survive across retries (and across Job deletions), so a re-run
# picks up incrementally. T113's SKIP_FETCH=1 toggle is set on
# retries so the gclient sync step (which dominates first-run
# wall-clock) doesn't re-do a populated tree.
#
# activeDeadlineSeconds: 8h. T17 §4 cold-build worst case.

apiVersion: batch/v1
kind: Job
metadata:
  name: chromeless-build
  namespace: chromeless-build
  labels:
    app.kubernetes.io/name: chromeless
    app.kubernetes.io/component: build
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 28800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromeless
        app.kubernetes.io/component: build
    spec:
      restartPolicy: OnFailure
      # Pin to triform-8: 48 CPU. hostPath volumes below require this
      # — the directories live on triform-8's /var/lib/longhorn LVM
      # and follow the node, not the Pod.
      nodeName: triform-8
      # If a future cluster admin taints triform-8 (maintenance), the
      # scheduler fails this Pod cleanly rather than picking another
      # node. Repeating the hostname here makes that a NotReady error
      # rather than a silent cross-node migration that would lose
      # access to the hostPath dirs.
      nodeSelector:
        kubernetes.io/hostname: triform-8
      imagePullSecrets:
        - name: registry-pull
      initContainers:
        # 1/2: host-permissions — run as root, chown the hostPath dirs
        # to uid 1000 so the unprivileged builder user in the runner
        # image can write. Idempotent: re-running on a Pod retry
        # finds 1000:1000-owned dirs and the chown is a no-op.
        #
        # The `type: DirectoryOrCreate` on the volumes ensures kubelet
        # creates the dir if absent; the chown happens inside that
        # newly-created dir. We mount /work + /sccache for this
        # container so a single chown covers both hostPath dirs in
        # one shot.
        - name: bootstrap-our-repo
          image: registry.triform.cloud/chromeless/chromeless-build-runner:0.1.4
          command:
            - sh
            - -euxc
            - |
              # Clone or refresh our repo at OUR_REPO_REF.
              # Forgejo instance has REQUIRE_SIGNIN_VIEW=true so anon
              # clones return HTTP 401 even for repos flagged public. Inject
              # creds into the URL at clone time, then scrub them from the
              # stored remote so post-clone git ops don't carry tokens in
              # args/logs. FORGEJO_USERNAME + FORGEJO_PASSWORD come from
              # the forgejo-credentials Secret (mirrored from flux-system).
              AUTH_REPO="https://${FORGEJO_USERNAME}:${FORGEJO_PASSWORD}@${OUR_REPO#https://}"
              if [ ! -d /workspace/.git ]; then
                git clone --depth 1 --branch "${OUR_REPO_REF}" \
                  "${AUTH_REPO}" /workspace
                git -C /workspace remote set-url origin "${OUR_REPO}"
              else
                cd /workspace \
                  && git fetch --depth 1 origin "${OUR_REPO_REF}" \
                  && git reset --hard FETCH_HEAD
              fi

              # Sanity: T113's script must be present.
              if [ ! -x /workspace/build/chromeless-build.sh ]; then
                echo "ERROR: /workspace/build/chromeless-build.sh missing or not executable" >&2
                echo "       Check that ${OUR_REPO_REF} contains T113's deliverable." >&2
                exit 1
              fi

              # Pre-create T113's expected subdirs under /work. The
              # host-permissions initContainer has already chown'd
              # /work + /sccache, but the subdirs inside them haven't
              # been created yet on a fresh hostPath.
              # Chown only the top-level dirs we create + the empty
              # /work/src/chromium subdir (so chromeless-build.sh Step 1
              # can create .gclient inside it as uid 1000). Do NOT chown
              # -R the chromium checkout: a recursive chown updates ctime
              # on every file (incl .git/index), which breaks subsequent
              # uid-1000 git apply --3way --check (rejects with 'does
              # not match index' even though blob hashes are identical).
              mkdir -p /work/src/chromium /work/artifacts /work/logs
              chown 1000:1000 /work/src /work/src/chromium /work/artifacts /work/logs
          env:
            - name: OUR_REPO
              value: "https://forgejo.triform.dev/triform/chromeless.git"
            # Track main by default; set to a tag/SHA for reproducible
            # builds (`kubectl set env job/chromeless-build OUR_REPO_REF=v0.2.0`).
            - name: OUR_REPO_REF
              # cv2/m2-track-source-deps for build #4: validates M2 R1
              # (track-source webrtc deps in patches/0003) on top of
              # integration/native-peer's M1 base (bf3de29 namespace fix).
              # Flip back to "main" after M2 validation merges to main.
              value: "cv2/m2-track-source-deps"
            # Creds for cloning private/internal Forgejo repos. The
            # forgejo-credentials Secret holds username + password
            # (Forgejo PAT). Same Secret pattern used by flux-system
            # for tf-multiverse / tf-alchemy / tf-isolator pulls;
            # mirrored into chromeless-build ns. When the PAT rotates, all
            # consuming namespaces need updating.
            - name: FORGEJO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: forgejo-credentials
                  key: username
            - name: FORGEJO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-credentials
                  key: password
          # Bootstrap also needs root briefly to write under /work
          # (which we just chown'd — but the workspace emptyDir is
          # root-owned at first, and the post-chown of /work/src etc.
          # needs root again). The chained ALL-drop + minimal adds
          # keeps the privilege boundary tight.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - name: workdir
              mountPath: /work
            - name: sccache
              mountPath: /sccache
            - name: workspace
              mountPath: /workspace
      containers:
        - name: build
          image: registry.triform.cloud/chromeless/chromeless-build-runner:0.1.4
          imagePullPolicy: IfNotPresent
          # Invoke T113's script directly from the cloned repo. The
          # earlier brief proposed /work/src/build/chromeless-build.sh as the
          # handoff path; T113 placed it at build/chromeless-build.sh in our
          # repo and CHROMELESS_REPO=/workspace, so the actual path is
          # /workspace/build/chromeless-build.sh. README.md documents this.
          command:
            - bash
            - -c
            - |
              # The chromeless-build-runner image ships /opt/depot_tools without
              # python3_bin_reldir.txt — gn fails with "need to initialize
              # depot_tools" until bootstrap_python3 is run. The bootstrap
              # is idempotent, so doing it on every pod start is cheap.
              (cd /opt/depot_tools && source ./bootstrap_python3 && bootstrap_python3) 2>&1 | tail -3
              exec bash /workspace/build/chromeless-build.sh
          env:
            # Diagnostic only — chromeless-build.sh derives CHROMELESS_GIT_SHA from
            # CHROMELESS_REPO/.git when this is unset, so we provide it for
            # `kubectl describe` legibility.
            - name: OUR_REPO
              value: "https://forgejo.triform.dev/triform/chromeless.git"
            - name: OUR_REPO_REF
              # cv2/m2-track-source-deps for build #4: validates M2 R1
              # (track-source webrtc deps in patches/0003) on top of
              # integration/native-peer's M1 base (bf3de29 namespace fix).
              # Flip back to "main" after M2 validation merges to main.
              value: "cv2/m2-track-source-deps"
            # T113 expects branch number, NOT a full ref. M147 stable
            # tracks 147.0.7727.x — branch 7727. Verify on
            # chromiumdash.appspot.com/branches before each roll.
            - name: CHROMIUM_BRANCH_NUMBER
              value: "7727"
            # Mount roots — match T113's chromeless-build.sh defaults so an
            # operator running the script locally on a dev box doesn't
            # need to set anything different.
            - name: CHROMELESS_REPO
              value: "/workspace"
            - name: CHROMELESS_WORK_ROOT
              value: "/work"
            - name: SCCACHE_DIR
              value: "/sccache"
            # Build targets. chromeless-build.sh ships with the same default,
            # but pinning explicit values here is what `kubectl set env`
            # operators reach for first when iterating. Override path:
            #   kubectl -n chromeless-build set env job/chromeless-build CHROMELESS_BUILD_TARGETS="cloud_browser_worker"
            - name: CHROMELESS_BUILD_TARGETS
              # Fully-qualified gn paths so autoninja addresses the
              # targets directly. Bare names fail with "unknown target"
              # because //cloud-browser/... isn't in chromium's root
              # build graph (a separate fix may also be needed to make
              # gn parse the BUILD.gn at all).
              # 4 targets: worker + 3 unittest suites. pcf_unittests is
              # M2-side coverage of the PCF refactor; encoder/framesink
              # are the M1 + capture-side baselines.
              value: "cloud-browser/capture/build-integration:cloud_browser_worker cloud-browser/capture/build-integration:cloud_browser_encoder_unittests cloud-browser/capture/build-integration:cloud_browser_framesink_capturer_unittests cloud-browser/capture/build-integration:cloud_browser_pcf_unittests"
            # Ninja parallelism sized to CPU limit minus headroom for
            # the sccache server (~1-2 cores) + the LTO linker spike
            # (~2 cores). Limit is 40; 36 parallel ninja jobs leaves
            # 4 cores headroom. autoninja's nproc-based default (48)
            # would over-subscribe the 40-CPU limit.
            - name: NINJA_PARALLELISM
              value: "36"
            # T113 reads SKIP_FETCH=1 to skip the gclient sync on
            # retries. The hostPath dirs survive across Job deletions,
            # so a manual `kubectl set env job/chromeless-build SKIP_FETCH=1`
            # before re-applying skips the multi-hour fetch.
            - name: SKIP_FETCH
              # "1" — triform-8 already has chromium-src synced from
              # build #1 (against main, pre-M1). cd429b1's build.sh
              # apply-patches now resets to refs/remotes/branch-heads/
              # ${CHROMIUM_BRANCH_NUMBER} when LKGM isn't in the shallow
              # clone, so the tree's stale-from-main-patches state will
              # be self-healed before patch apply. Saves ~15-30 min vs
              # a fresh gclient sync.
              value: "1"
            # STUB_MODE=1 short-circuits the heavy steps — useful
            # for validating Job plumbing without a 4–8h wait.
            # Default off; flip to "1" for the DoD smoke run.
            - name: STUB_MODE
              value: ""
            # sccache server lifecycle. Idle-timeout 0 keeps the
            # server alive for the full build (it forks one server
            # per shell otherwise).
            - name: SCCACHE_IDLE_TIMEOUT
              value: "0"
            - name: SCCACHE_CACHE_SIZE
              value: "80G"
          resources:
            requests:
              # Burstable QoS — see build-job.yaml header. Request was
              # 12 CPU; observed 2026-05-17 that triform-8 had only
              # ~6.7 free CPU (triform-tf workspace 16.5 + 3×
              # isolation-builders 12 + longhorn instance-manager 5.8
              # + misc absorbed most of the 48 capacity). 12 → OutOfcpu.
              # Reduce request to 6 so the pod schedules; the limit of
              # 40 keeps the actual compute envelope identical — autoninja
              # bursts into idle CPU when peers leave it.
              cpu: "6"
              memory: "96Gi"
            limits:
              cpu: "40"
              memory: "192Gi"
              ephemeral-storage: "8Gi"
          volumeMounts:
            - name: workdir
              mountPath: /work
            - name: sccache
              mountPath: /sccache
            - name: workspace
              mountPath: /workspace
              # Read-only: chromeless-build.sh only reads from CHROMELESS_REPO. If the
              # script grows a need to write (e.g., generated headers
              # cached in-tree), flip to RW + accept that the cloned
              # tree drifts across runs.
              readOnly: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        # CV2-rehome: hostPath on triform-8's /var/lib/longhorn LVM
        # (vg-storage/lv-longhorn, ~983G). Co-tenanting with Longhorn
        # is operator-accepted; competition is fine, S3 backups exist
        # for nuke recovery. cleanup-job.yaml needs corresponding
        # update — wipes here too (separate commit). DirectoryOrCreate
        # lets kubelet create the subdir on first run; the host-
        # permissions initContainer chowns to 1000.
        - name: workdir
          hostPath:
            path: /var/lib/longhorn/chromeless-build/chromium-src
            type: DirectoryOrCreate
        - name: sccache
          hostPath:
            path: /var/lib/longhorn/chromeless-build/sccache
            type: DirectoryOrCreate
        # Our repo lives in an emptyDir — bootstrap initContainer
        # populates it once, main container reads-only. Survival
        # across Pod restarts isn't needed; bootstrap is cheap and
        # idempotent.
        - name: workspace
          emptyDir:
            sizeLimit: 1Gi
