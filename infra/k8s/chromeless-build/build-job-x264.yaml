# build-job-x264.yaml — Chromium build Job, x264 profile (Track F1).
#
# This variant uses debian:bookworm-slim as the base image with an
# inline depot_tools install, instead of the chromeless-build-runner image.
# Why: triform-2's containerd metadata.db has 467/640 orphan-in-DB
# snapshot entries (see feedback_containerd_orphan_in_db_class.md);
# any image whose chain references a missing on-disk snapshot fails
# to start with `Init:CreateContainerError: failed to stat parent`.
# chromeless-build-runner:0.1.3 is one such broken chain on triform-2.
#
# debian:bookworm-slim was pulled into containerd's CAS at a
# different time and its chain is intact, so it starts cleanly.
# The bootstrap initContainer apt-installs the same packages
# Dockerfile.build-runner does (verified equivalent set), clones
# depot_tools to /work/depot_tools (hostPath, persists across runs),
# downloads sccache to /work/depot_tools-bin, and stages libx264.
# The main build container reuses /work/depot_tools and runs the
# existing chromeless-build.sh unchanged.
#
# Trade-off vs chromeless-build-runner: ~60-90s extra per fresh-host pod
# start for the apt install. Idempotent: depot_tools and sccache
# in /work persist across runs, so warm-pod startup is faster.
# This Job replaces the registry image dependency entirely until
# the bbolt-surgery teammate clears the orphan-in-DB entries on
# triform-2; once the registry chain is healthy again, this can
# be reverted to use chromeless-build-runner:0.1.3 (sccache+depot_tools
# pre-baked).
#
# Profile selector: CHROMELESS_BUILD_PROFILE=x264 in the main env. chromeless-build.sh
# step 3.5 verifies /work/system-libs has the staged libx264 headers
# and lib; build.sh:cmd_gen imports args.x264.gn instead of args.gn.

apiVersion: batch/v1
kind: Job
metadata:
  name: chromeless-build-x264
  namespace: chromeless-build
  labels:
    app.kubernetes.io/name: chromeless
    app.kubernetes.io/component: build
    app.kubernetes.io/variant: x264
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 28800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromeless
        app.kubernetes.io/component: build
        app.kubernetes.io/variant: x264
    spec:
      restartPolicy: OnFailure
      # Re-homed to triform-8 alongside the default build-job.yaml
      # (CV2-rehome). Build state lives on /var/lib/longhorn,
      # co-tenanting with Longhorn's pool; see build-job.yaml header
      # for the full reasoning.
      nodeName: triform-8
      nodeSelector:
        kubernetes.io/hostname: triform-8
      imagePullSecrets:
        - name: registry-pull
      initContainers:
        - name: bootstrap-our-repo
          image: debian:bookworm-slim
          command:
            - bash
            - -euxc
            - |
              # ---- Phase 1: install OS deps ----------------------
              # Mirrors Dockerfile.build-runner's apt-install set so the
              # main container can rely on the same baseline.
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git python3 python3-pip \
                build-essential pkg-config sudo lsb-release file \
                xz-utils zstd rsync findutils libglib2.0-0 gperf \
                bison flex

              # ---- Phase 2: clone chromeless to /workspace --------
              AUTH_REPO="https://${FORGEJO_USERNAME}:${FORGEJO_PASSWORD}@${OUR_REPO#https://}"
              if [ ! -d /workspace/.git ]; then
                git clone --depth 1 --branch "${OUR_REPO_REF}" \
                  "${AUTH_REPO}" /workspace
                git -C /workspace remote set-url origin "${OUR_REPO}"
              else
                cd /workspace \
                  && git fetch --depth 1 origin "${OUR_REPO_REF}" \
                  && git reset --hard FETCH_HEAD
              fi
              [ -x /workspace/build/chromeless-build.sh ] || {
                echo "ERROR: /workspace/build/chromeless-build.sh missing"; exit 1; }

              # ---- Phase 3: depot_tools (idempotent) -------------
              if [ ! -x /work/depot_tools/gn ] && [ ! -d /work/depot_tools/.git ]; then
                git clone --depth 200 \
                  https://chromium.googlesource.com/chromium/tools/depot_tools.git \
                  /work/depot_tools
              else
                cd /work/depot_tools && git pull --ff-only || true
              fi

              # ---- Phase 4: sccache (idempotent) -----------------
              SCCACHE_VERSION=v0.8.2
              if [ ! -x /work/depot_tools-bin/sccache ]; then
                mkdir -p /work/depot_tools-bin
                curl -fSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
                  -o /tmp/sccache.tar.gz
                tar -xzf /tmp/sccache.tar.gz -C /tmp
                install -m 0755 \
                  "/tmp/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache" \
                  /work/depot_tools-bin/sccache
                rm -rf /tmp/sccache.tar.gz "/tmp/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl"
              fi

              # ---- Phase 5: workdirs -----------------------------
              mkdir -p /work/src/chromium /work/artifacts /work/logs
              # chown /work/src/chromium too (the empty subdir, without -R) so
              # chromeless-build.sh Step 1 can write .gclient inside it as uid
              # 1000. -R is deliberately avoided on the chromium tree because
              # it updates ctime on every .git file, breaking subsequent
              # git apply --3way --check (rejects with 'does not match index'
              # even though blob hashes are identical).
              chown 1000:1000 /work/src /work/src/chromium /work/artifacts /work/logs
              chown -R 1000:1000 /work/depot_tools /work/depot_tools-bin

              # ---- Phase 6: x264 staging (idempotent) ------------
              if [ ! -e /work/system-libs/include/x264.h ]; then
                apt-get install -y --no-install-recommends libx264-dev
                mkdir -p /work/system-libs/include /work/system-libs/lib
                cp -a  /usr/include/x264.h         /work/system-libs/include/
                cp -a  /usr/include/x264_config.h  /work/system-libs/include/
                cp -aP /usr/lib/x86_64-linux-gnu/libx264.so* /work/system-libs/lib/
                chown -R 1000:1000 /work/system-libs
                ls -la /work/system-libs/include /work/system-libs/lib
              fi
          env:
            - name: OUR_REPO
              value: "https://forgejo.triform.dev/triform/chromeless.git"
            - name: OUR_REPO_REF
              # cv2/m2-track-source-deps for M2 R1-R4 validation on t8.
              # Init container MUST match build container's value so
              # /workspace has the right script (see 337bc88 for the
              # bite that taught us this invariant). Flip back to "main"
              # after M2 merges to main.
              value: "cv2/m2-track-source-deps"
            - name: FORGEJO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: forgejo-credentials
                  key: username
            - name: FORGEJO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-credentials
                  key: password
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # CHOWN/FOWNER/DAC_OVERRIDE: workdir setup
              # SETUID/SETGID: apt drops to _apt user during fetch
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]
          volumeMounts:
            - name: workdir
              mountPath: /work
            - name: workspace
              mountPath: /workspace
      containers:
        - name: build
          image: debian:bookworm-slim
          imagePullPolicy: IfNotPresent
          # Runs as root — debian:bookworm-slim doesn't ship a builder
          # user, and apt-get install (needed for the OS deps the build
          # uses) requires root. We create a uid-1000 builder user
          # inline, install OS deps as root, then drop to builder for
          # the chromium compile. The chromium-src hostPath has been
          # owned 1000:1000 since the chromeless-build-runner runs, so the
          # ownership scheme is preserved across both build paths
          # (this debian-based fallback and the original
          # chromeless-build-runner once its broken chain clears).
          command:
            - bash
            - -c
            - |
              set -euxo pipefail

              # ---- OS deps (root) --------------------------------
              # Same set as the bootstrap initContainer. apt is
              # package-deduped so this re-pulls only what isn't in
              # the deb cache; cost ~30s warm, ~60s cold.
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git python3 python3-pip \
                build-essential pkg-config lsb-release file \
                xz-utils zstd rsync findutils libglib2.0-0 gperf \
                bison flex

              # ---- builder user ---------------------------------
              # chromeless-build-runner's image creates this at build time;
              # we do it at runtime since debian:bookworm-slim is bare.
              # Idempotent: -m creates /home/builder, useradd skips on
              # existing user.
              if ! id builder >/dev/null 2>&1; then
                useradd -m -u 1000 -s /bin/bash builder
              fi
              # /home/builder/.cache is where depot_tools puts gclient
              # state and various tool caches. Pre-create + own it.
              mkdir -p /home/builder/.cache
              chown -R 1000:1000 /home/builder

              # ---- drop to builder + exec the build --------------
              # depot_tools and sccache come from /work (hostPath,
              # populated by the bootstrap initContainer).
              # bootstrap_python3 must run once per pod start (the
              # marker file is in depot_tools/.cipd_bin which we
              # didn't bake — runs idempotently if marker exists).
              su builder -c '
                set -euxo pipefail
                export PATH=/work/depot_tools:/work/depot_tools-bin:/usr/local/bin:/usr/bin:/bin
                export DEPOT_TOOLS_UPDATE=0
                export HOME=/home/builder
                (cd /work/depot_tools && source ./bootstrap_python3 && bootstrap_python3) 2>&1 | tail -3 || true
                exec bash /workspace/build/chromeless-build.sh
              '
          env:
            - name: OUR_REPO
              value: "https://forgejo.triform.dev/triform/chromeless.git"
            - name: OUR_REPO_REF
              # cv2/m2-track-source-deps for M2 R1-R4 validation on t8.
              # Init container MUST match build container's value so
              # /workspace has the right script (see 337bc88 for the
              # bite that taught us this invariant). Flip back to "main"
              # after M2 merges to main.
              value: "cv2/m2-track-source-deps"
            - name: CHROMIUM_BRANCH_NUMBER
              value: "7727"
            - name: CHROMELESS_REPO
              value: "/workspace"
            - name: CHROMELESS_WORK_ROOT
              value: "/work"
            # ---- sccache S3 backend (Hetzner Object Storage) ----
            # Replaces the per-node hostPath /sccache. The hostPath
            # could never share TUs across pods because sccache's
            # compiler-input hash folds in pod-instance identity
            # (PATH/env/wrapper) — confirmed cold across Builds #15-#23.
            # A shared S3 bucket keyed by the real compiler-input hash
            # gives true cross-pod / cross-node cache reuse.
            - name: SCCACHE_BUCKET
              value: "triform-cv2-sccache"
            - name: SCCACHE_ENDPOINT
              value: "https://hel1.your-objectstorage.com"
            - name: SCCACHE_REGION
              value: "auto"
            - name: SCCACHE_S3_USE_SSL
              value: "true"
            - name: SCCACHE_S3_KEY_PREFIX
              value: "cv2/sccache/"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: sccache-s3-creds
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sccache-s3-creds
                  key: AWS_SECRET_ACCESS_KEY
            - name: CHROMELESS_BUILD_TARGETS
              value: "cloud-browser/capture/build-integration:cloud_browser_worker headless:resource_pack_data headless:resource_pack_strings cloud-browser/capture/build-integration:cloud_browser_encoder_unittests cloud-browser/capture/build-integration:cloud_browser_framesink_capturer_unittests"
            - name: NINJA_PARALLELISM
              # See build-job.yaml header — sized to the 40-CPU limit
              # minus headroom for sccache server + LTO linker.
              value: "36"
            - name: SKIP_FETCH
              # "1" — triform-8 has chromium-src + sccache warm from
              # build #1 (main, pre-M1). f9017f5 in build.sh now does
              # surgical clean (only third_party/webrtc_overrides/
              # cloud_browser/) so the SKIP_FETCH retry path is safe;
              # no risk of nuking buildtools/gn etc. like the rootwide
              # clean did on triform-7.
              value: "1"
            - name: STUB_MODE
              value: ""
            - name: SKIP_CDP_VALIDATION
              # "1" — build container image is debian:bookworm-slim
              # which has no kubectl. STEP 10's `kubectl apply` of the
              # CDP validation manifest fails with exit 127. Without
              # this, STEP 10 forces Job=Failed even though STEPS 1-9
              # built + packaged + staged a working binary. Observed
              # on build #3 + build #7 v11 (l6mkv). Per
              # chromeless-build.sh:520+ (the matching guard added in
              # a0d1fe9), value=1 short-circuits the kubectl call and
              # exits 0 cleanly. Same shape as build-job-x264-t7.yaml's
              # SKIP_CDP_VALIDATION env.
              value: "1"
            - name: SCCACHE_IDLE_TIMEOUT
              value: "0"
            - name: SCCACHE_CACHE_SIZE
              value: "80G"
            - name: CHROMELESS_BUILD_PROFILE
              value: "x264"
          resources:
            requests:
              # cpu 6 (not 12) to fit triform-8's actual headroom
              # ~6.7 free CPU after triform-tf workspace + isolation
              # builders + longhorn instance-manager. Limit stays at
              # 40 so autoninja bursts into idle CPU when peers leave.
              cpu: "6"
              # MEASURED, not guessed. A full build of this target list peaks at
              # ~57 GiB (kubectl top, sampled through compile + link on
              # 2026-08-19: steady ~50 GiB, peak 56,963 Mi). The request was
              # 96 GiB, which is not conservatism — it is a scheduling lie
              # that cost two OOM evictions at ADMISSION on 2026-08-19 while
              # triform-8 had ~29 GiB free and the pod would never have
              # touched more than 57.
              #
              # 72Gi = measured peak + ~26% headroom, which covers a colder
              # cache and a larger target list without pretending to need
              # a third of the node. Same reasoning main applied to CPU in
              # e654ed6 (4 -> 2), where requests ran ~10x actual usage.
              memory: "72Gi"
            limits:
              cpu: "40"
              memory: "192Gi"
              ephemeral-storage: "8Gi"
          volumeMounts:
            - name: workdir
              mountPath: /work
            - name: workspace
              mountPath: /workspace
              readOnly: true
          # Main container runs as root so apt-get install works;
          # the bash command then `useradd builder` (uid 1000) and
          # `su builder -c` for the chromium compile so the in-tree
          # writes inherit 1000:1000 ownership consistent with the
          # chromeless-build-runner-based path.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # SETUID/SETGID for su to drop to builder; CHOWN/FOWNER
              # for the inline /home/builder ownership setup; DAC_OVERRIDE
              # for cross-uid file access during the apt+useradd setup.
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        # Shares /var/lib/longhorn/chromeless-build/ with build-job.yaml
        # (default) — gclient checkout warm across variants. sccache is
        # now a shared Hetzner S3 backend (SCCACHE_BUCKET=triform-cv2-sccache),
        # not a per-node hostPath — the hostPath never shared TUs cross-pod.
        - name: workdir
          hostPath:
            path: /var/lib/longhorn/chromeless-build/chromium-src
            type: DirectoryOrCreate
        - name: workspace
          emptyDir:
            sizeLimit: 1Gi
