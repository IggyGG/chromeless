# chromeless-build namespace — isolates the Chromium-from-source build job
# (T112). Lives separately from `chromeless` (the runtime
# namespace from T50) because:
#
# - The build needs hostPath storage bound to a specific node (triform-8).
#   Mixing that into the runtime ns pollutes the per-region label
#   semantics from T94.
# - Resource quotas / NetworkPolicies for the runtime apps are tighter
#   than what a Chromium build needs (egress to chromium.googlesource.com,
#   storage.googleapis.com for Goma artifacts, etc.).
# - The build job is *one* long-running Job; the runtime ns is a
#   churning fleet of Pods. Different operational rhythms.
#
# T113's chromeless-build.sh runs inside this ns; T114 (GPU runtime test)
# stays in the runtime ns where the chromium Pods already live.

apiVersion: v1
kind: Namespace
metadata:
  name: chromeless-build
  labels:
    app.kubernetes.io/name: chromeless
    app.kubernetes.io/component: build
    app.kubernetes.io/part-of: chromeless
    # Mark as a build/CI ns so cluster-wide policies (e.g.
    # "no privileged Pods in runtime namespaces") don't apply here.
    triform.ai/purpose: build
