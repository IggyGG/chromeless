# cleanup-job.yaml — wipe the hostPath build state on triform-8.
#
# Usage:
#   kubectl apply -f infra/k8s/chromeless-build/cleanup-job.yaml
#   kubectl logs -n chromeless-build job/chromeless-build-cleanup -f
#
# Run this when:
#   - Chromium branch rolled and you want a clean tree (cheaper than
#     a partial gclient sync if patches drifted heavily).
#   - sccache eviction has been thrashing and you want a fresh cache.
#   - A broken build left the tree in a state chromeless-build.sh can't
#     recover from (rare; T113 is mostly idempotent).
#
# This is OPT-IN — `kubectl apply -k infra/k8s/chromeless-build/` does NOT
# include this Job (kustomization.yaml's resources list omits it).
# That's deliberate: the build hostPath dirs are valuable across
# Job runs (the whole point of the workaround) and we don't want
# `apply -k` to surprise the operator by wiping them.
#
# Selective cleanup: edit the `command` to remove only one of
# /var/lib/longhorn/chromeless-build/{chromium-src,sccache} when you
# want to keep one. E.g. preserve sccache for fast incremental builds
# while doing a clean fetch:
#   args: ["-rxc", "rm -rf /lh/chromeless-build/chromium-src && ls -la /lh/chromeless-build"]
#
# NOTE: the build state co-tenants with Longhorn's data dir at
# /var/lib/longhorn/. This cleanup ONLY removes the chromeless-build/
# subdirectory we create; it does NOT touch Longhorn's replicas/,
# engine-binaries/, or other Longhorn-managed files.

apiVersion: batch/v1
kind: Job
metadata:
  name: chromeless-build-cleanup
  namespace: chromeless-build
  labels:
    app.kubernetes.io/name: chromeless
    app.kubernetes.io/component: build
    app.kubernetes.io/purpose: cleanup
spec:
  backoffLimit: 0     # No retries — a failed cleanup wants eyes on it.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromeless
        app.kubernetes.io/component: build
        app.kubernetes.io/purpose: cleanup
    spec:
      restartPolicy: Never
      # Same node pinning as the build Job — the hostPath we're
      # wiping lives on triform-8 only.
      nodeName: triform-8
      nodeSelector:
        kubernetes.io/hostname: triform-8
      containers:
        - name: cleanup
          image: alpine:3.20
          command:
            - sh
            - -euxc
            - |
              # Show what we're about to delete (size, age). Helpful
              # for the operator reading kubectl logs after the fact.
              if [ -d /lh/chromeless-build ]; then
                echo "[cleanup] /var/lib/longhorn/chromeless-build contents before wipe:"
                du -sh /lh/chromeless-build/* 2>/dev/null || true
                ls -la /lh/chromeless-build/ || true
              else
                echo "[cleanup] /var/lib/longhorn/chromeless-build does not exist; nothing to do"
                exit 0
              fi

              # Wipe ONLY the chromeless-build subdirs. We must not touch
              # neighbouring Longhorn-managed files (replicas/,
              # engine-binaries/, longhorn-disk.cfg).
              rm -rf "/lh/chromeless-build/chromium-src"
              rm -rf "/lh/chromeless-build/sccache"
              # Leave /lh/chromeless-build itself in place — it's the parent
              # the build Job's hostPath assumes exists.

              echo "[cleanup] /var/lib/longhorn/chromeless-build after wipe:"
              ls -la /lh/chromeless-build/ || true
              echo "[cleanup] free space on /var/lib/longhorn:"
              df -h /lh
          # Root + minimal capabilities — needs to chmod into the dirs
          # the build Job created as 1000:1000 to remove them.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["DAC_OVERRIDE"]
          volumeMounts:
            # Mount /var/lib/longhorn (the LVM root for our build state)
            # as /lh inside the pod for brevity in the shell commands
            # above. The hostPath type is `Directory` (not
            # DirectoryOrCreate) because /var/lib/longhorn MUST already
            # exist on triform-8 — if Longhorn isn't initialized here
            # then we have a bigger problem than a missing build dir.
            - name: lh
              mountPath: /lh
      volumes:
        - name: lh
          hostPath:
            path: /var/lib/longhorn
            type: Directory
