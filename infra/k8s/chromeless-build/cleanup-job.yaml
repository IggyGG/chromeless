# cleanup-job.yaml — wipe the hostPath build state on triform-6.
#
# Usage:
#   kubectl apply -f infra/k8s/chromeless-build/cleanup-job.yaml
#   kubectl logs -n chromeless-build job/chromeless-build-cleanup -f
#
# Run this when:
#   - Chromium branch rolled and you want a clean tree (cheaper than
#     a partial gclient sync if patches drifted heavily).
#   - sccache eviction has been thrashing and you want a fresh cache.
#   - A broken build left the tree in a state chromeless-build.sh can't
#     recover from (rare; T113 is mostly idempotent).
#
# This is OPT-IN — `kubectl apply -k infra/k8s/chromeless-build/` does NOT
# include this Job (kustomization.yaml's resources list omits it).
# That's deliberate: the build hostPath dirs are valuable across
# Job runs (the whole point of the workaround) and we don't want
# `apply -k` to surprise the operator by wiping them.
#
# Selective cleanup: edit the `command` to remove only one of
# /data/chromeless-build/{chromium-src,sccache} when you want to keep one.
# E.g. preserve sccache for fast incremental builds while doing a
# clean fetch:
#   args: ["-rxc", "rm -rf /data/chromeless-build/chromium-src && ls -la /data/chromeless-build"]

apiVersion: batch/v1
kind: Job
metadata:
  name: chromeless-build-cleanup
  namespace: chromeless-build
  labels:
    app.kubernetes.io/name: chromeless
    app.kubernetes.io/component: build
    app.kubernetes.io/purpose: cleanup
spec:
  backoffLimit: 0     # No retries — a failed cleanup wants eyes on it.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromeless
        app.kubernetes.io/component: build
        app.kubernetes.io/purpose: cleanup
    spec:
      restartPolicy: Never
      # Same node pinning as the build Job — the hostPath we're
      # wiping lives on triform-6 only.
      nodeName: triform-6
      nodeSelector:
        kubernetes.io/hostname: triform-6
      containers:
        - name: cleanup
          image: alpine:3.20
          command:
            - sh
            - -euxc
            - |
              # Show what we're about to delete (size, age). Helpful
              # for the operator reading kubectl logs after the fact.
              if [ -d /data/chromeless-build ]; then
                echo "[cleanup] /data/chromeless-build contents before wipe:"
                du -sh /data/chromeless-build/* 2>/dev/null || true
                ls -la /data/chromeless-build/ || true
              else
                echo "[cleanup] /data/chromeless-build does not exist; nothing to do"
                exit 0
              fi

              # Wipe both subdirs. The build Job's hostPath
              # DirectoryOrCreate will recreate them on next apply.
              # The :? prevents an unset-var rm from going haywire,
              # though the literal path makes that defensive overkill.
              rm -rf "/data/chromeless-build/chromium-src"
              rm -rf "/data/chromeless-build/sccache"
              # Leave /data/chromeless-build itself in place — it's the parent
              # the build Job's hostPath assumes exists.

              echo "[cleanup] /data/chromeless-build after wipe:"
              ls -la /data/chromeless-build/ || true
              echo "[cleanup] free space on /data:"
              df -h /data
          # Root + minimal capabilities — needs to chmod into the dirs
          # the build Job created as 1000:1000 to remove them.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["DAC_OVERRIDE"]
          volumeMounts:
            # Mount the parent so `df /data` works and we can list
            # neighbouring dirs (e.g. image-backups) for sanity.
            # The hostPath type is `Directory` (not DirectoryOrCreate)
            # because /data MUST already exist on triform-6 — the
            # cleanup-on-missing-mount case is a no-op handled by the
            # `if [ -d /data/chromeless-build ]` guard above.
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /data
            type: Directory
