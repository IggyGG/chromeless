# build-job-x264-t7.yaml — Chromium build Job, x264 profile, triform-7 lane.
#
# Parallel build environment on triform-7 — twin of triform-8's
# build-job-x264.yaml, separate hostPath state for true cross-node
# parallelism. The two Jobs are intentionally independent: each has its
# own /var/lib/longhorn/chromeless-build tree on its own node, so they
# can build different chromeless branches (or the same branch with
# different patches/gn args) at the same time without contending for
# the same gclient checkout, sccache, or LTO linker pool.
#
# Why triform-7: at rehome time triform-7 was sitting at ~3% CPU /
# ~6% memory utilization with 826.9G free on /var/lib/longhorn —
# the same shape as triform-8's Longhorn data dir, confirmed by node
# probe (sdh 500G + vg-storage/lv-longhorn LVM giving ~983G total).
#
# Sizing matches triform-8: requests cpu 12 / mem 96Gi, limits
# cpu 40 / mem 192Gi, NINJA_PARALLELISM=36. triform-7 has 48 CPU
# (same as triform-8) so the same envelope fits.
#
# See build-job-x264.yaml for the bbolt/containerd background on why
# the build uses debian:bookworm-slim with an inline depot_tools
# bootstrap instead of the chromeless-build-runner image. The two Jobs
# share that bootstrap logic verbatim — only node, hostPath ownership
# (per-node), and labels differ.

apiVersion: batch/v1
kind: Job
metadata:
  name: chromeless-build-x264-t7
  namespace: chromeless-build
  labels:
    app.kubernetes.io/name: chromeless
    app.kubernetes.io/component: build
    app.kubernetes.io/variant: x264-t7
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 28800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromeless
        app.kubernetes.io/component: build
        app.kubernetes.io/variant: x264-t7
    spec:
      restartPolicy: OnFailure
      # Pinned to triform-7 — second build lane. The twin Job
      # build-job-x264.yaml lives on triform-8. Each node has its
      # own /var/lib/longhorn/chromeless-build hostPath state, so
      # the two Jobs do not share gclient/sccache and can run
      # concurrently against different refs.
      nodeName: triform-7
      nodeSelector:
        kubernetes.io/hostname: triform-7
      imagePullSecrets:
        - name: registry-pull
      initContainers:
        - name: bootstrap-our-repo
          image: debian:bookworm-slim
          command:
            - bash
            - -euxc
            - |
              # ---- Phase 1: install OS deps ----------------------
              # Mirrors Dockerfile.build-runner's apt-install set so the
              # main container can rely on the same baseline.
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git python3 python3-pip \
                build-essential pkg-config sudo lsb-release file \
                xz-utils zstd rsync findutils libglib2.0-0 gperf \
                bison flex

              # ---- Phase 2: clone chromeless to /workspace --------
              AUTH_REPO="https://${FORGEJO_USERNAME}:${FORGEJO_PASSWORD}@${OUR_REPO#https://}"
              if [ ! -d /workspace/.git ]; then
                git clone --depth 1 --branch "${OUR_REPO_REF}" \
                  "${AUTH_REPO}" /workspace
                git -C /workspace remote set-url origin "${OUR_REPO}"
              else
                cd /workspace \
                  && git fetch --depth 1 origin "${OUR_REPO_REF}" \
                  && git reset --hard FETCH_HEAD
              fi
              [ -x /workspace/build/chromeless-build.sh ] || {
                echo "ERROR: /workspace/build/chromeless-build.sh missing"; exit 1; }

              # ---- Phase 3: depot_tools (idempotent) -------------
              if [ ! -x /work/depot_tools/gn ] && [ ! -d /work/depot_tools/.git ]; then
                git clone --depth 200 \
                  https://chromium.googlesource.com/chromium/tools/depot_tools.git \
                  /work/depot_tools
              else
                cd /work/depot_tools && git pull --ff-only || true
              fi

              # ---- Phase 4: sccache (idempotent) -----------------
              SCCACHE_VERSION=v0.8.2
              if [ ! -x /work/depot_tools-bin/sccache ]; then
                mkdir -p /work/depot_tools-bin
                curl -fSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
                  -o /tmp/sccache.tar.gz
                tar -xzf /tmp/sccache.tar.gz -C /tmp
                install -m 0755 \
                  "/tmp/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache" \
                  /work/depot_tools-bin/sccache
                rm -rf /tmp/sccache.tar.gz "/tmp/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl"
              fi

              # ---- Phase 5: workdirs -----------------------------
              mkdir -p /work/src/chromium /work/artifacts /work/logs
              # chown /work/src/chromium too (the empty subdir, without -R) so
              # chromeless-build.sh Step 1 can write .gclient inside it as uid
              # 1000. -R is deliberately avoided on the chromium tree because
              # it updates ctime on every .git file, breaking subsequent
              # git apply --3way --check (rejects with 'does not match index'
              # even though blob hashes are identical).
              chown 1000:1000 /work/src /work/src/chromium /work/artifacts /work/logs
              chown -R 1000:1000 /work/depot_tools /work/depot_tools-bin

              # ---- Phase 6: x264 staging (idempotent) ------------
              if [ ! -e /work/system-libs/include/x264.h ]; then
                apt-get install -y --no-install-recommends libx264-dev
                mkdir -p /work/system-libs/include /work/system-libs/lib
                cp -a  /usr/include/x264.h         /work/system-libs/include/
                cp -a  /usr/include/x264_config.h  /work/system-libs/include/
                cp -aP /usr/lib/x86_64-linux-gnu/libx264.so* /work/system-libs/lib/
                chown -R 1000:1000 /work/system-libs
                ls -la /work/system-libs/include /work/system-libs/lib
              fi
          env:
            - name: OUR_REPO
              value: "https://forgejo.triform.dev/triform/chromeless.git"
            - name: OUR_REPO_REF
              # MUST stay in sync with the build container's
              # OUR_REPO_REF below. The init container clones this ref
              # into /workspace; the build container executes
              # /workspace/build/chromeless-build.sh from THAT ref's
              # snapshot. Mismatch silently runs an old script — bit us
              # 2026-05-17: init=main + build=cv2/m2 meant the
              # SKIP_CDP_VALIDATION fix on cv2/m2's script never ran
              # because /workspace had main's older script. Build #5
              # attempts 1 + 2 both hit STEP 10 exit 127.
              value: "cv2/idle-refresh-capturer"
            - name: FORGEJO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: forgejo-credentials
                  key: username
            - name: FORGEJO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-credentials
                  key: password
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # CHOWN/FOWNER/DAC_OVERRIDE: workdir setup
              # SETUID/SETGID: apt drops to _apt user during fetch
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]
          volumeMounts:
            - name: workdir
              mountPath: /work
            - name: workspace
              mountPath: /workspace
      containers:
        - name: build
          image: debian:bookworm-slim
          imagePullPolicy: IfNotPresent
          # See build-job-x264.yaml header — same root→builder
          # ownership scheme is reproduced here unchanged.
          command:
            - bash
            - -c
            - |
              set -euxo pipefail

              # ---- OS deps (root) --------------------------------
              # Same set as the bootstrap initContainer. apt is
              # package-deduped so this re-pulls only what isn't in
              # the deb cache; cost ~30s warm, ~60s cold.
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git python3 python3-pip \
                build-essential pkg-config lsb-release file \
                xz-utils zstd rsync findutils libglib2.0-0 gperf \
                bison flex

              # ---- builder user ---------------------------------
              if ! id builder >/dev/null 2>&1; then
                useradd -m -u 1000 -s /bin/bash builder
              fi
              mkdir -p /home/builder/.cache
              chown -R 1000:1000 /home/builder

              # ---- drop to builder + exec the build --------------
              su builder -c '
                set -euxo pipefail
                export PATH=/work/depot_tools:/work/depot_tools-bin:/usr/local/bin:/usr/bin:/bin
                export DEPOT_TOOLS_UPDATE=0
                export HOME=/home/builder
                (cd /work/depot_tools && source ./bootstrap_python3 && bootstrap_python3) 2>&1 | tail -3 || true
                exec bash /workspace/build/chromeless-build.sh
              '
          env:
            - name: OUR_REPO
              value: "https://forgejo.triform.dev/triform/chromeless.git"
            - name: OUR_REPO_REF
              # cv2/idle-refresh-capturer (2026-07-02): the deploy
              # lineage — wave-3 base (ContentClient + pak-scale +
              # compositor drain + retarget) PLUS warm-snapshot
              # Cb.startNativeSession, D18b answer tolerance/buffer,
              # idle-refresh hold-and-repeat, IncrementCapturerCount
              # capture-keepalive, dcheck_always_on=false, and the
              # CB_UA_RESOURCE renderer resource-path probe. Provenance
              # gate: built binary MUST contain "no track-source getter"
              # and MUST NOT contain "no video track source".
              value: "cv2/idle-refresh-capturer"
            - name: CHROMIUM_BRANCH_NUMBER
              value: "7727"
            - name: CHROMELESS_REPO
              value: "/workspace"
            - name: CHROMELESS_WORK_ROOT
              value: "/work"
            # ---- sccache S3 backend (Hetzner Object Storage) ----
            # Replaces the per-node hostPath /sccache. The hostPath
            # could never share TUs across pods because sccache's
            # compiler-input hash folds in pod-instance identity
            # (PATH/env/wrapper) — confirmed cold across Builds #15-#23.
            # A shared S3 bucket keyed by the real compiler-input hash
            # gives true cross-pod / cross-node cache reuse.
            - name: SCCACHE_BUCKET
              value: "triform-cv2-sccache"
            - name: SCCACHE_ENDPOINT
              value: "https://hel1.your-objectstorage.com"
            - name: SCCACHE_REGION
              value: "auto"
            - name: SCCACHE_S3_USE_SSL
              value: "true"
            - name: SCCACHE_S3_KEY_PREFIX
              value: "cv2/sccache/"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: sccache-s3-creds
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sccache-s3-creds
                  key: AWS_SECRET_ACCESS_KEY
            - name: CHROMELESS_BUILD_TARGETS
              # Build-czar 2026-05-17 (opt B, post Build #23): drop the
              # 3 unittest targets — cloud_browser_worker ONLY. Build #23
              # proved every PRODUCTION cloud-browser TU compiles clean
              # with iters 1-6 (pcf.o + cb_audio_device_module.o +
              # worker_main.o all F CXX, cb_dc_host.o no-error). The only
              # build #23 errors were in cloud_browser_pcf_test.cc
              # (dynamic_cast/-frtti + TestAudioDeviceModule rename) — a
              # unittest TU orthogonal to M-stack structural validation.
              # Operator accepts loss of test-coverage signal (unittests
              # validate separately later, tracked IMPROVE). Worker-only
              # = zero error sources + ~20-30% faster build.
              value: "cloud-browser/capture/build-integration:cloud_browser_worker headless:resource_pack_data headless:resource_pack_strings"
            - name: NINJA_PARALLELISM
              # Build-czar 2026-05-17 (opt C): 36 -> 56. T7 is 64-core;
              # 36 was conservative. 56 leaves ~8 cores for OS + I/O +
              # sccache-S3 client. ~25% off the ninja phase.
              value: "56"
            - name: SKIP_FETCH
              # "1" — triform-7 tree verified warm 2026-06-10
              # (buildtools/linux64/gn + third_party/llvm-build both
              # present; the build #6 v3 git-clean damage was healed by
              # that build's full sync). Step 3's branch-heads reset
              # (cd429b1) self-heals patch state without a re-fetch.
              value: "1"
            - name: STUB_MODE
              value: ""
            - name: SKIP_CDP_VALIDATION
              # "1" — build container image is debian:bookworm-slim
              # which has no kubectl. STEP 10's `kubectl apply -f` of
              # the CDP validation manifest fails with exit 127.
              # Observed on build #1 + build #3 (2026-05-17) — each
              # consumed all 3 backoffLimit attempts at STEP 10 even
              # though the binary was already built + packaged +
              # staged at STEPS 6-9. SKIP_CDP_VALIDATION=1 lets the
              # binary ship; CDP validation runs separately from a
              # workspace pod that does have kubectl.
              value: "1"
            - name: SCCACHE_IDLE_TIMEOUT
              value: "0"
            - name: SCCACHE_CACHE_SIZE
              value: "80G"
            - name: CHROMELESS_BUILD_PROFILE
              value: "x264"
          resources:
            requests:
              # Burstable QoS — see build-job.yaml header. 12 → 4
              # (2026-06-10): triform-7 reservation pressure hit 90%
              # (43.5/48 requested; cargoless shards + isolation
              # builders + longhorn IM) while ACTUAL usage was ~3
              # cores. 12 → OutOfcpu ×3 = instant BackoffLimitExceeded.
              # Same fix as triform-8's 2026-05-17 incident: shrink the
              # request so the pod schedules; the 40-CPU limit keeps
              # autoninja's real compute envelope unchanged.
              cpu: "4"
              memory: "96Gi"
              # Explicit ephemeral REQUEST decoupled from the 8Gi limit
              # (2026-07-02, same class as chromeless-kaniko-push.yaml's
              # 2026-06-29 fix). A limit with no request makes K8s mirror
              # an implicit 8Gi request; triform-7 is ~99% ephemeral-
              # RESERVED (87.1Gi requested / 88Gi allocatable = 0.92Gi
              # headroom) so anything ≥1Gi fails admission with
              # OutOfephemeral-storage. All heavy I/O (chromium tree,
              # out/, sccache, artifacts) lives on the /work hostPath —
              # container-ephemeral use is just apt scratch + logs, and
              # the 8Gi LIMIT still governs burst. 512Mi is purely the
              # schedulability floor.
              ephemeral-storage: "512Mi"
            limits:
              cpu: "40"
              memory: "192Gi"
              ephemeral-storage: "8Gi"
          volumeMounts:
            - name: workdir
              mountPath: /work
            - name: workspace
              mountPath: /workspace
              readOnly: true
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        # /var/lib/longhorn/chromeless-build/ on triform-7 is a fresh
        # tree (cold gclient sync on first run, ~50-90min). Once
        # warm, subsequent runs reuse depot_tools + sccache exactly
        # like triform-8's twin. The two trees are intentionally
        # separate per node — no cross-node hostPath sharing.
        - name: workdir
          hostPath:
            path: /var/lib/longhorn/chromeless-build/chromium-src
            type: DirectoryOrCreate
        # sccache hostPath removed — replaced by shared Hetzner S3
        # backend (SCCACHE_BUCKET=triform-cv2-sccache). The hostPath
        # never shared TUs cross-pod (pod-instance hash); S3 does.
        - name: workspace
          emptyDir:
            sizeLimit: 1Gi
