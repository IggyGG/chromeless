# build-job-x264-t7.yaml — Chromium build Job, x264 profile, triform-7 lane.
#
# Parallel build environment on triform-7 — twin of triform-8's
# build-job-x264.yaml, separate hostPath state for true cross-node
# parallelism. The two Jobs are intentionally independent: each has its
# own /var/lib/longhorn/chromeless-build tree on its own node, so they
# can build different chromeless branches (or the same branch with
# different patches/gn args) at the same time without contending for
# the same gclient checkout, sccache, or LTO linker pool.
#
# Why triform-7: at rehome time triform-7 was sitting at ~3% CPU /
# ~6% memory utilization with 826.9G free on /var/lib/longhorn —
# the same shape as triform-8's Longhorn data dir, confirmed by node
# probe (sdh 500G + vg-storage/lv-longhorn LVM giving ~983G total).
#
# Sizing matches triform-8: requests cpu 12 / mem 96Gi, limits
# cpu 40 / mem 192Gi, NINJA_PARALLELISM=36. triform-7 has 48 CPU
# (same as triform-8) so the same envelope fits.
#
# See build-job-x264.yaml for the bbolt/containerd background on why
# the build uses debian:bookworm-slim with an inline depot_tools
# bootstrap instead of the chromeless-build-runner image. The two Jobs
# share that bootstrap logic verbatim — only node, hostPath ownership
# (per-node), and labels differ.

apiVersion: batch/v1
kind: Job
metadata:
  name: chromeless-build-x264-t7
  namespace: chromeless-build
  labels:
    app.kubernetes.io/name: chromeless
    app.kubernetes.io/component: build
    app.kubernetes.io/variant: x264-t7
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 28800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromeless
        app.kubernetes.io/component: build
        app.kubernetes.io/variant: x264-t7
    spec:
      restartPolicy: OnFailure
      # Pinned to triform-7 — second build lane. The twin Job
      # build-job-x264.yaml lives on triform-8. Each node has its
      # own /var/lib/longhorn/chromeless-build hostPath state, so
      # the two Jobs do not share gclient/sccache and can run
      # concurrently against different refs.
      nodeName: triform-7
      nodeSelector:
        kubernetes.io/hostname: triform-7
      imagePullSecrets:
        - name: registry-pull
      initContainers:
        - name: bootstrap-our-repo
          image: debian:bookworm-slim
          command:
            - bash
            - -euxc
            - |
              # ---- Phase 1: install OS deps ----------------------
              # Mirrors Dockerfile.build-runner's apt-install set so the
              # main container can rely on the same baseline.
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git python3 python3-pip \
                build-essential pkg-config sudo lsb-release file \
                xz-utils zstd rsync findutils libglib2.0-0 gperf \
                bison flex

              # ---- Phase 2: clone chromeless to /workspace --------
              AUTH_REPO="https://${FORGEJO_USERNAME}:${FORGEJO_PASSWORD}@${OUR_REPO#https://}"
              if [ ! -d /workspace/.git ]; then
                git clone --depth 1 --branch "${OUR_REPO_REF}" \
                  "${AUTH_REPO}" /workspace
                git -C /workspace remote set-url origin "${OUR_REPO}"
              else
                cd /workspace \
                  && git fetch --depth 1 origin "${OUR_REPO_REF}" \
                  && git reset --hard FETCH_HEAD
              fi
              [ -x /workspace/build/chromeless-build.sh ] || {
                echo "ERROR: /workspace/build/chromeless-build.sh missing"; exit 1; }

              # ---- Phase 3: depot_tools (idempotent) -------------
              if [ ! -x /work/depot_tools/gn ] && [ ! -d /work/depot_tools/.git ]; then
                git clone --depth 200 \
                  https://chromium.googlesource.com/chromium/tools/depot_tools.git \
                  /work/depot_tools
              else
                cd /work/depot_tools && git pull --ff-only || true
              fi

              # ---- Phase 4: sccache (idempotent) -----------------
              SCCACHE_VERSION=v0.8.2
              if [ ! -x /work/depot_tools-bin/sccache ]; then
                mkdir -p /work/depot_tools-bin
                curl -fSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
                  -o /tmp/sccache.tar.gz
                tar -xzf /tmp/sccache.tar.gz -C /tmp
                install -m 0755 \
                  "/tmp/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache" \
                  /work/depot_tools-bin/sccache
                rm -rf /tmp/sccache.tar.gz "/tmp/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl"
              fi

              # ---- Phase 5: workdirs -----------------------------
              mkdir -p /work/src/chromium /work/artifacts /work/logs
              # chown /work/src/chromium too (the empty subdir, without -R) so
              # chromeless-build.sh Step 1 can write .gclient inside it as uid
              # 1000. -R is deliberately avoided on the chromium tree because
              # it updates ctime on every .git file, breaking subsequent
              # git apply --3way --check (rejects with 'does not match index'
              # even though blob hashes are identical).
              chown 1000:1000 /work/src /work/src/chromium /work/artifacts /work/logs
              chown -R 1000:1000 /work/depot_tools /work/depot_tools-bin

              # ---- Phase 6: x264 staging (idempotent) ------------
              if [ ! -e /work/system-libs/include/x264.h ]; then
                apt-get install -y --no-install-recommends libx264-dev
                mkdir -p /work/system-libs/include /work/system-libs/lib
                cp -a  /usr/include/x264.h         /work/system-libs/include/
                cp -a  /usr/include/x264_config.h  /work/system-libs/include/
                cp -aP /usr/lib/x86_64-linux-gnu/libx264.so* /work/system-libs/lib/
                chown -R 1000:1000 /work/system-libs
                ls -la /work/system-libs/include /work/system-libs/lib
              fi
          env:
            - name: OUR_REPO
              value: "https://forgejo.triform.dev/triform/chromeless.git"
            - name: OUR_REPO_REF
              # MUST stay in sync with the build container's
              # OUR_REPO_REF below. The init container clones this ref
              # into /workspace; the build container executes
              # /workspace/build/chromeless-build.sh from THAT ref's
              # snapshot. Mismatch silently runs an old script — bit us
              # 2026-05-17: init=main + build=cv2/m2 meant the
              # SKIP_CDP_VALIDATION fix on cv2/m2's script never ran
              # because /workspace had main's older script. Build #5
              # attempts 1 + 2 both hit STEP 10 exit 127.
              # 2026-07-08 (#116): re-pinned cv2/idle-refresh-capturer →
              # main. main ⊇ cv2/idle-refresh-capturer (main is 8 commits
              # ahead, idle-refresh fully contained via PR #37 merge) AND
              # adds the capture-rearm fix b3359fb (FrameSink self-heal
              # across cross-doc nav RVH swap — the cold-boot frozen-video
              # root cause). Build script is byte-identical between refs.
              value: "main"
            - name: FORGEJO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: forgejo-credentials
                  key: username
            - name: FORGEJO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-credentials
                  key: password
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # CHOWN/FOWNER/DAC_OVERRIDE: workdir setup
              # SETUID/SETGID: apt drops to _apt user during fetch
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]
          volumeMounts:
            - name: workdir
              mountPath: /work
            - name: workspace
              mountPath: /workspace
      containers:
        - name: build
          image: debian:bookworm-slim
          imagePullPolicy: IfNotPresent
          # See build-job-x264.yaml header — same root→builder
          # ownership scheme is reproduced here unchanged.
          command:
            - bash
            - -c
            - |
              set -euxo pipefail

              # ---- OS deps (root) --------------------------------
              # Same set as the bootstrap initContainer. apt is
              # package-deduped so this re-pulls only what isn't in
              # the deb cache; cost ~30s warm, ~60s cold.
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git python3 python3-pip \
                build-essential pkg-config lsb-release file \
                xz-utils zstd rsync findutils libglib2.0-0 gperf \
                bison flex \
                libx11-6 libxext6 libxrandr2 libxcomposite1 libxdamage1 \
                libxfixes3 libxi6 libxtst6 libxcb1 libxkbcommon0 \
                libnss3 libnspr4 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
                libcups2 libdrm2 libgbm1 libpango-1.0-0 libcairo2 \
                libasound2 libatspi2.0-0 \
                libpulse0 pulseaudio pulseaudio-utils

              # ^ RUNTIME libs, not build deps — needed only by STEP 7.
              #
              # This whole block used to end at `bison flex`, which was enough
              # to COMPILE everything. It was not enough to RUN the tests, and
              # nobody noticed because for ~10 weeks STEP 7 ran two binaries
              # that happen not to touch X:
              #
              #   cloud_browser_adm_unittests: error while loading shared
              #   libraries: libX11.so.6: cannot open shared object file
              #
              # The ADM test links the real libwebrtc Linux audio device
              # module, which drags in the X client libs. It exits 127 before
              # main(), so it reports as "unit tests failed" while having run
              # zero tests — a failure mode that looks like a code defect and
              # isn't.
              #
              # The rest of the list is the standard Chromium headless runtime
              # set. Only libX11 is required today; the others are here because
              # the next test target that links more of the browser will need
              # them, and discovering that costs a 12-minute build each time.
              #
              # pulseaudio + libpulse0 are the SECOND layer of the same gap.
              # With libX11 present the ADM test finally started, and then:
              #
              #   Can't load libpulse.so.0 : cannot open shared object file
              #   failed to initialize PulseAudio
              #   M55-R2-VERDICT: {"verdict":"FAIL","reason":"...returned
              #     nullptr — likely patches/0003 audio_device_impl widening"}
              #
              # That reason string is WRONG in this environment, and that is
              # the point of installing these. cb_audio_device_module_test.cc
              # is a deliberate RED-first test with an escalation table
              # keyed on WHICH failure it sees — nullptr means one thing,
              # RecordingDevices()==0 means another. Without libpulse it
              # always reports the first, so the table cannot discriminate
              # and the verdict is unusable as evidence either way.
              #
              # The runtime image (build/Dockerfile.runtime) already ships
              # pulseaudio and runs it under supervisord; this test was
              # written for that environment. Matching it here is what makes
              # the RED verdict mean what the table says it means.

              # ---- builder user ---------------------------------
              if ! id builder >/dev/null 2>&1; then
                useradd -m -u 1000 -s /bin/bash builder
              fi
              mkdir -p /home/builder/.cache
              chown -R 1000:1000 /home/builder

              # ---- drop to builder + exec the build --------------
              # PulseAudio is started INSIDE the su, as `builder`: the daemon
              # refuses to run as root ("Refusing to run as root") unless
              # --system is used, and a system daemon is a different (worse)
              # shape here. It also has to be the same uid that later runs
              # STEP 7, since the client finds the server through
              # /run/user/$UID or $HOME/.config/pulse.
              #
              # Best-effort by design: if it doesn't come up, the ADM test
              # still runs and still reports RED — just with the pre-existing
              # nullptr ambiguity instead of a discriminating verdict. A
              # missing audio daemon must not fail a compile lane.
              su builder -c '
                set -euxo pipefail
                export PATH=/work/depot_tools:/work/depot_tools-bin:/usr/local/bin:/usr/bin:/bin
                export DEPOT_TOOLS_UPDATE=0
                export HOME=/home/builder
                pulseaudio --start --exit-idle-time=-1 >/dev/null 2>&1 \
                  || echo "WARN: pulseaudio did not start; ADM verdict stays ambiguous"
                (cd /work/depot_tools && source ./bootstrap_python3 && bootstrap_python3) 2>&1 | tail -3 || true
                exec bash /workspace/build/chromeless-build.sh
              '
          env:
            - name: OUR_REPO
              value: "https://forgejo.triform.dev/triform/chromeless.git"
            - name: OUR_REPO_REF
              # main (2026-07-08, #116): the deploy lineage — the full
              # cv2/idle-refresh-capturer stack (wave-3 base: ContentClient
              # + pak-scale + compositor drain + retarget; PLUS warm-snapshot
              # Cb.startNativeSession, D18b answer tolerance/buffer,
              # idle-refresh hold-and-repeat, IncrementCapturerCount
              # capture-keepalive, dcheck_always_on=false, CB_UA_RESOURCE
              # renderer resource-path probe) merged to main via PR #37,
              # PLUS the capture-rearm fix b3359fb (FrameSink self-heal
              # across cross-doc nav RVH swap). main ⊇ idle-refresh
              # (8 ahead, 0 behind). MUST stay in sync with the init
              # container's OUR_REPO_REF above. Provenance gate: built
              # binary MUST contain "no track-source getter" and MUST NOT
              # contain "no video track source".
              value: "main"
            - name: CHROMIUM_BRANCH_NUMBER
              value: "7727"
            - name: CHROMELESS_REPO
              value: "/workspace"
            - name: CHROMELESS_WORK_ROOT
              value: "/work"
            # ---- sccache S3 backend (Hetzner Object Storage) ----
            # Replaces the per-node hostPath /sccache. The hostPath
            # could never share TUs across pods because sccache's
            # compiler-input hash folds in pod-instance identity
            # (PATH/env/wrapper) — confirmed cold across Builds #15-#23.
            # A shared S3 bucket keyed by the real compiler-input hash
            # gives true cross-pod / cross-node cache reuse.
            - name: SCCACHE_BUCKET
              value: "triform-cv2-sccache"
            - name: SCCACHE_ENDPOINT
              value: "https://hel1.your-objectstorage.com"
            - name: SCCACHE_REGION
              value: "auto"
            - name: SCCACHE_S3_USE_SSL
              value: "true"
            - name: SCCACHE_S3_KEY_PREFIX
              value: "cv2/sccache/"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: sccache-s3-creds
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sccache-s3-creds
                  key: AWS_SECRET_ACCESS_KEY
            - name: CHROMELESS_BUILD_TARGETS
              # 2026-07-30: unittest targets RESTORED (encoder + framesink),
              # reverting build-czar 2026-05-17 opt B (worker-only). Opt B
              # was a build-#23-era mitigation for compile errors in
              # cloud_browser_pcf_test.cc; those test TUs were since
              # repaired (BUILD.gn Wall #37 test_support work) and every
              # OTHER lane (x264/t2/nvenc/vaapi) kept building them. The
              # forcing event: main's chromeless-build.sh STEP 7 now FAILS
              # (not warns) when the test binaries are missing — the
              # silent-skip was exactly the "unverified C++" class the OSS
              # verify-loop work closed, and this lane had been skipping
              # tests for 10 weeks under a WARN nobody read. First fatal
              # catch: 2026-07-30 build of main (worker compiled clean in
              # 11m15s, STEP 7 exit 127 on both binaries).
              # t2's extra pcf_unittests target stays t2-only for now.
              #
              # 2026-07-30 (same day, second pass): + cb_wire_envelope_unittests.
              # Restoring encoder+framesink above fixed the SILENT-SKIP, but I
              # only restored the two targets the old value had named. The tree
              # actually declares SEVEN test() targets:
              #
              #   cb_env_config_unittests             <- config surface
              #   cb_wire_envelope_unittests          <- signaling codec
              #   cloud_browser_adm_unittests
              #   cloud_browser_encoder_unittests     built here
              #   cloud_browser_framesink_capturer_unittests   built here
              #   cloud_browser_input_dispatch_unittests
              #   cloud_browser_pcf_unittests         (t2-only, deliberate)
              #   cloud_browser_pointer_state_unittests
              #
              # So the wire-envelope tests — including the negative test whose
              # own comment says it exists "so a maintainer has to argue the
              # contract change explicitly" — have never executed in this lane.
              # A test that cannot run is documentation, and it was being cited
              # as a guarantee. Found while verifying the portal-dialect decode
              # change: the new assertions compiled and were never exercised.
              #
              # Adding the signaling one here because that is the contract this
              # repo publishes to third parties. The remaining three (adm,
              # input_dispatch, pointer_state) are a separate question — they
              # may have bitrotted over the 10 weeks nothing built them, and
              # finding that out belongs in its own change rather than riding
              # along with a codec fix.
              value: "cloud-browser/capture/build-integration:cloud_browser_worker headless:resource_pack_data headless:resource_pack_strings cloud-browser/capture/build-integration:cloud_browser_encoder_unittests cloud-browser/capture/build-integration:cloud_browser_framesink_capturer_unittests cloud-browser/capture/signaling:cb_wire_envelope_unittests cloud-browser/capture/build-integration:cloud_browser_adm_unittests cloud-browser/capture/build-integration:cloud_browser_input_dispatch_unittests cloud-browser/capture/build-integration:cloud_browser_pointer_state_unittests cloud-browser/capture/config:cb_env_config_unittests"
            - name: CHROMELESS_TESTS_SKIP_RUN
              # BUILT here, but not EXECUTED here. See STEP 7 in
              # build/chromeless-build.sh for the mechanism and its guards.
              #
              # cloud_browser_adm_unittests drives the REAL libwebrtc Pulse
              # backend: it needs a live audio server with an actual capture
              # source. This is a compile pod. Even with pulseaudio installed
              # and running, there is no sound card and no monitor source, so
              # InitRecording() returns -1 and the test is RED for a reason
              # that says nothing about the code.
              #
              # It is an integration test wearing a unit test's clothes. The
              # runtime image (build/Dockerfile.runtime) already runs
              # pulseaudio under supervisord — that is where it can produce a
              # verdict that means something.
              #
              # It is still BUILT here, deliberately. Compiling it is what
              # found two real defects on 2026-07-30 (CbAudioTestRecorder was
              # abstract; the test passthrough was missing link-time
              # webrtc_overrides deps), and the ~10-week gap this whole
              # mechanism came from was "declared but never compiled". Not
              # running it costs nothing that compiling it buys.
              value: "cloud_browser_adm_unittests"
            - name: CHROMELESS_TESTS_SKIP_RUN_REASON
              value: "needs a live PulseAudio server with a capture source; compile pod has none. Runs in the runtime image (M5.5). Still compiled+linked here."
            - name: NINJA_PARALLELISM
              # Build-czar 2026-05-17 (opt C): 36 -> 56. T7 is 64-core;
              # 36 was conservative. 56 leaves ~8 cores for OS + I/O +
              # sccache-S3 client. ~25% off the ninja phase.
              value: "56"
            - name: SKIP_FETCH
              # "1" — triform-7 tree verified warm 2026-06-10
              # (buildtools/linux64/gn + third_party/llvm-build both
              # present; the build #6 v3 git-clean damage was healed by
              # that build's full sync). Step 3's branch-heads reset
              # (cd429b1) self-heals patch state without a re-fetch.
              value: "1"
            - name: STUB_MODE
              value: ""
            - name: SKIP_CDP_VALIDATION
              # "1" — build container image is debian:bookworm-slim
              # which has no kubectl. STEP 10's `kubectl apply -f` of
              # the CDP validation manifest fails with exit 127.
              # Observed on build #1 + build #3 (2026-05-17) — each
              # consumed all 3 backoffLimit attempts at STEP 10 even
              # though the binary was already built + packaged +
              # staged at STEPS 6-9. SKIP_CDP_VALIDATION=1 lets the
              # binary ship; CDP validation runs separately from a
              # workspace pod that does have kubectl.
              value: "1"
            - name: SCCACHE_IDLE_TIMEOUT
              value: "0"
            - name: SCCACHE_CACHE_SIZE
              value: "80G"
            - name: CHROMELESS_BUILD_PROFILE
              value: "x264"
          resources:
            requests:
              # Burstable QoS — see build-job.yaml header. 12 → 4
              # (2026-06-10): triform-7 reservation pressure hit 90%
              # (43.5/48 requested; cargoless shards + isolation
              # builders + longhorn IM) while ACTUAL usage was ~3
              # cores. 12 → OutOfcpu ×3 = instant BackoffLimitExceeded.
              # Same fix as triform-8's 2026-05-17 incident: shrink the
              # request so the pod schedules; the 40-CPU limit keeps
              # autoninja's real compute envelope unchanged.
              #
              # 4 → 2 (2026-08-14): the identical failure, third time. The
              # node has crept 90% → 95% requested (45.9/48), leaving 2.29
              # cores — so a 4-core request is OutOfcpu ×3 and the Job dies
              # before the init container runs.
              #
              # The node is NOT busy. Measured at the time of this change:
              # 15.5 of 48 cores in ACTUAL use (32%), with ~32 cores
              # reserved-but-idle. The top reservations were
              # triform-builder/builder-fsn-build-v2-0 (10 cores reserved,
              # 14m used — an idle dind CI builder holding burst capacity)
              # and longhorn's instance-manager (5.8 reserved, 229m used).
              # Both are other teams' live services doing exactly what they
              # should; the mismatch is between reservations and reality
              # across the whole node, and this Job cannot fix that.
              #
              # What matters: the LIMIT is still 40 CPU, so the build's real
              # compute envelope is untouched — NINJA_PARALLELISM=36 still
              # gets its cores from the 32 that are genuinely idle. The
              # request is only the scheduler's reservation, and on a node
              # this over-reserved a smaller one is strictly more honest
              # about what this Job actually consumes at rest (~1 core
              # during gclient sync, bursting during compile).
              #
              # If this needs lowering a FOURTH time, that is the signal to
              # stop shaving and address the node's reservation hygiene
              # instead — a right-sized builder-fsn-build-v2 alone would
              # return ~10 cores of schedulable headroom.
              cpu: "2"
              memory: "96Gi"
              # Explicit ephemeral REQUEST decoupled from the 8Gi limit
              # (2026-07-02, same class as chromeless-kaniko-push.yaml's
              # 2026-06-29 fix). A limit with no request makes K8s mirror
              # an implicit 8Gi request; triform-7 is ~99% ephemeral-
              # RESERVED (87.1Gi requested / 88Gi allocatable = 0.92Gi
              # headroom) so anything ≥1Gi fails admission with
              # OutOfephemeral-storage. All heavy I/O (chromium tree,
              # out/, sccache, artifacts) lives on the /work hostPath —
              # container-ephemeral use is just apt scratch + logs, and
              # the 8Gi LIMIT still governs burst. 512Mi is purely the
              # schedulability floor.
              ephemeral-storage: "512Mi"
            limits:
              cpu: "40"
              memory: "192Gi"
              ephemeral-storage: "8Gi"
          volumeMounts:
            - name: workdir
              mountPath: /work
            - name: workspace
              mountPath: /workspace
              readOnly: true
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        # /var/lib/longhorn/chromeless-build/ on triform-7 is a fresh
        # tree (cold gclient sync on first run, ~50-90min). Once
        # warm, subsequent runs reuse depot_tools + sccache exactly
        # like triform-8's twin. The two trees are intentionally
        # separate per node — no cross-node hostPath sharing.
        - name: workdir
          hostPath:
            path: /var/lib/longhorn/chromeless-build/chromium-src
            type: DirectoryOrCreate
        # sccache hostPath removed — replaced by shared Hetzner S3
        # backend (SCCACHE_BUCKET=triform-cv2-sccache). The hostPath
        # never shared TUs cross-pod (pod-instance hash); S3 does.
        - name: workspace
          emptyDir:
            sizeLimit: 1Gi
