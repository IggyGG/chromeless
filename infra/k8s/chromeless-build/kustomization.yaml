# kustomization.yaml — `kubectl apply -k` entry point for the
# Chromium build env on triform-8 (T112 + T119 + CV2-rehome).
#
# T119 dropped the PVC manifests after openebs-localpv-provisioner
# stopped binding new claims on the cluster. Volumes now live as
# hostPath dirs on triform-8's /var/lib/longhorn LVM (~983G capacity,
# co-tenanting with Longhorn's data pool). See build-job.yaml's header
# for the full rationale and README.md for the workaround story +
# cleanup procedure.
#
# Apply order:
#   1. namespace.yaml — creates chromeless-build ns
#   2. build-job.yaml — Job that runs the build
#
# cleanup-job.yaml is NOT in the default resources list — it's a
# manually-applied "wipe and restart" Job (`kubectl apply -f
# cleanup-job.yaml`). Including it here would run it on every
# `kubectl apply -k`, which is the opposite of what we want.
#
# The Dockerfile.build-runner is intentionally NOT a resource here —
# it's an image-build artifact, not a K8s object. See README.md for
# the build + push step.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chromeless-build

resources:
  - namespace.yaml
  - build-job.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: chromeless
      app.kubernetes.io/part-of: chromeless
      app.kubernetes.io/component: build
