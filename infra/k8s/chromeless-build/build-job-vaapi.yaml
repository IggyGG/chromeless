# build-job-vaapi.yaml — Chromium build Job, vaapi profile (Track F2).
#
# This variant uses debian:bookworm-slim as the base image with an
# inline depot_tools install, instead of the chromeless-build-runner image —
# same fallback path Track F1 (build-job-x264.yaml) took. See that
# file's header for the full rationale (triform-2 containerd
# orphan-in-DB metadata; once the bbolt repair clears, this can be
# reverted to the chromeless-build-runner-based template).
#
# Profile selector: CHROMELESS_BUILD_PROFILE=vaapi in the main env.
# chromeless-build.sh step 3.5 verifies /work/system-libs has the staged libva
# headers + lib; build.sh:cmd_gen imports args.vaapi.gn instead of
# args.gn.
#
# Bootstrap diff vs. the x264 variant: phase 6 apt-installs
# `libva-dev` + `libva-drm-dev` and stages the va/*.h headers + the
# shared libs (libva.so* libva-drm.so*) into /work/system-libs.
# Idempotent on /work/system-libs/include/va/va.h.

apiVersion: batch/v1
kind: Job
metadata:
  name: chromeless-build-vaapi
  namespace: chromeless-build
  labels:
    app.kubernetes.io/name: chromeless
    app.kubernetes.io/component: build
    app.kubernetes.io/variant: vaapi
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 28800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromeless
        app.kubernetes.io/component: build
        app.kubernetes.io/variant: vaapi
    spec:
      restartPolicy: OnFailure
      # Re-homed to triform-8 alongside the default build-job.yaml
      # (CV2-rehome). Build state lives on /var/lib/longhorn,
      # co-tenanting with Longhorn's pool; see build-job.yaml header
      # for the full reasoning.
      nodeName: triform-8
      nodeSelector:
        kubernetes.io/hostname: triform-8
      imagePullSecrets:
        - name: registry-pull
      initContainers:
        - name: bootstrap-our-repo
          image: debian:bookworm-slim
          command:
            - bash
            - -euxc
            - |
              # ---- Phase 1: install OS deps ----------------------
              # Mirrors Dockerfile.build-runner's apt-install set so the
              # main container can rely on the same baseline.
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git python3 python3-pip \
                build-essential pkg-config sudo lsb-release file \
                xz-utils zstd rsync findutils libglib2.0-0 gperf \
                bison flex

              # ---- Phase 2: clone chromeless to /workspace --------
              AUTH_REPO="https://${FORGEJO_USERNAME}:${FORGEJO_PASSWORD}@${OUR_REPO#https://}"
              if [ ! -d /workspace/.git ]; then
                git clone --depth 1 --branch "${OUR_REPO_REF}" \
                  "${AUTH_REPO}" /workspace
                git -C /workspace remote set-url origin "${OUR_REPO}"
              else
                cd /workspace \
                  && git fetch --depth 1 origin "${OUR_REPO_REF}" \
                  && git reset --hard FETCH_HEAD
              fi
              [ -x /workspace/build/chromeless-build.sh ] || {
                echo "ERROR: /workspace/build/chromeless-build.sh missing"; exit 1; }

              # ---- Phase 3: depot_tools (idempotent) -------------
              if [ ! -x /work/depot_tools/gn ] && [ ! -d /work/depot_tools/.git ]; then
                git clone --depth 200 \
                  https://chromium.googlesource.com/chromium/tools/depot_tools.git \
                  /work/depot_tools
              else
                cd /work/depot_tools && git pull --ff-only || true
              fi

              # ---- Phase 4: sccache (idempotent) -----------------
              SCCACHE_VERSION=v0.8.2
              if [ ! -x /work/depot_tools-bin/sccache ]; then
                mkdir -p /work/depot_tools-bin
                curl -fSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
                  -o /tmp/sccache.tar.gz
                tar -xzf /tmp/sccache.tar.gz -C /tmp
                install -m 0755 \
                  "/tmp/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache" \
                  /work/depot_tools-bin/sccache
                rm -rf /tmp/sccache.tar.gz "/tmp/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl"
              fi

              # ---- Phase 5: workdirs -----------------------------
              mkdir -p /work/src/chromium /work/artifacts /work/logs
              # See build-job-x264.yaml for the rationale on chowning the
              # empty /work/src/chromium subdir explicitly (and never -R
              # the chromium tree once populated).
              chown 1000:1000 /work/src /work/src/chromium /work/artifacts /work/logs
              chown -R 1000:1000 /work/depot_tools /work/depot_tools-bin

              # ---- Phase 6: libva staging (idempotent) -----------
              # On Debian bookworm libva-dev is a single package that
              # provides all the va_*.h headers (including va_drm.h +
              # the va_enc_*.h encoder headers the source includes) and
              # the .so symlinks for libva, libva-drm, libva-glx,
              # libva-wayland, libva-x11. apt pulls libva2 + libva-drm2
              # transitively for the runtime libs. There is no separate
              # libva-drm-dev package on Debian — that name is Ubuntu-
              # only and breaks the apt-get install with a "Unable to
              # locate package" exit-code-100 (cost us one bootstrap run).
              #
              # We stage only the libs config(":vaapi") in BUILD.gn
              # actually links: `va` (libva.so) + `va-drm` (libva-drm.so).
              # The headless worker has no X11 surface, so libva-x11 /
              # libva-glx / libva-wayland are skipped.
              if [ ! -e /work/system-libs/include/va/va.h ]; then
                apt-get install -y --no-install-recommends libva-dev
                mkdir -p /work/system-libs/include/va /work/system-libs/lib
                cp -a /usr/include/va/. /work/system-libs/include/va/
                cp -aP /usr/lib/x86_64-linux-gnu/libva.so*       /work/system-libs/lib/
                cp -aP /usr/lib/x86_64-linux-gnu/libva-drm.so*   /work/system-libs/lib/
                chown -R 1000:1000 /work/system-libs
                ls -la /work/system-libs/include/va /work/system-libs/lib
              fi
          env:
            - name: OUR_REPO
              value: "https://forgejo.triform.dev/triform/chromeless.git"
            - name: OUR_REPO_REF
              value: "main"
            - name: FORGEJO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: forgejo-credentials
                  key: username
            - name: FORGEJO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-credentials
                  key: password
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # CHOWN/FOWNER/DAC_OVERRIDE: workdir setup
              # SETUID/SETGID: apt drops to _apt user during fetch
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]
          volumeMounts:
            - name: workdir
              mountPath: /work
            - name: sccache
              mountPath: /sccache
            - name: workspace
              mountPath: /workspace
      containers:
        - name: build
          image: debian:bookworm-slim
          imagePullPolicy: IfNotPresent
          # Runs as root — debian:bookworm-slim doesn't ship a builder
          # user, and apt-get install (needed for the OS deps the build
          # uses) requires root. We create a uid-1000 builder user
          # inline, install OS deps as root, then drop to builder for
          # the chromium compile. The chromium-src hostPath has been
          # owned 1000:1000 since the chromeless-build-runner runs, so the
          # ownership scheme is preserved across both build paths
          # (this debian-based fallback and the original
          # chromeless-build-runner once its broken chain clears).
          command:
            - bash
            - -c
            - |
              set -euxo pipefail

              # ---- OS deps (root) --------------------------------
              # Same set as the bootstrap initContainer. apt is
              # package-deduped so this re-pulls only what isn't in
              # the deb cache; cost ~30s warm, ~60s cold.
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git python3 python3-pip \
                build-essential pkg-config lsb-release file \
                xz-utils zstd rsync findutils libglib2.0-0 gperf \
                bison flex

              # ---- builder user ---------------------------------
              # chromeless-build-runner's image creates this at build time;
              # we do it at runtime since debian:bookworm-slim is bare.
              # Idempotent: -m creates /home/builder, useradd skips on
              # existing user.
              if ! id builder >/dev/null 2>&1; then
                useradd -m -u 1000 -s /bin/bash builder
              fi
              # /home/builder/.cache is where depot_tools puts gclient
              # state and various tool caches. Pre-create + own it.
              mkdir -p /home/builder/.cache
              chown -R 1000:1000 /home/builder

              # ---- drop to builder + exec the build --------------
              # depot_tools and sccache come from /work (hostPath,
              # populated by the bootstrap initContainer).
              # bootstrap_python3 must run once per pod start (the
              # marker file is in depot_tools/.cipd_bin which we
              # didn't bake — runs idempotently if marker exists).
              su builder -c '
                set -euxo pipefail
                export PATH=/work/depot_tools:/work/depot_tools-bin:/usr/local/bin:/usr/bin:/bin
                export DEPOT_TOOLS_UPDATE=0
                export HOME=/home/builder
                (cd /work/depot_tools && source ./bootstrap_python3 && bootstrap_python3) 2>&1 | tail -3 || true
                exec bash /workspace/build/chromeless-build.sh
              '
          env:
            - name: OUR_REPO
              value: "https://forgejo.triform.dev/triform/chromeless.git"
            - name: OUR_REPO_REF
              value: "main"
            - name: CHROMIUM_BRANCH_NUMBER
              value: "7727"
            - name: CHROMELESS_REPO
              value: "/workspace"
            - name: CHROMELESS_WORK_ROOT
              value: "/work"
            - name: SCCACHE_DIR
              value: "/sccache"
            - name: CHROMELESS_BUILD_TARGETS
              value: "cloud-browser/capture/build-integration:cloud_browser_worker headless:resource_pack_data headless:resource_pack_strings cloud-browser/capture/build-integration:cloud_browser_encoder_unittests cloud-browser/capture/build-integration:cloud_browser_framesink_capturer_unittests"
            - name: NINJA_PARALLELISM
              # See build-job.yaml header — sized to the 40-CPU limit
              # minus headroom for sccache server + LTO linker.
              value: "36"
            - name: SKIP_FETCH
              # Empty = fresh gclient sync (first build on triform-8
              # has no on-disk tree at /var/lib/longhorn/chromeless-build).
              # Flip to "1" after sync succeeds to skip re-sync on
              # subsequent runs.
              value: ""
            - name: STUB_MODE
              value: ""
            - name: SCCACHE_IDLE_TIMEOUT
              value: "0"
            - name: SCCACHE_CACHE_SIZE
              value: "80G"
            - name: CHROMELESS_BUILD_PROFILE
              value: "vaapi"
          resources:
            requests:
              # Burstable QoS — see build-job.yaml header.
              cpu: "12"
              memory: "96Gi"
              # Explicit ephemeral REQUEST decoupled from the 8Gi limit.
              # A limit with NO request makes K8s mirror an implicit 8Gi
              # request; on a node that is ~92% ephemeral-RESERVED that
              # fails admission instantly (OutOfephemeral-storage) and the
              # Job silently burns retries with no log to read. The t7 lane
              # hit this 2026-07-02, the t8 lane hit it 2026-08-20; these
              # three lanes carried the same defect latent. Measured: this
              # image's writable layer is 522Mi (debian 82Mi + 440Mi apt),
              # and all heavy I/O is on the /work hostPath. 512Mi is the
              # schedulability floor; the 8Gi LIMIT still governs burst.
              ephemeral-storage: "512Mi"
            limits:
              cpu: "40"
              memory: "192Gi"
              ephemeral-storage: "8Gi"
          volumeMounts:
            - name: workdir
              mountPath: /work
            - name: sccache
              mountPath: /sccache
            - name: workspace
              mountPath: /workspace
              readOnly: true
          # Main container runs as root so apt-get install works;
          # the bash command then `useradd builder` (uid 1000) and
          # `su builder -c` for the chromium compile so the in-tree
          # writes inherit 1000:1000 ownership consistent with the
          # chromeless-build-runner-based path.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # SETUID/SETGID for su to drop to builder; CHOWN/FOWNER
              # for the inline /home/builder ownership setup; DAC_OVERRIDE
              # for cross-uid file access during the apt+useradd setup.
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        # Shares /var/lib/longhorn/chromeless-build/ with build-job.yaml
        # (default) — gclient checkout + sccache are warm across variants.
        - name: workdir
          hostPath:
            path: /var/lib/longhorn/chromeless-build/chromium-src
            type: DirectoryOrCreate
        - name: sccache
          hostPath:
            path: /var/lib/longhorn/chromeless-build/sccache
            type: DirectoryOrCreate
        - name: workspace
          emptyDir:
            sizeLimit: 1Gi
