# infra/k8s/observability-jaeger.yaml — Jaeger all-in-one for the
# cloud-browser-webrtc namespace (T99).
#
# Scope: dev / single-cluster Phase-1 deployments. Production runs
# Tempo or Grafana Cloud Traces with a real backend; see
# docs/operations/tracing.md for the swap-out story. The all-in-one
# image bundles agent + collector + storage + query in one process and
# stores spans in memory (lost on restart) — exactly what dev wants.
#
# Per-region: yes, one per region. Trace lookups across regions are
# rare enough that we don't run a global trace aggregator yet (the
# operator drills into a single region's UI in 99% of cases per
# docs/operations/multi-region.md). When that changes, swap to Tempo
# with multi-tenant ingest.
#
# Why a manifest in addition to the Helm chart's templates: the chart
# (infra/helm/cloud-browser-webrtc) keeps observability strictly opt-
# in via a Values toggle. This standalone YAML is the
# `kubectl apply -f` equivalent for clusters that don't run our chart
# (Phase 1 dev k3d / kind clusters, or a quick-and-dirty staging).

apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: cloud-browser-webrtc
  labels:
    app.kubernetes.io/name: cloud-browser-webrtc
    app.kubernetes.io/component: tracing
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloud-browser-webrtc
    app.kubernetes.io/component: tracing
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      appProtocol: grpc
    - name: otlp-http
      port: 4318
      targetPort: 4318
      appProtocol: http
    - name: query-ui
      port: 16686
      targetPort: 16686
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: cloud-browser-webrtc
  labels:
    app.kubernetes.io/name: cloud-browser-webrtc
    app.kubernetes.io/component: tracing
spec:
  replicas: 1
  strategy:
    # In-memory storage means a rolling update would partition spans
    # across two pods until the old one is killed. Recreate keeps the
    # storage view simple at the cost of a brief query gap on rollout.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-browser-webrtc
      app.kubernetes.io/component: tracing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-browser-webrtc
        app.kubernetes.io/component: tracing
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: query-ui
              containerPort: 16686
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: memory
            - name: MEMORY_MAX_TRACES
              value: "50000"
          # Modest CPU; trace volume at v1's sample rate (10%) is tiny.
          # Tighter limits on memory because in-memory storage scales
          # ~linearly with MEMORY_MAX_TRACES.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 30
            periodSeconds: 30
          # T57-aligned baseline. Jaeger doesn't need root and our
          # other workloads ship with these set, so match the cluster
          # PSP / Pod Security baseline.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # /tmp for the badger+memory storage scratch space.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
