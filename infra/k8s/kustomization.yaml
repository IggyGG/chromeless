# infra/k8s/kustomization.yaml — entry point for `kubectl apply -k .`
#
# This is the base; overlays for {dev, staging, prod} land in
# infra/k8s/overlays/<env>/ and patch the bits that vary per cluster
# (Ingress hostname, TLS issuer, replica counts, image tags, the TURN
# secret).

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chromeless

resources:
  - namespace.yaml
  - signaling-deployment.yaml
  - turn-deployment.yaml
  # cloud-browser-session.yaml is the *template* the session
  # controller will use to materialise Pods at runtime. Including it
  # here applies a single example Pod for kubectl-apply testing; in
  # production it lives inside the controller code, not the kustomize
  # bundle.
  - cloud-browser-session.yaml
  # T71: controller Deployment + RBAC. The CRDs live under
  # ../controllers/browser-session-controller/config/crd/ and are
  # NOT pulled in here — kustomize refuses to climb above its root.
  # Install them separately with:
  #   kubectl apply -f infra/controllers/browser-session-controller/config/crd/
  - controller-deployment.yaml
  # T76: TURN credentials issuance daemon (HMAC-REST per RFC 7635).
  - turn-issuer-deployment.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: chromeless
      app.kubernetes.io/part-of: chromeless
