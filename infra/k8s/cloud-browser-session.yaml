# infra/k8s/cloud-browser-session.yaml — Pod spec for one cloud-browser
# session.
#
# T50 Phase 3 prep: this is the *template* the (future) session
# controller will use to materialise individual session Pods. Today it
# is a standalone Pod manifest that's hand-applicable for testing —
# `kubectl apply -f cloud-browser-session.yaml` brings up one session.
#
# A session Pod runs three cooperating containers in a shared network
# and PID namespace (M7 R4 retired input-bridge + cursor-watcher in
# favour of the native peer):
#
#   chromeless         the runtime image; runs Xvfb + PulseAudio +
#                       Chromium under supervisord. DevTools on :9222.
#   chromeless-metrics-sidecar  T38 sidecar exposing /metrics on :9100. Uses
#                       /proc to aggregate Chromium CPU/RSS, hence the
#                       Pod-wide shareProcessNamespace below.
#   clipboard-bridge    T32 sidecar that wires X11 clipboard into the
#                       client via a data channel.
#
# Security knobs:
#   shareProcessNamespace=true        chromeless-metrics-sidecar needs /proc
#                                     visibility into chromium PIDs;
#                                     this widens trust inside the
#                                     pod but the pod is a single
#                                     tenant unit anyway. See T44 for
#                                     the cross-pod story.
#   runtimeClassName: gvisor          (commented; decision deferred to
#                                     Phase 3 per T44's matrix)
#   readOnlyRootFilesystem            on every sidecar where possible.
#                                     chromeless needs writable root
#                                     because chromium spawns helpers
#                                     and writes a profile dir.
#
# Image registry placeholder: we use ghcr.io/iggy/chromeless
# throughout. The actual registry path will land when we publish.
apiVersion: v1
kind: Pod
metadata:
  name: chromeless-session-template
  namespace: chromeless
  labels:
    app.kubernetes.io/name: chromeless
    app.kubernetes.io/component: session
    chromeless.session/state: warm
  annotations:
    # T68: optional CRIU snapshot to restore from at startup. Empty (or
    # unset) means "cold-start the pod normally". The session
    # controller (T50) reads this annotation to decide between
    # cold-start and the snapshot fast path; the value is a
    # content-sha matching a directory under
    # /var/lib/chromeless-snapshots/shared/<sha>/ on the node. See
    # infra/snapshots/README.md for the full design and threat model
    # (especially the "must be tenant-clean" contract).
    chromeless.io/snapshot-id: ""
spec:
  # Phase 3 isolation lever. Uncomment after the runtimeClass is
  # installed cluster-wide. See docs/research/sandbox-isolation.md.
  # runtimeClassName: gvisor

  shareProcessNamespace: true
  restartPolicy: Always

  # T57: pod-level security posture. Every container also sets its own
  # securityContext so a future container addition can't accidentally
  # default itself back to root. fsGroup=1000 makes emptyDir mounts
  # cbuser-writable (group ownership 1000, mode 0775).
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      # Localhost = the kubelet's seccomp dir
      # (/var/lib/kubelet/seccomp/chromeless.json). Deploys must
      # install the JSON on every node before this pod will start.
      # See infra/security-hardening.md "K8s seccomp install".
      type: Localhost
      localhostProfile: chromeless.json

  # Cluster-internal DNS for signaling. Keep clusterFirst so the pod
  # uses the cluster's DNS resolver; Phase-3 prod can layer per-tenant
  # DNS via NetworkPolicy + a sidecar resolver.
  dnsPolicy: ClusterFirst

  # Don't auto-mount the default ServiceAccount token: nothing in this
  # pod talks to the K8s API. The session controller will mint a
  # dedicated, no-permission SA when it starts using the K8s API.
  automountServiceAccountToken: false

  # T57: every writable path under / needs a volume since
  # readOnlyRootFilesystem: true on every container. /run is one
  # emptyDir for everything supervisord/pulse/chromeless-session need;
  # cold-start.sh re-creates the subdirs at startup.
  volumes:
    # /dev/shm: Chromium needs more than the default 64M. emptyDir with
    # medium=Memory backs it with tmpfs at the size we set in compose
    # via shm_size.
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    # /run: supervisord socket + pid, pulse runtime, chromeless-session env.
    # tmpfs-backed so it doesn't burn ephemeral storage budget.
    - name: run
      emptyDir:
        medium: Memory
        sizeLimit: 256Mi
    # /var/log/supervisor: program logs. Bytes-on-disk; small.
    - name: supervisor-log
      emptyDir:
        sizeLimit: 256Mi
    # /home/cbuser: chromium config + profile + caches. Sized for one
    # session's worth of state.
    - name: home
      emptyDir:
        sizeLimit: 512Mi
    # /tmp: Chromium and the streamer write bursty scratch/cache data here;
    # keep this comfortably above the kubelet eviction threshold seen on the
    # static browserless pool while staying inside the pod ephemeral-storage
    # budget.
    - name: tmp
      emptyDir:
        sizeLimit: 1Gi
    # X11 socket dir — Xvfb writes /tmp/.X11-unix/X99. Lives separate
    # from /tmp so we can mount it in containers that need the display
    # without giving them write access to all of /tmp.
    - name: x11-socket
      emptyDir: {}
    # Per-session uploads (T74) — file-bridge writes here, Chromium
    # reads the file paths via DOM.setFileInputFiles. emptyDir so the
    # storage is reclaimed when the pod terminates; sized to 2 × the
    # 100 MiB upload cap to allow at least one concurrent upload plus
    # whatever the user has attached via past uploads.
    - name: chromeless-uploads
      emptyDir:
        sizeLimit: 256Mi
    # T81 — webcam/mic passthrough sockets. The streamer page writes
    # raw I420 / S16LE frames to these Unix domain sockets (paths
    # /run/chromeless-passthrough/{video,audio}.sock); the v4l2-writer
    # follow-up reads from them and pushes into /dev/video10 +
    # PulseAudio. emptyDir is fine because the sockets are
    # re-created each session and never need to outlive the pod.
    #
    # Production deployment relies on the host-DaemonSet shape (see
    # docs/protocols/webcam-mic-passthrough.md "Shape 2") to load
    # v4l2loopback once per node and expose /dev/videoN to this pod
    # via a separate device-claim volume — NOT via emptyDir or
    # privileged: true. The compose-dev shape is documented in
    # infra/compose.yaml and is NOT intended for production.
    - name: chromeless-passthrough-sockets
      emptyDir:
        sizeLimit: 8Mi

  # Pod-level resources are summed across containers; we target ~3 CPU
  # / ~5.5GB mem / 2GB ephemeral storage on the request side. Cluster
  # autoscaling provisions accordingly.
  containers:

    # -------------------------------------------------------------------
    # chromeless — main browser process tree (Xvfb + PulseAudio +
    # streamer-static + Chromium under supervisord).
    # -------------------------------------------------------------------
    - name: chromeless
      image: ghcr.io/iggy/chromeless/chromium:dev
      imagePullPolicy: IfNotPresent
      env:
        - name: SESSION_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SIGNALING_URL
          # cluster-internal Service; see signaling-deployment.yaml
          value: "ws://signaling.chromeless.svc.cluster.local:8080/ws"
        - name: STREAMER_FPS
          value: "30"
        # Disable the watchdog when running under the cluster
        # controller; cluster-side idle handling is the controller's
        # job (see session-controller-design.md). Pod-level watchdog
        # would race the controller.
        - name: IDLE_TIMEOUT_S
          value: "999999"
      ports:
        - name: devtools
          containerPort: 9222
        - name: streamer
          containerPort: 9000
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: run
          mountPath: /run
        - name: supervisor-log
          mountPath: /var/log/supervisor
        - name: home
          mountPath: /home/cbuser
        - name: tmp
          mountPath: /tmp
        # Read-only access to files uploaded by file-bridge (T74).
        # Chromium reads the on-disk path via DOM.setFileInputFiles.
        - name: chromeless-uploads
          mountPath: /var/lib/chromeless-uploads
          readOnly: true
        - name: x11-socket
          mountPath: /tmp/.X11-unix
        # T81 — passthrough socket dir, shared with the streamer page
        # (which writes from inside Chromium) and the v4l2-writer
        # follow-up sidecar (which reads). Production deployments
        # bind /dev/video10 here through a device plugin.
        - name: chromeless-passthrough-sockets
          mountPath: /run/chromeless-passthrough
      resources:
        requests:
          cpu: "1500m"
          memory: "3Gi"
          ephemeral-storage: "1Gi"
        limits:
          cpu: "3000m"
          memory: "6Gi"
          ephemeral-storage: "2Gi"
      readinessProbe:
        httpGet:
          path: /json/version
          port: devtools
        initialDelaySeconds: 15
        periodSeconds: 5
        failureThreshold: 6
      livenessProbe:
        httpGet:
          path: /json/version
          port: devtools
        initialDelaySeconds: 60
        periodSeconds: 30
        failureThreshold: 3
      # T57: chromeless is now read-only-root just like every other
      # container in the pod. Chromium writes to /home/cbuser, /run,
      # /tmp — all volume mounts above. The whole rootfs is RO.
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000

    # -------------------------------------------------------------------
    # chromeless-metrics-sidecar — Prometheus /metrics on :9100 (T38).
    # -------------------------------------------------------------------
    - name: chromeless-metrics-sidecar
      image: ghcr.io/iggy/chromeless/metrics-sidecar:dev
      imagePullPolicy: IfNotPresent
      env:
        - name: DEVTOOLS_URL
          value: "http://127.0.0.1:9222"
        - name: METRICS_LISTEN
          value: ":9100"
        - name: POLL_INTERVAL_S
          value: "10"
      ports:
        - name: metrics
          containerPort: 9100
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
      readinessProbe:
        httpGet:
          path: /healthz
          port: metrics
        periodSeconds: 10
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

    # M7 R4: input-bridge (T22) and cursor-watcher (T26) sidecars
    # removed. Native peer (M4 input DataChannel, M5 cursor egress)
    # delivers their function from inside the browser process.

    # -------------------------------------------------------------------
    # clipboard-bridge (T32) — wires X11 clipboard <-> client clipboard
    # through a data channel.
    # -------------------------------------------------------------------
    - name: clipboard-bridge
      image: ghcr.io/iggy/chromeless/clipboard-bridge:dev
      imagePullPolicy: IfNotPresent
      args:
        - "--ws-addr=:9300"
        - "--display=:99"
      ports:
        - name: clipboard-ws
          containerPort: 9300
      env:
        - name: DISPLAY
          value: ":99"
      volumeMounts:
        - name: x11-socket
          mountPath: /tmp/.X11-unix
        - name: tmp
          mountPath: /tmp
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000

    # -------------------------------------------------------------------
    # file-bridge (T74) — chunk + sha256 + MIME-allowlist file upload
    # over a "files" data channel. Writes to the per-session
    # chromeless-uploads emptyDir, then attaches via DOM.setFileInputFiles.
    # -------------------------------------------------------------------
    - name: file-bridge
      image: ghcr.io/iggy/chromeless/file-bridge:dev
      imagePullPolicy: IfNotPresent
      args:
        - "--ws-addr=:9400"
        - "--ws-path=/files"
        - "--cdp-url=http://127.0.0.1:9222"
        - "--upload-dir=/var/lib/chromeless-uploads"
        # session-id is patched per-session by the controller (T71).
      ports:
        - name: files-ws
          containerPort: 9400
      volumeMounts:
        - name: chromeless-uploads
          mountPath: /var/lib/chromeless-uploads
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          # 1.5 × the 100 MiB upload cap to leave room for the in-
          # memory chunk hash + http.DetectContentType buffer.
          cpu: "500m"
          memory: "256Mi"
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

    # -------------------------------------------------------------------
    # T92 — v4l2-writer (video) — consumes the streamer-page →
    # /run/chromeless-passthrough/video.sock frame stream and writes I420
    # frames into the host-DaemonSet-loaded /dev/video10 (T81 + T92).
    # The session pod is NOT privileged; the v4l2loopback module
    # was loaded once per node by infra/host-daemonset.yaml
    # (chromeless-passthrough-loader). gid 44 = "video" group; combined with
    # the device's mode 0666 set by the loader, this lets the
    # unprivileged sidecar write to /dev/video10 without
    # CAP_SYS_ADMIN or device-cgroup tweaks.
    # -------------------------------------------------------------------
    - name: v4l2-writer-video
      image: ghcr.io/iggy/chromeless/v4l2-writer:dev
      imagePullPolicy: IfNotPresent
      args:
        - "--mode=video"
        - "--socket=/run/chromeless-passthrough/video.sock"
        - "--device=/dev/video10"
      volumeMounts:
        - name: chromeless-passthrough-sockets
          mountPath: /run/chromeless-passthrough
        - name: video10
          mountPath: /dev/video10
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "300m"
          memory: "96Mi"
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 44   # "video" — matches the Dockerfile USER gid.

    # -------------------------------------------------------------------
    # T92 — v4l2-writer (audio) — consumes the streamer-page →
    # /run/chromeless-passthrough/audio.sock frame stream and writes S16LE
    # samples to the cb_passthrough PulseAudio sink (loaded by
    # infra/pulse-default.pa, T24). Uses pacat under the hood.
    # -------------------------------------------------------------------
    - name: v4l2-writer-audio
      image: ghcr.io/iggy/chromeless/v4l2-writer:dev
      imagePullPolicy: IfNotPresent
      args:
        - "--mode=audio"
        - "--socket=/run/chromeless-passthrough/audio.sock"
        - "--pulse-sink=cb_passthrough"
      env:
        # Point pacat at the PulseAudio daemon running in the
        # chromium container. The native socket is at PA's per-
        # runtime-dir location; the chromium container exposes it
        # via a shared `run` volume.
        - name: PULSE_SERVER
          value: "unix:/run/pulse/native"
      volumeMounts:
        - name: chromeless-passthrough-sockets
          mountPath: /run/chromeless-passthrough
        - name: run
          mountPath: /run/pulse
          subPath: pulse
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "64Mi"
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
