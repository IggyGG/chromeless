# infra/k8s/cloud-browser-session.yaml — Pod spec for one cloud-browser
# session.
#
# T50 Phase 3 prep: this is the *template* the (future) session
# controller will use to materialise individual session Pods. Today it
# is a standalone Pod manifest that's hand-applicable for testing —
# `kubectl apply -f cloud-browser-session.yaml` brings up one session.
#
# A session Pod runs five cooperating containers in a shared network
# and PID namespace:
#
#   cb-chromium         the T7 + T28 + T31 image without the metrics
#                       sidecar binary; runs Xvfb + PulseAudio +
#                       streamer-static + Chromium under supervisord.
#                       DevTools on :9222, streamer-static on :9000.
#   cb-metrics-sidecar  T38 sidecar exposing /metrics on :9100. Uses
#                       /proc to aggregate Chromium CPU/RSS, hence the
#                       Pod-wide shareProcessNamespace below.
#   input-bridge        T22 server-side input dispatch; relays the
#                       streamer's "input" data channel into Chromium
#                       DevTools Input.dispatchMouseEvent / KeyEvent.
#   cursor-watcher      T26 sidecar that polls Chromium for cursor
#                       shape/position metadata and forwards to the
#                       data channel.
#   clipboard-bridge    T32 sidecar that wires X11 clipboard into the
#                       client via a data channel.
#
# Security knobs:
#   shareProcessNamespace=true        cb-metrics-sidecar needs /proc
#                                     visibility into chromium PIDs;
#                                     this widens trust inside the
#                                     pod but the pod is a single
#                                     tenant unit anyway. See T44 for
#                                     the cross-pod story.
#   runtimeClassName: gvisor          (commented; decision deferred to
#                                     Phase 3 per T44's matrix)
#   readOnlyRootFilesystem            on every sidecar where possible.
#                                     cb-chromium needs writable root
#                                     because chromium spawns helpers
#                                     and writes a profile dir.
#
# Image registry placeholder: we use ghcr.io/iggy/cloud-browser-webrtc
# throughout. The actual registry path will land when we publish.
apiVersion: v1
kind: Pod
metadata:
  name: cb-session-template
  namespace: cloud-browser-webrtc
  labels:
    app.kubernetes.io/name: cloud-browser-webrtc
    app.kubernetes.io/component: session
    cb.session/state: warm
  annotations:
    # T68: optional CRIU snapshot to restore from at startup. Empty (or
    # unset) means "cold-start the pod normally". The session
    # controller (T50) reads this annotation to decide between
    # cold-start and the snapshot fast path; the value is a
    # content-sha matching a directory under
    # /var/lib/cb-snapshots/shared/<sha>/ on the node. See
    # infra/snapshots/README.md for the full design and threat model
    # (especially the "must be tenant-clean" contract).
    cb.io/snapshot-id: ""
spec:
  # Phase 3 isolation lever. Uncomment after the runtimeClass is
  # installed cluster-wide. See docs/research/sandbox-isolation.md.
  # runtimeClassName: gvisor

  shareProcessNamespace: true
  restartPolicy: Always

  # T57: pod-level security posture. Every container also sets its own
  # securityContext so a future container addition can't accidentally
  # default itself back to root. fsGroup=1000 makes emptyDir mounts
  # cbuser-writable (group ownership 1000, mode 0775).
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      # Localhost = the kubelet's seccomp dir
      # (/var/lib/kubelet/seccomp/cb-chromium.json). Deploys must
      # install the JSON on every node before this pod will start.
      # See infra/security-hardening.md "K8s seccomp install".
      type: Localhost
      localhostProfile: cb-chromium.json

  # Cluster-internal DNS for signaling. Keep clusterFirst so the pod
  # uses the cluster's DNS resolver; Phase-3 prod can layer per-tenant
  # DNS via NetworkPolicy + a sidecar resolver.
  dnsPolicy: ClusterFirst

  # Don't auto-mount the default ServiceAccount token: nothing in this
  # pod talks to the K8s API. The session controller will mint a
  # dedicated, no-permission SA when it starts using the K8s API.
  automountServiceAccountToken: false

  # T57: every writable path under / needs a volume since
  # readOnlyRootFilesystem: true on every container. /run is one
  # emptyDir for everything supervisord/pulse/cb-session need;
  # cold-start.sh re-creates the subdirs at startup.
  volumes:
    # /dev/shm: Chromium needs more than the default 64M. emptyDir with
    # medium=Memory backs it with tmpfs at the size we set in compose
    # via shm_size.
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    # /run: supervisord socket + pid, pulse runtime, cb-session env.
    # tmpfs-backed so it doesn't burn ephemeral storage budget.
    - name: run
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
    # /var/log/supervisor: program logs. Bytes-on-disk; small.
    - name: supervisor-log
      emptyDir:
        sizeLimit: 64Mi
    # /home/cbuser: chromium config + profile + caches. Sized for one
    # session's worth of state.
    - name: home
      emptyDir:
        sizeLimit: 512Mi
    # /tmp: general-purpose. Nothing in the image puts large files
    # here; 64Mi is plenty.
    - name: tmp
      emptyDir:
        sizeLimit: 64Mi
    # X11 socket dir — Xvfb writes /tmp/.X11-unix/X99. Lives separate
    # from /tmp so we can mount it in containers that need the display
    # without giving them write access to all of /tmp.
    - name: x11-socket
      emptyDir: {}
    # Per-session uploads (T74) — file-bridge writes here, Chromium
    # reads the file paths via DOM.setFileInputFiles. emptyDir so the
    # storage is reclaimed when the pod terminates; sized to 2 × the
    # 100 MiB upload cap to allow at least one concurrent upload plus
    # whatever the user has attached via past uploads.
    - name: cb-uploads
      emptyDir:
        sizeLimit: 256Mi

  # Pod-level resources are summed across containers; we target ~3 CPU
  # / ~5.5GB mem / 2GB ephemeral storage on the request side. Cluster
  # autoscaling provisions accordingly.
  containers:

    # -------------------------------------------------------------------
    # cb-chromium — main browser process tree (Xvfb + PulseAudio +
    # streamer-static + Chromium under supervisord).
    # -------------------------------------------------------------------
    - name: cb-chromium
      image: ghcr.io/iggy/cloud-browser-webrtc/chromium:dev
      imagePullPolicy: IfNotPresent
      env:
        - name: SESSION_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SIGNALING_URL
          # cluster-internal Service; see signaling-deployment.yaml
          value: "ws://signaling.cloud-browser-webrtc.svc.cluster.local:8080/ws"
        - name: STREAMER_FPS
          value: "30"
        # Disable the watchdog when running under the cluster
        # controller; cluster-side idle handling is the controller's
        # job (see session-controller-design.md). Pod-level watchdog
        # would race the controller.
        - name: IDLE_TIMEOUT_S
          value: "999999"
      ports:
        - name: devtools
          containerPort: 9222
        - name: streamer
          containerPort: 9000
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: run
          mountPath: /run
        - name: supervisor-log
          mountPath: /var/log/supervisor
        - name: home
          mountPath: /home/cbuser
        - name: tmp
          mountPath: /tmp
        # Read-only access to files uploaded by file-bridge (T74).
        # Chromium reads the on-disk path via DOM.setFileInputFiles.
        - name: cb-uploads
          mountPath: /var/lib/cb-uploads
          readOnly: true
        - name: x11-socket
          mountPath: /tmp/.X11-unix
      resources:
        requests:
          cpu: "1500m"
          memory: "3Gi"
          ephemeral-storage: "1Gi"
        limits:
          cpu: "3000m"
          memory: "6Gi"
          ephemeral-storage: "2Gi"
      readinessProbe:
        httpGet:
          path: /json/version
          port: devtools
        initialDelaySeconds: 15
        periodSeconds: 5
        failureThreshold: 6
      livenessProbe:
        httpGet:
          path: /json/version
          port: devtools
        initialDelaySeconds: 60
        periodSeconds: 30
        failureThreshold: 3
      # T57: cb-chromium is now read-only-root just like every other
      # container in the pod. Chromium writes to /home/cbuser, /run,
      # /tmp — all volume mounts above. The whole rootfs is RO.
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000

    # -------------------------------------------------------------------
    # cb-metrics-sidecar — Prometheus /metrics on :9100 (T38).
    # -------------------------------------------------------------------
    - name: cb-metrics-sidecar
      image: ghcr.io/iggy/cloud-browser-webrtc/metrics-sidecar:dev
      imagePullPolicy: IfNotPresent
      env:
        - name: DEVTOOLS_URL
          value: "http://127.0.0.1:9222"
        - name: METRICS_LISTEN
          value: ":9100"
        - name: POLL_INTERVAL_S
          value: "10"
      ports:
        - name: metrics
          containerPort: 9100
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
      readinessProbe:
        httpGet:
          path: /healthz
          port: metrics
        periodSeconds: 10
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

    # -------------------------------------------------------------------
    # input-bridge (T22) — relays input events from the streamer page's
    # data channel into Chromium DevTools.
    #
    # Default ws-addr is 9100, which collides with cb-metrics-sidecar
    # in the shared pod network namespace. We override to :9200 here.
    # Follow-up: bake the override into the input-bridge default once
    # T38 + T22 ship together in the same image.
    # -------------------------------------------------------------------
    - name: input-bridge
      image: ghcr.io/iggy/cloud-browser-webrtc/input-bridge:dev
      imagePullPolicy: IfNotPresent
      args:
        - "--ws-addr=:9200"
        - "--metrics-addr=:9101"
        - "--cdp-url=http://127.0.0.1:9222"
      ports:
        - name: input-ws
          containerPort: 9200
        - name: input-metrics
          containerPort: 9101
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "300m"
          memory: "256Mi"
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

    # -------------------------------------------------------------------
    # cursor-watcher (T26) — polls Chromium for cursor metadata and
    # pushes events to the input-bridge ws sink.
    # -------------------------------------------------------------------
    - name: cursor-watcher
      image: ghcr.io/iggy/cloud-browser-webrtc/cursor-watcher:dev
      imagePullPolicy: IfNotPresent
      args:
        - "--cdp-url=http://127.0.0.1:9222"
        - "--sink-url=ws://127.0.0.1:9200/cursor"
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "300m"
          memory: "256Mi"
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

    # -------------------------------------------------------------------
    # clipboard-bridge (T32) — wires X11 clipboard <-> client clipboard
    # through a data channel.
    # -------------------------------------------------------------------
    - name: clipboard-bridge
      image: ghcr.io/iggy/cloud-browser-webrtc/clipboard-bridge:dev
      imagePullPolicy: IfNotPresent
      args:
        - "--ws-addr=:9300"
        - "--display=:99"
      ports:
        - name: clipboard-ws
          containerPort: 9300
      env:
        - name: DISPLAY
          value: ":99"
      volumeMounts:
        - name: x11-socket
          mountPath: /tmp/.X11-unix
        - name: tmp
          mountPath: /tmp
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000

    # -------------------------------------------------------------------
    # file-bridge (T74) — chunk + sha256 + MIME-allowlist file upload
    # over a "files" data channel. Writes to the per-session
    # cb-uploads emptyDir, then attaches via DOM.setFileInputFiles.
    # -------------------------------------------------------------------
    - name: file-bridge
      image: ghcr.io/iggy/cloud-browser-webrtc/file-bridge:dev
      imagePullPolicy: IfNotPresent
      args:
        - "--ws-addr=:9400"
        - "--ws-path=/files"
        - "--cdp-url=http://127.0.0.1:9222"
        - "--upload-dir=/var/lib/cb-uploads"
        # session-id is patched per-session by the controller (T71).
      ports:
        - name: files-ws
          containerPort: 9400
      volumeMounts:
        - name: cb-uploads
          mountPath: /var/lib/cb-uploads
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          # 1.5 × the 100 MiB upload cap to leave room for the in-
          # memory chunk hash + http.DetectContentType buffer.
          cpu: "500m"
          memory: "256Mi"
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
