  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: run
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
    - name: supervisor-log
      emptyDir:
        sizeLimit: 64Mi
    - name: home
      emptyDir:
        sizeLimit: 512Mi
    - name: tmp
      emptyDir:
        sizeLimit: 64Mi
    - name: x11-socket
