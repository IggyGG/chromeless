        runAsGroup: 1000
---
apiVersion: v1
kind: Pod
metadata:
  name: cv2-82-real-pulse
  namespace: chromeless
  labels:
    app.kubernetes.io/name: cv2-82-test-pod
    app.kubernetes.io/component: m5.5-verification
    app.kubernetes.io/part-of: chromeless
    cv2-82.variant: real-pulse
  annotations:
    cv2-82.purpose: >-
      Full-stimulus Pulse-equipped variant. cb-chromium under production
      supervisord. After supervisord brings Pulse up,
      lifecycle/cv2-82-real-pulse-stimulus.sh (a postStart sidecar-script that
      lives inside the container image) loads `module-sine sink=cb_audio
      frequency=1000 rate=48000` so the loopback to cb_capture.monitor carries
      a real 1 kHz frame. Verifies M5.5 R1+R2 + R3 stderr-piggyback (R4 is
      Wave 2.5 — audio AddTrack consumer not yet wired on cv2/wave-1-integration
      per pre-fire grep checklist).
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  shareProcessNamespace: true
  nodeSelector:
    kubernetes.io/hostname: triform-7
  imagePullSecrets:
    - name: registry-pull
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: run
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
    - name: supervisor-log
      emptyDir:
        sizeLimit: 64Mi
    - name: home
      emptyDir:
        sizeLimit: 512Mi
    - name: tmp
      emptyDir:
        sizeLimit: 64Mi
    - name: x11-socket
      emptyDir:
        sizeLimit: 16Mi
  containers:
    - name: cb-chromium
      image: registry.triform.cloud/chromeless/chromeless:cr7727-fd020fad6e97
      imagePullPolicy: Always
      env:
        - name: SESSION_ID
          value: cv2-82-real-pulse
        - name: CHROMELESS_USE_FAKE_MEDIA
          value: "0"
        - name: CHROMELESS_REGION
          value: triform-eu
        - name: CV2_82_VARIANT
          value: real-pulse
      ports:
        - name: cdp
          containerPort: 9222
      volumeMounts:
        - { name: dshm, mountPath: /dev/shm }
        - { name: run, mountPath: /run }
        - { name: supervisor-log, mountPath: /var/log/supervisor }
        - { name: home, mountPath: /home/cbuser }
        - { name: tmp, mountPath: /tmp }
        - { name: x11-socket, mountPath: /tmp/.X11-unix }
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
          ephemeral-storage: 512Mi
        limits:
          cpu: "2"
          memory: 4Gi
          ephemeral-storage: 2Gi
      startupProbe:
        httpGet: { path: /json/version, port: cdp }
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 36
      # postStart loads module-sine after Pulse is up so cb_audio carries a
      # 1 kHz tone. Uses pactl which is already in the image (pulseaudio-utils
      # package, see infra/Dockerfile). Loop on PULSE_SERVER socket existence
      # because supervisord priority=20 (Pulse) may finish startsecs=2 after
      # the postStart fires; retries are bounded to ~10s.
      lifecycle:
        postStart:
          exec:
            command:
              - /bin/sh
              - -c
              - >-
                set -eu;
                for i in $(seq 1 20); do
                  if pactl info >/dev/null 2>&1; then
                    pactl load-module module-sine sink=cb_audio frequency=1000 rate=48000 || true;
                    exit 0;
                  fi;
                  sleep 0.5;
                done;
                echo "cv2-82-real-pulse postStart: Pulse unreachable after 10s" >&2;
                exit 1
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
