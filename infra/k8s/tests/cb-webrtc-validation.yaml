# cb-webrtc-validation.yaml — WebRTC end-to-end harness against an
# in-pod cb-chromium. Drives the full handshake (offer/answer
# exchanged via CDP `Runtime.evaluate` ↔ in-page `postMessage`),
# records 5s of frames to /tmp/out/out.webm via the @roamhq/wrtc
# RTCVideoSink → ffmpeg pipe, and (via encoder-assertions.mjs)
# asserts `outboundRtp.encoderImplementation` matches our injected
# cloud-browser-{vp9-libvpx,h264-x264,svtav1} strings — i.e. the
# embedded encoder factory is in fact servicing the RTCPeerConnection
# rather than chromium's stock libvpx/OpenH264 fallback.
#
# Two-container Pod (NOT initContainer pair — both run for the full
# Job lifetime):
#
#   1. cb-chromium — system under test. Runs Xvfb + cloud_browser_
#      worker with the same flag set as the cb-browserless Deployment
#      in triform-wtf. CDP listens on localhost:9222. Resources mirror
#      the runtime Deployment so encoder behavior is comparable.
#
#   2. test-driver — node:20-bookworm-slim. Hits the chromium
#      container at localhost:9222 via the shared pod network
#      namespace. Installs ffmpeg + npm deps at runtime, then runs
#      drive-recorder.mjs (owned by webrtc-harness-author).
#
# Shared volume `out-vol` mounts at /tmp/out in both containers:
#   - test-driver writes /tmp/out/out.webm and (post-validation)
#     /tmp/out/done as the shutdown sentinel.
#   - cb-chromium polls for /tmp/out/done and SIGTERMs itself when
#     the test completes. This avoids a wedged Pod waiting on
#     activeDeadlineSeconds whenever the test passes.
#
# Pod lifecycle nuance: Jobs require all containers to exit before
# the Pod is Complete. cb-chromium is a long-lived process, so
# without coordination the test-driver would exit 0, the Pod would
# stay Running with cb-chromium alive, and the Job would only finish
# when activeDeadlineSeconds hits (Failed). The done-sentinel pattern
# (vs `pkill -TERM` across shareProcessNamespace) is more portable
# and avoids needing process-namespace sharing or extra capabilities.
#
# Wired into cb-build.sh: NOT YET. The CDP smoke (sibling
# cb-cdp-validation Job) is the build-promotion gate; this Job is
# manual-apply only until encoder-assertions stabilises and the
# harness has a few green runs against cr7727-sw.

apiVersion: batch/v1
kind: Job
metadata:
  name: cb-webrtc-validation
  namespace: cb-tests
  labels:
    app.kubernetes.io/name: cloud-browser-webrtc
    app.kubernetes.io/component: test
    app.kubernetes.io/variant: webrtc-encoder-identity
spec:
  # backoffLimit:1 — fail-fast; the harness is deterministic.
  backoffLimit: 1
  # 5m hard ceiling: ~30s test + 60s clone + 60s npm install + 60s
  # apt install ffmpeg + slack.
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-browser-webrtc
        app.kubernetes.io/component: test
        app.kubernetes.io/variant: webrtc-encoder-identity
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: registry-pull
      initContainers:
        - name: bootstrap-tests
          image: alpine/git:2.43.0
          command:
            - sh
            - -euxc
            - |
              AUTH_REPO="${OUR_REPO%%://*}://${FORGEJO_USERNAME}:${FORGEJO_PASSWORD}@${OUR_REPO#*://}"
              git clone --depth 1 --branch "${OUR_REPO_REF}" \
                "${AUTH_REPO}" /workspace
              git -C /workspace remote set-url origin "${OUR_REPO}"
              if [ ! -d /workspace/tests/webrtc ]; then
                echo "ERROR: /workspace/tests/webrtc missing on ${OUR_REPO_REF};" >&2
                echo "       webrtc-harness-author scaffolding (tests/webrtc/{package.json,drive-recorder.mjs,streamer-page.html}) hasn't landed yet." >&2
                exit 1
              fi
              ls -la /workspace/tests/webrtc
          env:
            - name: OUR_REPO
              value: "http://forgejo-http.forgejo.svc.cluster.local:3000/triform/chromeless.git"
            - name: OUR_REPO_REF
              value: "main"
            - name: FORGEJO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: forgejo-credentials
                  key: username
            - name: FORGEJO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-credentials
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        # ----------- container 1/2: cb-chromium (SUT) -----------
        # Mirrors cb-browserless Deployment in triform-wtf line-for-line
        # (same image, same flag set, same Xvfb + DISPLAY=:99 dance) so
        # encoder behavior is comparable to production. Differences:
        #   - probes removed (Job lifecycle is the test-driver's exit,
        #     not k8s health checks)
        #   - command wraps cloud_browser_worker in a watcher that
        #     SIGTERMs on the /tmp/out/done sentinel from the test-
        #     driver, so the Job exits cleanly instead of waiting on
        #     activeDeadlineSeconds
        #   - container exits 0 on graceful-shutdown so the Pod is
        #     Complete (not Failed) when the test passes
        - name: cb-chromium
          image: registry.triform.cloud/cloud-browser-webrtc/cb-chromium:cr7727-sw
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              set -x
              export HOME=/tmp/cb-home
              mkdir -p $HOME/.config/chromium
              mkdir -p /tmp/out

              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp -ac &
              sleep 2
              export DISPLAY=:99

              # disable-features list extended for the test Job:
              #   * TranslateUI, MediaRouter — match cb-browserless
              #   * Vulkan, VaapiVideoDecodeLinuxGL — no GPU in test pods
              #   * IntensiveWakeUpThrottling — chromium 88+ throttles
              #     background tabs aggressively after ~5s in headless
              #     contexts. Frames stop flowing on the page-side
              #     <canvas>, the encoder gets zero work, and
              #     outboundRtp.encoderImplementation never populates.
              #   * CalculateNativeWinOcclusion — prevents the
              #     "occluded window" path from pausing rendering
              #     when there's no visible compositor.
              #   * BackForwardCacheMemoryControls,Translate — stragglers
              #     observed contributing to background-tab pauses.
              /usr/local/bin/cloud_browser_worker \
                --no-sandbox \
                --disable-dev-shm-usage \
                --display=:99 \
                --remote-debugging-port=9222 \
                --remote-debugging-address=0.0.0.0 \
                --remote-allow-origins=* \
                --user-data-dir=$HOME/.config/chromium \
                --no-first-run \
                --no-default-browser-check \
                --disable-features=TranslateUI,MediaRouter,Vulkan,VaapiVideoDecodeLinuxGL,IntensiveWakeUpThrottling,CalculateNativeWinOcclusion,BackForwardCacheMemoryControls,Translate \
                --disable-background-timer-throttling \
                --disable-renderer-backgrounding \
                --disable-backgrounding-occluded-windows \
                --disable-gpu \
                --ozone-platform=x11 \
                --use-gl=angle \
                --use-angle=swiftshader-webgl \
                --window-size=1280,720 \
                --use-fake-ui-for-media-stream \
                --use-fake-device-for-media-stream \
                about:blank &
              CB_PID=$!

              # Watcher: when the test-driver writes /tmp/out/done,
              # SIGTERM cloud_browser_worker so this container exits.
              # Any failure in the watcher is non-fatal — the Job's
              # activeDeadlineSeconds remains the safety net.
              ( while [ ! -f /tmp/out/done ]; do sleep 1; done; \
                kill -TERM "$CB_PID" 2>/dev/null || true ) &

              # Wait on chromium and absorb its SIGTERM-induced exit
              # as success — the Job's success signal is the test-
              # driver's exit code, not chromium's.
              wait "$CB_PID" || true
              exit 0
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: out-vol
              mountPath: /tmp/out
        # ----------- container 2/2: test-driver -----------
        # @roamhq/wrtc requires glibc ≥ 2.28 + ffmpeg in PATH for the
        # RTCVideoSink → webm encoder pipe. node:20-bookworm-slim ships
        # glibc 2.36; the apt-install adds ffmpeg in ~10s on a cold
        # cache.
        - name: test-driver
          image: node:20-bookworm-slim
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -euxc
            - |
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ffmpeg ca-certificates curl

              # Wait for chromium pod-mate to expose CDP. /json/version
              # is the canonical readiness signal (mirrors tests/smoke/
              # container-boot.sh).
              i=0
              until curl -fsS http://localhost:9222/json/version >/dev/null; do
                i=$((i+1))
                if [ "$i" -gt 60 ]; then
                  echo "ERROR: cb-chromium pod-mate did not expose CDP within 60s" >&2
                  exit 1
                fi
                sleep 1
              done

              cd /workspace/tests/webrtc
              npm install --no-audit --no-fund --silent

              # Recording is always produced. drive-recorder.mjs emits
              # a structured TEST_ARTIFACT line with the path + size +
              # codec; we capture it so a follow-up step can echo it
              # verbatim into Pod logs and a separate `kubectl cp`
              # can pull the artifact off the Pod's emptyDir.
              #
              # The default steer script (fixtures/default-steer-script.json)
              # walks the demo through boot → idle → streaming with
              # log-line + bar-set + flash messages so the recorded
              # webm has visibly varied content even when no
              # per-test steering is supplied.
              mkdir -p /tmp/out
              node drive-recorder.mjs \
                --cb-url=http://localhost:9222 \
                --duration=5 \
                --out=/tmp/out/out.webm \
                --steer-script=fixtures/default-steer-script.json

              # Acceptance: artifact exists and is non-trivial size.
              # The plan's threshold is 10 KiB (any value ≥ that
              # implies actual video frames written, not an empty
              # webm container).
              echo "[validation] artifact:"
              ls -la /tmp/out/out.webm
              size=$(stat -c%s /tmp/out/out.webm)
              if [ "$size" -lt 10240 ]; then
                echo "ERROR: out.webm is $size bytes (< 10240 byte threshold)" >&2
                touch /tmp/out/done
                exit 1
              fi

              # Surface the artifact in Pod logs so an operator can
              # base64-decode it locally without needing `kubectl cp`
              # (handy when debugging from a phone or restricted shell).
              # We only do this when ffprobe says the duration is sane —
              # avoids spamming megabytes of logs on a corrupt webm.
              ffprobe_dur=$(ffprobe -v error -show_entries format=duration \
                            -of default=nw=1:nk=1 /tmp/out/out.webm 2>/dev/null || true)
              echo "[validation] ffprobe duration: ${ffprobe_dur:-unknown}s"
              if [ -n "${ffprobe_dur}" ]; then
                echo "[validation] artifact base64 (decode + write to .webm to play):"
                echo "===WEBM_BASE64_BEGIN==="
                base64 -w 0 /tmp/out/out.webm
                echo
                echo "===WEBM_BASE64_END==="
              fi

              # Signal cb-chromium pod-mate to shut down so the Pod
              # transitions to Complete instead of waiting on
              # activeDeadlineSeconds.
              touch /tmp/out/done
          env:
            - name: CB_URL
              value: "http://localhost:9222"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
              ephemeral-storage: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # SETUID/SETGID: apt drops to _apt user during package
              # fetch. CHOWN/FOWNER/DAC_OVERRIDE: dpkg writes vary
              # across uids during install.
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: workspace
              mountPath: /workspace
              readOnly: true
            - name: out-vol
              mountPath: /tmp/out
      volumes:
        # Workspace holds the cloned tests/webrtc/ tree from the
        # bootstrap-tests initContainer. Read-only on the test-driver
        # so npm doesn't pollute the cloned source; the npm cache and
        # node_modules go under the test-driver's writable root fs.
        - name: workspace
          emptyDir:
            sizeLimit: 256Mi
        # Memory-backed shared memory for chromium (matches the
        # cb-browserless Deployment in triform-wtf). 256Mi is
        # generous for a 5s recording at 1280×720.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        # Shared workspace for out.webm + done sentinel. emptyDir
        # because nothing past the Job needs the artifact (we'd want
        # a hostPath if humans had to inspect it post-mortem; for now
        # `kubectl logs ... -c test-driver` shows the size + ffprobe
        # output and that's enough).
        - name: out-vol
          emptyDir:
            sizeLimit: 256Mi
