# pvc-chromium-src — Chromium source tree + out/ build dir + our patch
# series checkout. Sized at 500Gi to comfortably hold:
#
#   - ~60–80 GB for the Chromium checkout (incl. third_party + .git)
#   - ~40–60 GB for `out/cb-release/` per build
#   - ~10–20 GB for our repo + symlink as //cloud-browser
#   - room for one rolled-but-not-cleaned previous out/ dir during a
#     branch update
#
# Storage class is `openebs-hostpath` — node-local SSD on triform-6.
# T17 §4 explicitly says **no NFS, no FUSE, no case-insensitive
# filesystem** for Chromium src/. openebs-hostpath gives us bare
# ext4/xfs on the node's underlying disk, which is what build wants.
#
# Node pinning: openebs-hostpath uses WaitForFirstConsumer, so the PV
# materialises on whichever node the first Pod consuming this PVC
# lands on. Because `build-job.yaml` pins to `nodeName: triform-6`,
# the PV will land there. Subsequent pods (debug shells, follow-up
# jobs) MUST also be scheduled on triform-6 — we enforce that with
# the Job spec rather than a NodeAffinity here, because PVC-level
# NodeAffinity is set by the provisioner at PV creation time and
# tightening it requires a CSI feature gate that triform's openebs
# install doesn't have.
#
# RWO is fine: only one builder runs at a time per the brief
# (backoffLimit: 2 means at most one Pod alive). When we want
# parallel builds we'll need separate PVCs (and probably a separate
# build host).

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chromium-src
  namespace: cb-build
  labels:
    app.kubernetes.io/name: cloud-browser-webrtc
    app.kubernetes.io/component: build
    triform.ai/node: triform-6
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 500Gi
