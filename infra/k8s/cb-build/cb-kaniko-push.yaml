# cb-kaniko-push — push the runtime cb-chromium image after a cb-build
# Job has staged the build context.
#
# WHY: build-job-{x264,vaapi,nvenc}.yaml all run cb-build.sh which in
# Step 9 stages the runtime image build context to
# ${CB_WORK_ROOT}/artifacts/context/ on the chromium-src hostPath.
# That step writes Dockerfile + cloud_browser_worker + supervisord +
# launch-chromium.sh + IMAGE_TAG. It does NOT push: the planned
# in-Job kaniko sidecar (T112) is not wired in, on purpose, so push
# auth lives outside the build container.
#
# This Job picks up where the build left off and pushes to the
# forgejo registry.
#
# WHEN: apply this AFTER cb-build-${VARIANT} reaches Succeeded. Do
# not chain it onto the build Job itself — the registry needs to be
# scaled to 1 replica before the push (BUGS-513 workaround) and that
# is an operator step today.
#
# VARIANT MATRIX: this manifest defaults to the x264 / sw profile on
# triform-2. To push vaapi or nvenc, the operator edits the file
# in place per the README. The fields that change per variant are
# enumerated in cb-kaniko-push.README.md § Variant overrides.
#
# Tag is driven by CB_KANIKO_TAG env-var ($(CB_KANIKO_TAG) in args
# uses K8s downward-API-style interpolation). nodeName + hostPath
# path cannot be env-driven on a Job manifest and are explicit.
#
# See:
#   - infra/k8s/cb-build/cb-kaniko-push.README.md (full activation
#     procedure, variant overrides, BUGS-513 dance, future work)
#   - infra/k8s/cb-build/build-job-x264.yaml line 1 (build context)
#   - build/cb-build.sh Step 9 (where /work/artifacts/context comes
#     from)

apiVersion: batch/v1
kind: Job
metadata:
  name: cb-kaniko-push
  namespace: cb-build
  labels:
    app.kubernetes.io/name: cloud-browser-webrtc
    app.kubernetes.io/component: image-push
    app.kubernetes.io/variant: sw
spec:
  # backoffLimit:1 — kaniko push is short-lived; one retry on a
  # transient registry 502 is fine. More than that and it's
  # almost always a cred / scale-down / context-missing bug that
  # retries won't fix.
  backoffLimit: 1
  # 5 min hard ceiling. Cold layer push is ~30-60s; this leaves
  # generous headroom for registry flakes.
  activeDeadlineSeconds: 300
  # Keep the Pod around for a day so post-mortem logs are
  # available without resurrecting from k8s events.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-browser-webrtc
        app.kubernetes.io/component: image-push
        app.kubernetes.io/variant: sw
    spec:
      restartPolicy: OnFailure
      # Pin to the node that holds the build artifacts on its
      # hostPath. CHANGE THIS for nvenc — see README.
      nodeName: triform-2
      nodeSelector:
        kubernetes.io/hostname: triform-2
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.23.2
          # K8s interpolates $(VAR) in args from container env at
          # pod-create time. CB_KANIKO_TAG below drives both the
          # destination tag and the IMAGE_TAG build-arg.
          args:
            - --dockerfile=/workspace/Dockerfile
            - --context=/workspace
            - --destination=registry.triform.cloud/cloud-browser-webrtc/cb-chromium:$(CB_KANIKO_TAG)
            - --build-arg=IMAGE_TAG=$(CB_KANIKO_TAG)
            # Always rebuild layers locally — tag floats across
            # variant runs and we want every push to reflect the
            # current /workspace contents, not a layer cache from
            # a prior tag.
            - --cache=false
            # Forgejo registry is occasionally flaky on the manifest
            # PUT (BUGS-511 / BUGS-513). Let kaniko retry inside a
            # single Job invocation rather than relying on
            # backoffLimit (which respawns the whole pod).
            - --push-retry=3
            - --image-fs-extract-retry=3
            # INFO output is small and post-mortem-useful; DEBUG
            # is verbose enough to drown the actual error.
            - --verbosity=info
          env:
            # Override per variant. Defaults to the sw / x264 tag
            # that cb-chromium-smoke pulls.
            - name: CB_KANIKO_TAG
              value: "cr7727-sw"
            # kaniko reads docker auth from $DOCKER_CONFIG/config.json.
            - name: DOCKER_CONFIG
              value: /kaniko/.docker
          volumeMounts:
            - name: workspace
              mountPath: /workspace
              readOnly: true
            - name: docker-config
              mountPath: /kaniko/.docker
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
              ephemeral-storage: "8Gi"
      volumes:
        # Mount the build artifact context that cb-build.sh Step 9
        # wrote. Kaniko reads Dockerfile + cloud_browser_worker +
        # supervisord.conf + launch-chromium.sh + IMAGE_TAG from
        # here.
        #
        # CHANGE THIS for nvenc:
        #   x264 / vaapi (triform-2): /mnt/data/cb-build-t2/chromium-src/artifacts/context
        #   nvenc       (triform-5): /mnt/data/cb-build-t5/chromium-src/artifacts/context
        - name: workspace
          hostPath:
            path: /mnt/data/cb-build-t2/chromium-src/artifacts/context
            type: Directory
        # Same Secret the build-job manifests use for imagePullSecret;
        # already exists in cb-build ns (see README § Prereqs in
        # the cb-build README for how to create it).
        - name: docker-config
          secret:
            secretName: registry-pull
            items:
              - key: .dockerconfigjson
                path: config.json
