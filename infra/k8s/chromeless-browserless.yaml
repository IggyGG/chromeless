# Static CDP compatibility deployment for Triform integration.
#
# The controller-managed BrowserSessionPool path is the primary native
# streaming runtime. This Deployment keeps the legacy in-cluster
# CHROMELESS_URL endpoint available at:
#
#   http://chromeless-browserless.chromeless.svc.cluster.local:9222
#
# Update both image tags together when cutting a cr7727-* release.
apiVersion: v1
kind: Service
metadata:
  name: chromeless-browserless
  namespace: chromeless
  labels:
    app.kubernetes.io/name: chromeless-browserless
    app.kubernetes.io/component: cdp-pool
    app.kubernetes.io/part-of: chromeless
spec:
  selector:
    app.kubernetes.io/name: chromeless-browserless
  ports:
    - name: cdp
      port: 9222
      targetPort: cdp
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromeless-browserless
  namespace: chromeless
  labels:
    app.kubernetes.io/name: chromeless-browserless
    app.kubernetes.io/component: cdp-pool
    app.kubernetes.io/part-of: chromeless
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: chromeless-browserless
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromeless-browserless
        app.kubernetes.io/component: cdp-pool
        app.kubernetes.io/part-of: chromeless
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      shareProcessNamespace: true
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: supervisor-log
          emptyDir:
            sizeLimit: 64Mi
        - name: home
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: x11-socket
          emptyDir:
            sizeLimit: 16Mi
      containers:
        - name: cb-chromium
          image: registry.triform.cloud/chromeless/chromeless:cr7727-1791a91c0eb1
          imagePullPolicy: Always
          env:
            - name: SESSION_ID
              value: chromeless-browserless
            - name: SIGNALING_URL
              value: ws://triform.triform-wtf.svc.cluster.local:3000/api/webrtc/signaling/cb:chromeless-browserless
            - name: STREAMER_FPS
              value: "30"
            - name: IDLE_TIMEOUT_S
              value: "999999"
            - name: CHROMELESS_REGION
              value: triform-eu
          ports:
            - name: cdp
              containerPort: 9222
            - name: streamer
              containerPort: 9000
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: run, mountPath: /run }
            - { name: supervisor-log, mountPath: /var/log/supervisor }
            - { name: home, mountPath: /home/cbuser }
            - { name: tmp, mountPath: /tmp }
            - { name: x11-socket, mountPath: /tmp/.X11-unix }
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 2Gi
          startupProbe:
            httpGet: { path: /json/version, port: cdp }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /json/version, port: cdp }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /json/version, port: cdp }
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
        - name: chromeless-metrics-sidecar
          image: registry.triform.cloud/chromeless/chromeless-metrics-sidecar:cr7727-1791a91c0eb1
          imagePullPolicy: Always
          env:
            - name: DEVTOOLS_URL
              value: http://127.0.0.1:9222
            - name: METRICS_LISTEN
              value: :9100
            - name: POLL_INTERVAL_S
              value: "10"
            - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
              value: http://signoz-otel-collector.signoz.svc.cluster.local:4318/v1/logs
            - name: CHROMELESS_REGION
              value: triform-eu
          ports:
            - name: metrics
              containerPort: 9100
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
