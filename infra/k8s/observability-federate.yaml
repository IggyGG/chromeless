# infra/k8s/observability-federate.yaml — global federate Prometheus
# (T94). One of these runs cluster-wide (NOT per region — there's
# only one global aggregator). Each per-region Prometheus exposes
# /federate; this server scrapes them all and joins by the `region`
# external label.
#
# Per-region Prometheus configs live in
# `infra/observability/prometheus/prometheus.yml` (deployed via the
# Helm chart per region). This file is the *global* topology.
#
# In a multi-cluster deploy this would typically live in a separate
# "ops" cluster reachable from every regional cluster. For
# single-cluster dev (or a Phase-1 pre-multi-region deploy) it
# coexists in the cloud-browser-webrtc namespace; the regional
# Prometheus targets list collapses to "localhost".

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-federate-config
  namespace: cloud-browser-webrtc
  labels:
    app.kubernetes.io/name: cloud-browser-webrtc
    app.kubernetes.io/component: observability-federate
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        role: federate
        deploy: cloud-browser-webrtc-global

    scrape_configs:
      - job_name: cb-region-federate
        honor_labels: true
        metrics_path: /federate
        params:
          "match[]":
            - '{__name__=~"cb_.*"}'
        # Replace with real per-region Prometheus endpoints. In K8s
        # this typically points at per-cluster Service exposed via
        # an internal LoadBalancer or via a VPN/peering mesh.
        static_configs:
          - targets:
              - prometheus.us-east-1.cloud-browser-webrtc.example.com:9090
              - prometheus.eu-west-1.cloud-browser-webrtc.example.com:9090
              - prometheus.ap-northeast-1.cloud-browser-webrtc.example.com:9090
            labels:
              tier: regional

    # Alerts that span regions (T94 cloud-browser-webrtc.global
    # group) live in the same alert rules file as the regional
    # rules — Prometheus evaluates rules locally, AlertManager
    # routes them by `scope: global` label.
    rule_files:
      - /etc/prometheus/rules/*.yaml

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-federate
  namespace: cloud-browser-webrtc
  labels:
    app.kubernetes.io/name: cloud-browser-webrtc
    app.kubernetes.io/component: observability-federate
spec:
  replicas: 1            # single global aggregator; not HA-critical
  selector:
    matchLabels:
      app.kubernetes.io/component: observability-federate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-browser-webrtc
        app.kubernetes.io/component: observability-federate
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534      # the prom/prometheus image's nobody user
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=24h"
            - "--web.enable-lifecycle"
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: prometheus-federate-config
        - name: data
          emptyDir:
            sizeLimit: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-federate
  namespace: cloud-browser-webrtc
  labels:
    app.kubernetes.io/name: cloud-browser-webrtc
    app.kubernetes.io/component: observability-federate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: observability-federate
  ports:
    - name: http
      port: 9090
      targetPort: http
