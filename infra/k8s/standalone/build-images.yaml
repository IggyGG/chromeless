# infra/k8s/standalone/build-images.yaml — build the two Go images the
# standalone stack needs, in-cluster, with kaniko.
#
# WHY IN-CLUSTER. The gateway image has never been built anywhere, and the only
# `signaling` tag in the registry (cv2-route-alias) predates this branch's
# signaling/token package — so the broker it produces cannot verify what the
# gateway mints. Both must be built from THIS branch. Building them locally
# needs a docker daemon (absent) on an amd64 host (this one is arm64), so they
# are built where they will run.
#
# Kaniko is how this cluster already builds — same executor version, same
# registry-pull secret, same DOCKER_CONFIG mount as
# infra/k8s/chromeless-build/chromeless-kaniko-push.yaml.
#
# THE BUILD CONTEXT IS THE REPO ROOT FOR BOTH. The gateway needs it because its
# go.mod has `replace ... => ../../signaling` reaching outside its own
# directory, and because the Dockerfile builds the client bundle from client/.
# signaling/ does not strictly need the root, but using it for both keeps one
# clone and one context definition.
#
#   kubectl apply -f infra/k8s/standalone/build-images.yaml
#   kubectl logs -n chromeless -f job/chromeless-build-gateway
#
# Both Jobs are independent and run in parallel. Retag by editing IMAGE_TAG
# below; the deployment manifests reference the same value.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: chromeless-build-gateway
  namespace: chromeless
  labels:
    app.kubernetes.io/name: chromeless-build-gateway
    app.kubernetes.io/part-of: chromeless-standalone
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromeless-build-gateway
        app.kubernetes.io/part-of: chromeless-standalone
    spec:
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Kaniko's own git context support exists, but a plain clone is easier
        # to reason about and lets us pin the ref explicitly — the build lane
        # learned the hard way (fire-build.sh) that a build reporting on the
        # wrong ref is worse than a build that fails.
        - name: clone
          image: alpine/git:2.45.2
          command:
            - sh
            - -c
            - |
              set -eu
              # Clone the COMMIT, not the branch tip.
              #
              # `--depth 1 --branch main` builds whatever main happened to be
              # when the Job started, and the destination tag was a fixed
              # string — so the image recorded neither. On 2026-09-10 the live
              # gateway was sha256:63d6cfa7 with NO tag pointing at it and no
              # commit naming it: unreproducible, and impossible to pin
              # honestly in stack.yaml. This is how that happens.
              git clone --no-checkout "$REPO" /workspace
              git -C /workspace checkout --detach "$COMMIT"
              echo "built from $(git -C /workspace rev-parse HEAD)"
          env:
            - name: REPO
              value: https://forgejo.triform.dev/triform/chromeless.git
            - name: COMMIT
              # A FULL SHA, not a branch name — see the clone script above.
              # main, not feat/standalone-mode: that branch is behind main and
              # does not contain client/src/control.ts, so a rebuild from it
              # would faithfully reproduce the bug it was meant to fix.
              value: c9e35d78a4f0897e70fdbaf8ed8619ef36aa58cf
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.23.2
          args:
            - --dockerfile=/workspace/infra/gateway/Dockerfile
            - --context=/workspace
            # v7 (2026-08-21): v6 predated client/src/control.ts, so the
            # gateway was serving a bundle with NO control-channel consumer —
            # verified by fetching /main.js through the live gateway:
            # wireControlChannel=0 while clipboard=3 (the known-positive that
            # proves the probe worked). A guest raising confirm() had nobody
            # listening. Bump this tag whenever client/ changes: the bundle is
            # baked in at image build time, so a client fix does not reach a
            # browser until the gateway image is rebuilt AND rolled.
            # TAG NAMES THE COMMIT. `standalone-v13` and friends are opaque:
            # nothing about the name says what is inside, so the only way to
            # answer "what is running?" was to remember. Tagging by sha makes
            # the registry self-describing and makes a rebuild of the same
            # commit idempotent instead of silently replacing a tag.
            - --destination=registry.triform.cloud/chromeless/chromeless-gateway:g-c9e35d78a4f0
            # And as a LABEL, because a tag can be moved and a label cannot.
            # `crane config <ref>` then answers the provenance question for any
            # image, tagged or not — which is exactly what could NOT be
            # answered for the gateway running on 2026-09-10.
            - --label=org.opencontainers.image.revision=c9e35d78a4f0897e70fdbaf8ed8619ef36aa58cf
            - --label=org.opencontainers.image.source=https://forgejo.triform.dev/triform/chromeless
            - --single-snapshot          # one layer; these images are small
            - --push-retry=3             # the registry 500s intermittently (BUGS-511/513)
          env:
            - name: DOCKER_CONFIG
              value: /kaniko/.docker
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: docker-config, mountPath: /kaniko/.docker }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits:   { cpu: "2", memory: 4Gi }
      volumes:
        - name: workspace
          emptyDir: {}
        - name: docker-config
          secret:
            secretName: registry-pull
            items:
              - key: .dockerconfigjson
                path: config.json
---
apiVersion: batch/v1
kind: Job
metadata:
  name: chromeless-build-signaling
  namespace: chromeless
  labels:
    app.kubernetes.io/name: chromeless-build-signaling
    app.kubernetes.io/part-of: chromeless-standalone
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromeless-build-signaling
        app.kubernetes.io/part-of: chromeless-standalone
    spec:
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: clone
          image: alpine/git:2.45.2
          command:
            - sh
            - -c
            - |
              set -eu
              # Clone the COMMIT, not the branch tip — see the gateway Job
              # above for what an unpinned build cost.
              git clone --no-checkout "$REPO" /workspace
              git -C /workspace checkout --detach "$COMMIT"
              echo "built from $(git -C /workspace rev-parse HEAD)"
          env:
            - name: REPO
              value: https://forgejo.triform.dev/triform/chromeless.git
            - name: COMMIT
              # A FULL SHA. main, not a feature branch: a build job that lives
              # on main and clones something else produces an image whose tag
              # says one thing and whose contents say another — which is how a
              # gateway rebuilt from a stale branch came to serve a bundle
              # with no control-channel consumer while the tag looked right.
              value: c9e35d78a4f0897e70fdbaf8ed8619ef36aa58cf
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.23.2
          args:
            # signaling/Dockerfile COPYs go.mod then `.` relative to ITS own
            # directory, so the context is signaling/, not the repo root.
            - --dockerfile=/workspace/signaling/Dockerfile
            - --context=/workspace/signaling
            - --destination=registry.triform.cloud/chromeless/signaling:s-c9e35d78a4f0
            - --label=org.opencontainers.image.revision=c9e35d78a4f0897e70fdbaf8ed8619ef36aa58cf
            - --label=org.opencontainers.image.source=https://forgejo.triform.dev/triform/chromeless
            - --single-snapshot
            - --push-retry=3
          env:
            - name: DOCKER_CONFIG
              value: /kaniko/.docker
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: docker-config, mountPath: /kaniko/.docker }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits:   { cpu: "2", memory: 4Gi }
      volumes:
        - name: workspace
          emptyDir: {}
        - name: docker-config
          secret:
            secretName: registry-pull
            items:
              - key: .dockerconfigjson
                path: config.json
