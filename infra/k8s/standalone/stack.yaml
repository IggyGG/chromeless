# infra/k8s/standalone/stack.yaml — the standalone stack, on Kubernetes.
#
# The compose stack (infra/compose.yaml) expressed as plain manifests, so it
# can run on a cluster where the worker image's amd64 build is native.
#
# ADDITIVE BY CONSTRUCTION. The `chromeless` namespace holds live workloads —
# browser-session-controller and a chromeless-browserless CDP pool — and a
# Helm release (`cb`) that is FAILED at revision 21 and owns one of them.
# Everything here is plain kubectl with distinct names and a
# `part-of: chromeless-standalone` label, so nothing can collide with the chart
# and teardown is one selector:
#
#   kubectl delete all,secret,cm -n chromeless \
#     -l app.kubernetes.io/part-of=chromeless-standalone
#
# NEVER `helm upgrade` in this namespace. Revision 21 is already failed; a Helm
# operation could take the live controller with it.
#
# Prereqs:
#   1. Images built:  kubectl apply -f infra/k8s/standalone/build-images.yaml
#   2. Secret:        chromeless-standalone (see the README in this directory)
#
#   kubectl apply -f infra/k8s/standalone/stack.yaml
#   kubectl port-forward -n chromeless svc/chromeless-standalone-gateway 8443:8443
#   open https://localhost:8443
---
apiVersion: v1
kind: Service
metadata:
  name: chromeless-standalone-signaling
  namespace: chromeless
  labels:
    app.kubernetes.io/name: chromeless-standalone-signaling
    app.kubernetes.io/part-of: chromeless-standalone
spec:
  selector:
    app.kubernetes.io/name: chromeless-standalone-signaling
  ports:
    - { name: ws, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromeless-standalone-signaling
  namespace: chromeless
  labels:
    app.kubernetes.io/name: chromeless-standalone-signaling
    app.kubernetes.io/part-of: chromeless-standalone
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chromeless-standalone-signaling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromeless-standalone-signaling
        app.kubernetes.io/part-of: chromeless-standalone
    spec:
      imagePullSecrets: [{ name: registry-pull }]
      # A Kyverno policy (workload-must-exclude-triform-1) requires every
      # workload to opt out of triform-1 explicitly. It is audit-only, so a pod
      # without this still schedules — but it logs a PolicyViolation on every
      # admission, which is noise in someone else's alerting.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["triform-1"]
      securityContext:
        runAsNonRoot: true
        # 65532 = distroless's `nonroot`. The uid must be NUMERIC here: both
        # images declare `USER nonroot:nonroot` by name, and with
        # runAsNonRoot:true the kubelet refuses to start a container whose user
        # it cannot prove is non-root — "image has non-numeric user (nonroot),
        # cannot verify user is non-root", which surfaces as
        # CreateContainerConfigError with no other clue.
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: signaling
          # Built from this branch. The pre-existing `cv2-route-alias` tag
          # predates signaling/token, so a broker built from it CANNOT verify
          # what the gateway mints — every connection would be rejected as a
          # bad signature, with nothing in either log saying the keys differ.
          # standalone-v7 (2026-08-21): peer.saidBye — a clean client close no
          # longer produces a SECOND, synthesised bye. Two byes ~49ms apart
          # killed the worker's re-arm (the second closed the rebuilt session).
          #
          # This pin was also stale: the cluster was running standalone-v6
          # while this file said v3, so re-applying stack.yaml would have
          # rolled the broker BACKWARDS.
          # Pinned by DIGEST, not tag. standalone-v7 is a MUTABLE tag that has
          # now been rebuilt over at least once (2026-08-25, to add the
          # peer_absent envelope), so the tag alone says nothing about which
          # code is running — the same trap that had standalone-v9 serving a
          # different session's build while the Deployment still read "v9".
          #
          # e69c1882 carries peer_absent: a client that joins a session with no
          # browser in it is told so immediately, instead of discovering it
          # from a 65-second watchdog. Verified live against this digest — a
          # client dialled at session "nobody-here" and received
          # {"type":"peer_absent","from":"client"} on connect.
          image: registry.triform.cloud/chromeless/signaling@sha256:e69c188249071fb4d7a5954b006727ec6d4f9ba2e0e83ee4bcc130435c9bfae2
          env:
            - name: SIGNALING_PORT
              value: "8080"
            # The public half of the gateway's signing key. Without it the
            # broker logs "auth disabled: any caller can connect" and means it.
            - name: CHROMELESS_AUTH_PUBKEY
              valueFrom:
                secretKeyRef: { name: chromeless-standalone, key: CHROMELESS_AUTH_PUBKEY }
          ports:
            - { name: ws, containerPort: 8080 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: chromeless-standalone-worker
  namespace: chromeless
  labels:
    app.kubernetes.io/name: chromeless-standalone-worker
    app.kubernetes.io/part-of: chromeless-standalone
spec:
  selector:
    app.kubernetes.io/name: chromeless-standalone-worker
  ports:
    # DevTools. Cluster-internal only: the gateway needs it for navigation, and
    # nothing outside the namespace should reach it — it is unauthenticated
    # remote code execution against the browser.
    - { name: cdp, port: 9222, targetPort: 9222 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromeless-standalone-worker
  namespace: chromeless
  labels:
    app.kubernetes.io/name: chromeless-standalone-worker
    app.kubernetes.io/part-of: chromeless-standalone
spec:
  # ONE. cloud_browser_browser_main_parts.cc rejects a second bring-up
  # ("native session already started"), so a worker is single-use and scaling
  # this would just produce replicas fighting over one session id.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: chromeless-standalone-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromeless-standalone-worker
        app.kubernetes.io/part-of: chromeless-standalone
    spec:
      imagePullSecrets: [{ name: registry-pull }]
      # A Kyverno policy (workload-must-exclude-triform-1) requires every
      # workload to opt out of triform-1 explicitly. It is audit-only, so a pod
      # without this still schedules — but it logs a PolicyViolation on every
      # admission, which is noise in someone else's alerting.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["triform-1"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: chromium
          # The pin from build/guest-release.json, verified to boot and paint
          # by infra/k8s/standalone/smoke-job.yaml.
          # DELIBERATELY STALE UNTIL THE MERGED BUILD LANDS.
          #
          # This merge combines two lineages that each fixed a different half
          # of the guest, and NEITHER side's pin is right for the result:
          #
          #   cr7727-8d2ce2e66288  re-armable offerer driver + the cold-arrival
          #                        fix (an already-running worker now offers to
          #                        a newly-arrived viewer instead of staying
          #                        mute until the previous one leaves; before
          #                        it, the first viewer on an idle stack sat at
          #                        "waiting for offer" until they gave up).
          #                        Has NO control channel and NO downloads.
          #
          #   cr7727-6047599546e3  CbControlChannel (js dialogs reach a human)
          #                        + CbDownloadManagerDelegate (a download
          #                        click produced no file at all).
          #                        Has NO cold-arrival fix.
          #
          # Pinning either one here rolls somebody's half of the guest
          # backwards on the next `deploy.sh`, which is precisely the
          # apply-vs-set-image tug-of-war that cost two sessions a day.
          #
          # So this stays on the older tag until a build from THIS merge
          # exists, and is then replaced by that tag in a follow-up commit.
          # An honestly stale pin that everyone knows to distrust is safer
          # than a fresh-looking one that silently loses half the fixes.
          #
          # VERIFY BY DIGEST, NOT TAG. These tags are mutable: standalone-v9
          # was rebuilt over by a different session on 2026-08-24 and the
          # deployment still read "v9" while serving somebody else's bundle.
          # `kubectl get deploy ... -o jsonpath='{...image}'` is not evidence
          # that the right code is running; the image digest is.
          # THE MERGED IMAGE. Carries both halves, verified in the binary
          # by LOG STRINGS (the binary is stripped, so identifiers do not
          # survive — enum names return 0 on every build, fixed or not):
          #
          #   "while AWAITING AN ANSWER"   1   cold-arrival fix
          #   CV2-REARM                    8   re-armable driver
          #   CbControlChannel            15   js dialogs reach a human
          #   CbDownloadManagerDelegate    2   downloads land a file
          #   crdownload                   1
          #   clipboard                   48   known-positive control
          #
          # Moves in lockstep with build/guest-release.json (tag AND digest);
          # lint-deploy-pin fails if they drift. The digest is the part a
          # rebuilt tag cannot fake — standalone-v9 was rebuilt over by
          # another session while the Deployment still reported v9.
          image: registry.triform.cloud/chromeless/chromeless:cr7727-7da2b212a8ed
          env:
            - name: SESSION_ID
              value: dev
            # host[:port] only — no scheme, no path. The peer builds its own
            # URL (cb_signaling_ws_client.cc) as
            # ws[s]://<host>/api/webrtc/signaling/<session>.
            #
            # A SERVICE DNS NAME IS USED DELIBERATELY, and it is the first
            # thing to suspect if the peer never appears: the k8s controller
            # resolves these to an IP itself because "native Chromium has
            # repeatedly failed to resolve Kubernetes service DNS names even
            # when getent/curl work in the same pod"
            # (controllers/.../reconciler/session.go). If the worker logs
            # ERR_NAME_NOT_RESOLVED, substitute the Service ClusterIP here.
            - name: WEBRTC_SIGNALING_HOST
              value: chromeless-standalone-signaling:8080
            - name: WEBRTC_SIGNALING_SESSION_ID
              value: dev
            # Plaintext ws:// — this hop is inside the cluster network. TLS
            # terminates at the gateway, which is what faces a browser.
            - name: WEBRTC_SIGNALING_TLS
              value: "0"
            # A browser-role token. The broker verifies it, and the worker
            # cannot refresh one (cb_signaling_reconnect.h is explicit that
            # token refresh is out of scope), so it is minted long-lived by a
            # one-shot Job rather than by the gateway's 15-minute issuer.
            - name: WEBRTC_SIGNALING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chromeless-standalone-worker-token
                  key: token
          ports:
            - { name: cdp, containerPort: 9222 }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits:   { cpu: "2", memory: 4Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet:
              path: /json/version
              port: 9222
              # Chromium's DNS-rebinding check answers 403 to any other Host.
              httpHeaders: [{ name: Host, value: localhost }]
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          # LIVENESS: is the worker still TALKING TO THE BROKER?
          #
          # The readiness probe above only asks whether DevTools answers, and it
          # answers whether or not signaling is up. That is exactly how a worker
          # looks perfectly healthy while being useless: on 2026-08-24 a user
          # sat at "no offer from browser" against a pod that was Running 1/1
          # and rendering 29 fps the whole time, and had simply never re-dialed
          # the broker after it was restarted the previous day. The broker log
          # showed only `role: client` joining — the browser peer was absent
          # entirely, for 20 hours, with nothing anywhere reporting a problem.
          #
          # The worker's WS client has NO reconnect — its own error log says
          # "a follow-up R# should add R7 reconnect supervision" — so a
          # code=1006 drop is permanent for the life of the process. Until that
          # C++ lands, the honest fix is to let Kubernetes notice and restart:
          # ~15s, and invisible to a viewer.
          #
          # Reads /proc/net/tcp directly because the image has neither ss nor
          # netstat. 0x1F90 is 8080 (the broker port) and state 01 is
          # ESTABLISHED. Verified live: 1 while signaling is up, 0 once gone.
          #
          # 3 x 30s = 90s of confirmed silence before restarting — far longer
          # than any broker rollout, so redeploying the broker does not put the
          # worker into a restart loop.
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import sys
                  n = 0
                  for line in open('/proc/net/tcp').read().splitlines()[1:]:
                      f = line.split()
                      if f[3] == '01' and f[2].upper().endswith(':1F90'):
                          n += 1
                  sys.exit(0 if n > 0 else 1)
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: chromeless-standalone-gateway
  namespace: chromeless
  labels:
    app.kubernetes.io/name: chromeless-standalone-gateway
    app.kubernetes.io/part-of: chromeless-standalone
spec:
  selector:
    app.kubernetes.io/name: chromeless-standalone-gateway
  ports:
    - { name: https, port: 8443, targetPort: 8443 }
    # Plain-HTTP test fixture (CHROMELESS_ENABLE_TEST_FIXTURE=1 only). The
    # worker cannot accept the self-signed cert on 8443, so the fixture it
    # navigates to has to be served without TLS. Cluster-internal; never
    # published to the host.
    - { name: fixture, port: 8081, targetPort: 8081 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromeless-standalone-gateway
  namespace: chromeless
  labels:
    app.kubernetes.io/name: chromeless-standalone-gateway
    app.kubernetes.io/part-of: chromeless-standalone
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chromeless-standalone-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromeless-standalone-gateway
        app.kubernetes.io/part-of: chromeless-standalone
    spec:
      imagePullSecrets: [{ name: registry-pull }]
      # A Kyverno policy (workload-must-exclude-triform-1) requires every
      # workload to opt out of triform-1 explicitly. It is audit-only, so a pod
      # without this still schedules — but it logs a PolicyViolation on every
      # admission, which is noise in someone else's alerting.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["triform-1"]
      securityContext:
        runAsNonRoot: true
        # 65532 = distroless's `nonroot`. The uid must be NUMERIC here: both
        # images declare `USER nonroot:nonroot` by name, and with
        # runAsNonRoot:true the kubelet refuses to start a container whose user
        # it cannot prove is non-root — "image has non-numeric user (nonroot),
        # cannot verify user is non-root", which surfaces as
        # CreateContainerConfigError with no other clue.
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          # standalone-v8 is what the cluster ran when this was written. This
          # pin said v6, so re-applying stack.yaml would have rolled the
          # gateway BACKWARDS — the same drift the worker and signaling pins
          # had.
          #
          # The gateway BAKES the client bundle in at build time, so a client
          # fix does not reach a browser until this image is rebuilt AND
          # rolled. And the tag is mutable: v9 was rebuilt over by another
          # session, serving a bundle with none of the expected markers while
          # the deployment still read "v9". Check the digest.
          image: registry.triform.cloud/chromeless/chromeless-gateway:standalone-v8
          env:
            - name: CHROMELESS_USER
              valueFrom:
                secretKeyRef: { name: chromeless-standalone, key: CHROMELESS_USER }
            - name: CHROMELESS_PASS
              valueFrom:
                secretKeyRef: { name: chromeless-standalone, key: CHROMELESS_PASS }
            # Cross-checked against the private half at startup; the gateway
            # refuses to boot on a mismatch, because a mismatched pair is the
            # one misconfiguration with no useful symptom.
            - name: CHROMELESS_AUTH_PRIVKEY
              valueFrom:
                secretKeyRef: { name: chromeless-standalone, key: CHROMELESS_AUTH_PRIVKEY }
            - name: CHROMELESS_AUTH_PUBKEY
              valueFrom:
                secretKeyRef: { name: chromeless-standalone, key: CHROMELESS_AUTH_PUBKEY }
            - name: CHROMELESS_SIGNALING_URL
              value: ws://chromeless-standalone-signaling:8080
            - name: CHROMELESS_CDP_URL
              value: http://chromeless-standalone-worker:9222
            # Reached by port-forward, so localhost is what the browser types
            # and the generated cert's default SANs already cover it.
            - name: CHROMELESS_TLS_DIR
              value: /data/certs
          ports:
            - { name: https, containerPort: 8443 }
            - { name: fixture, containerPort: 8081 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: certs, mountPath: /data/certs }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            exec: { command: ["/gateway", "-healthcheck"] }
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        # emptyDir: the cert is regenerated on restart. Fine here — a
        # port-forward user re-accepts it — but a durable deployment wants a
        # PVC so the browser is not re-warned on every roll.
        #
        # 2026-08-24: this bit a real user. The gateway restarted, generated a
        # FRESH self-signed cert into this emptyDir, and their browser — which
        # had an exception pinned to the PREVIOUS cert — refused the new one.
        # The client showed `ws closed {code: 1015}` in a reconnect loop and
        # the gateway logged `remote error: tls: bad certificate`, neither of
        # which points at "your cert changed".
        #
        # The live deployment now mounts a Secret (chromeless-gateway-tls) and
        # an initContainer copies it into the writable /tmp the gateway already
        # has, so the cert survives restarts and the browser is warned ONCE.
        # The copy is needed because the gateway calls MkdirAll on its TLS dir
        # before reading, which fails on a read-only Secret mount.
        #
        #   kubectl create secret generic chromeless-gateway-tls -n chromeless \
        #     --from-file=cert.pem=... --from-file=key.pem=...
        #
        # Verified: fingerprint identical across a rollout restart.
        - name: certs
          emptyDir: {}
