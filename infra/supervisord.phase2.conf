; infra/supervisord.phase2.conf — process supervisor for the Phase 2
; cloud_browser_worker runtime image.
;
; This mirrors infra/supervisord.conf for Xvfb, PulseAudio, Chromium,
; and DevTools proxy, but deliberately leaves pod-level observability
; to the explicit K8s sidecar container. M7: no in-container streamer
; page or idle-watchdog; native peer (M1+M3) takes over both roles.

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisor/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[unix_http_server]
file=/run/supervisor/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
priority=10
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp -ac
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err.log

[program:pulseaudio]
priority=20
command=/usr/bin/pulseaudio --exit-idle-time=-1 --log-target=stderr
environment=HOME="/home/cbuser",XDG_RUNTIME_DIR="/run/user/1000",PULSE_RUNTIME_PATH="/run/user/1000/pulse"
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/pulseaudio.log
stderr_logfile=/var/log/supervisor/pulseaudio.err.log

[program:chromium]
priority=30
command=/usr/local/bin/launch-chromeless.sh
environment=HOME="/home/cbuser",DISPLAY=":99",XDG_RUNTIME_DIR="/run/user/1000",PULSE_SERVER="unix:/run/user/1000/pulse/native"
autorestart=true
startretries=10
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/chromium.log
# CV2-ICE observability: forward chromium's stderr (which now carries the
# CV2-ICE OnIceCandidate / OnIceGatheringChange LOG lines, gated by
# launch-chromeless.sh's --enable-logging=stderr --vmodule=cb_offerer_driver=1)
# to /dev/console. Firecracker captures the guest console to the worker host's
# vmm-work/<vm>/serial.log, so the guest's WebRTC ICE-gathering state becomes
# readable from outside the microVM without a debug build — this is what makes
# the "guest emits zero ICE candidates" Gate-2 blocker diagnosable. The
# in-rootfs file sink is dropped in favour of the host-readable console; flip
# back to a file if console volume becomes a problem.
stderr_logfile=/dev/console

[program:devtools-proxy]
priority=32
command=/usr/local/bin/devtools-proxy.sh
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/devtools-proxy.log
stderr_logfile=/var/log/supervisor/devtools-proxy.err.log

; idle-watchdog removed in M7 R3 (see infra/supervisord.conf comment).
