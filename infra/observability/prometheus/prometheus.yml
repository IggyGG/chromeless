# infra/observability/prometheus/prometheus.yml — minimal Prometheus
# config for the cloud-browser-webrtc observability profile. Two scrape
# jobs:
#
#   signaling   — host-mapped 8080 from the signaling service. Reads
#                 cb_signaling_* metrics (sessions, messages, close
#                 codes, auth failures, active connections).
#   chromium    — host-mapped 9100 from cb-metrics-sidecar. Reads
#                 cb_chromium_* and cb_webrtc_* metrics.
#
# Both targets are reached from inside the prometheus container via
# the compose service DNS names (signaling, chromium). Tweak retention
# / storage on the prometheus container's CLI args, not here.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deploy: cloud-browser-webrtc-dev

scrape_configs:
  - job_name: cb-signaling
    metrics_path: /metrics
    static_configs:
      - targets:
          - signaling:8080
        labels:
          service: signaling

  - job_name: cb-chromium
    metrics_path: /metrics
    static_configs:
      - targets:
          - chromium:9100
        labels:
          service: chromium-sidecar
