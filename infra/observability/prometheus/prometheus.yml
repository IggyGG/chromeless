# infra/observability/prometheus/prometheus.yml — per-region Prometheus
# config (T94). One of these runs in each region; metrics it scrapes
# get the region external label so a global federate Prometheus
# (prometheus-federate.yml) can aggregate without losing provenance.
#
# Scrape jobs:
#   chromeless-signaling   — local cluster's signaling :8080 (cb_signaling_*).
#   chromeless    — local cluster's metrics sidecar :9100
#                    (cb_chromium_*, cb_webrtc_*, cb_client_*).
#   chromeless-controller  — the BrowserSession controller's :8080 (T71).
#   chromeless-turn-issuer — the TURN issuer's :8090 (T76).
#
# Substitute REGION at deploy time. The dev compose stack passes
# REGION via env (defaults to `dev` when CHROMELESS_REGION is unset).
# K8s deploys template this value via the Helm chart.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deploy: chromeless-dev
    # T94: region label every metric the federate aggregates.
    region: "${CHROMELESS_REGION:-dev}"

scrape_configs:
  - job_name: chromeless-signaling
    metrics_path: /metrics
    static_configs:
      - targets:
          - signaling:8080
        labels:
          service: signaling

  - job_name: chromeless
    metrics_path: /metrics
    static_configs:
      - targets:
          - chromium:9100
        labels:
          service: chromium-sidecar

  # Phase-3 controller + issuer scrapes. Targets resolve only when
  # those services are deployed (Helm chart per region).
  - job_name: chromeless-controller
    metrics_path: /metrics
    static_configs:
      - targets:
          - browser-session-controller:8080
        labels:
          service: controller
    # Don't fail loudly when the controller isn't running (single-region
    # dev compose doesn't ship it).
    honor_labels: false

  - job_name: chromeless-turn-issuer
    metrics_path: /metrics
    static_configs:
      - targets:
          - turn-issuer:8090
        labels:
          service: turn-issuer
    honor_labels: false
