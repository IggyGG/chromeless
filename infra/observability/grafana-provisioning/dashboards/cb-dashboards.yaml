# infra/observability/grafana-provisioning/dashboards/cb-dashboards.yaml
#
# Tells Grafana to pick up dashboards from the bind-mounted
# /var/lib/grafana/dashboards directory at startup. The
# infra/observability/dashboards/*.json files mount there in compose.

apiVersion: 1

providers:
  - name: cloud-browser-webrtc
    orgId: 1
    folder: cloud-browser-webrtc
    folderUid: cb-folder
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
