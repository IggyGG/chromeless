<!doctype html>
<html>
<head><meta charset="utf-8"><title>spike workload</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#000; }
  #stage { width:100vw; height:100vh; display:grid; place-items:center;
           font: 700 96px/1 ui-monospace, Menlo, monospace; color:#fff; }
  .a { background: linear-gradient(135deg, #ff007a, #00d4ff); }
  .b { background: linear-gradient(135deg, #00ffaa, #ffaa00); }
  .c { background: linear-gradient(135deg, #aa00ff, #ffff00); }
</style>
</head>
<body>
<!-- Synthetic workload to give beginFrame / screencast something to capture.
     A counter that updates at rAF cadence + a class that cycles colors. -->
<div id="stage" class="a">000</div>
<script>
  const el = document.getElementById('stage');
  const cls = ['a','b','c'];
  let i = 0;
  function tick(t) {
    el.textContent = String(i).padStart(3,'0');
    el.className = cls[i % cls.length];
    i++;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
