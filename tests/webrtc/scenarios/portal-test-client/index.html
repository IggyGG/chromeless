<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Portal Input Encoder — Test Client</title>
    <style>
      html, body { margin: 0; padding: 0; background: #1a1a1a; color: #eee;
                   font-family: ui-sans-serif, system-ui, sans-serif; }
      #wrap { display: flex; flex-direction: column; align-items: center;
              padding: 16px; gap: 12px; }
      #target { background: #0f172a; border: 2px solid #334155; outline: none;
                cursor: crosshair; }
      #target:focus { border-color: #3b82f6; }
      .hud { font-size: 12px; color: #94a3b8; font-family: ui-monospace, monospace; }
      .hud b { color: #cbd5e1; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <!-- The encoder's `web::from_mouse_event` takes &HtmlCanvasElement and
           applies CSS-px → CDP-px scaling via canvas.width/height. We size
           the canvas 1:1 so the scaling is a no-op and dispatched CDP
           coordinates match the encoded output byte-for-byte. -->
      <canvas id="target" width="600" height="400" tabindex="0"></canvas>
      <div class="hud" id="hud">init…</div>
    </div>

    <script type="module">
      // Test-client glue — see ../../portal/leptos-input-encoder-test-client/
      // in tf-multiverse for the source. The wasm bundle is rebuilt via:
      //   wasm-pack build --release --target web --out-dir <here>/pkg
      import init, { init_test_client } from "./pkg/triform_input_encoder_test_client.js";

      // ws=URL is required; the chromeless scenario runner picks an
      // ephemeral port + a stub WS server, then navigates the page
      // with `?ws=ws://127.0.0.1:PORT/...`.
      const params = new URLSearchParams(location.search);
      const wsUrl = params.get("ws");
      const targetId = params.get("target") || "target";

      if (!wsUrl) {
        document.getElementById("hud").textContent =
          "ERROR: missing ?ws=… query param";
        throw new Error("missing ?ws query param");
      }

      // Surface the configured URL on __cbtest BEFORE init runs, so a
      // scenario assertion that polls cbtest can confirm the page got
      // its config even if init fails for some reason.
      window.__cbtest = window.__cbtest || {
        sent: [], counts: { mouse: 0, scroll: 0, key: 0, error: 0 },
        ws_state: "init", last_error: null,
      };
      window.__cbtest.config = { ws_url: wsUrl, target_id: targetId };

      try {
        await init();
        init_test_client(targetId, wsUrl);
        document.getElementById("hud").innerHTML =
          `<b>encoder ready</b> · target=#${targetId} · ws=${wsUrl}`;
      } catch (e) {
        document.getElementById("hud").textContent = "init failed: " + e;
        window.__cbtest.last_error = String(e);
        throw e;
      }

      // Periodic HUD refresh — purely cosmetic; scenario assertions
      // read window.__cbtest directly.
      setInterval(() => {
        const c = window.__cbtest;
        if (!c) return;
        document.getElementById("hud").innerHTML =
          `<b>${c.ws_state}</b> · sent=${c.sent.length} · ` +
          `mouse=${c.counts.mouse} key=${c.counts.key} scroll=${c.counts.scroll}`;
      }, 250);
    </script>
  </body>
</html>
