<!doctype html>
<!--
  tests/webrtc/streamer-page.html — self-contained WebRTC streamer page
  loaded INTO chromeless by drive-recorder.mjs.

  Capture path (CHANGED 2026-05-03):
    Capture is now a CANVAS captureStream, not getDisplayMedia /
    getUserMedia. Reasons:

      1. canvas.captureStream(fps) works in headless chromium with no
         display server, no window-picker, and no fake-device flag.
         The chromeless-tests/chromeless-webrtc-validation Job runs chromeless under
         Xvfb so getDisplayMedia *would* work, but the canvas path is
         strictly more deterministic: no compositor in the loop, no
         dependency on `--auto-select-desktop-capture-source`, and the
         recording shows the exact bytes we drew (handy for diffs).

      2. The canvas-source MediaStream still goes through libwebrtc's
         encoder pipeline identically to a camera or display source,
         so the encoder-identity assertion (encoderImplementation
         matches our embedded factory strings) is unaffected.

      3. The harness can drive the demo content via CDP — calls to
         window.__cbtest.handle({type:'set-scene', value:'streaming'})
         change what's painted within one frame, so the recording
         visibly responds to test steering.

    Falls back to getDisplayMedia if canvas.captureStream is unavailable
    (very old chromium), and to getUserMedia after that.

  Forked from scrapebrowse:capture/streamer-page/streamer.js
  (the getDisplayMedia + RTCPeerConnection + window.pc hook pattern
  around lines 476–547). Preserved differences from the upstream:

    1. Signaling is NOT a WebSocket. The harness drives the page via
       Chrome DevTools Protocol's Runtime.evaluate / Runtime.consoleAPICalled.
       Outbound (page→harness): console.log("CBTEST:" + JSON.stringify(msg)).
       Inbound (harness→page): harness calls window.__cbtest.handle({...}).

    2. window.pc is exposed for the harness's getStats() probe.

    3. Optional ?codec=vp9|h264|av1 query param applies
       RTCRtpTransceiver.setCodecPreferences() so the harness can pin
       the encoder under test.

  Same-origin note: this page must be loaded from the same origin as
  fixtures/demo.js (loaded as an ES module). The harness's tiny
  http.createServer serves both from http://127.0.0.1:<port>/.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>chromeless webrtc test streamer</title>
    <style>
      html, body {
        margin: 0; height: 100%; background: #06080d;
        color: #cfd8e8;
        font: 13px ui-monospace, Menlo, Consolas, monospace;
      }
      #wrap { display: grid; grid-template-rows: auto auto auto auto; gap: 8px;
              padding: 12px; box-sizing: border-box; min-height: 100vh; }
      #status { padding: 6px 10px; background: #11161f; border-radius: 3px;
                font-size: 12px; }
      #stage  { background: #0b0e14; border-radius: 3px;
                box-shadow: 0 2px 24px rgba(0, 0, 0, 0.4);
                width: 100%; height: auto; max-height: 540px; }
      #log    { padding: 6px 10px; background: #0d1218; border-radius: 3px;
                overflow: auto; white-space: pre-wrap;
                font-size: 11px; opacity: 0.85; max-height: 160px; }
      .ok { color: #6cd; } .warn { color: #fc6; } .err { color: #f66; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="status">streamer booting…</div>
      <!-- The recorded video is whatever's painted on this canvas. -->
      <canvas id="stage" width="1280" height="720"></canvas>
      <video   id="local" autoplay muted playsinline
               style="width:100%; max-height: 220px; background:#000; object-fit:contain;"></video>
      <div     id="log"></div>
    </div>

    <script type="module">
      "use strict";

      import { attachDemo } from "./fixtures/demo.js";

      // ----- bridge ---------------------------------------------------
      //
      // Inbound (harness → page) lands here via Runtime.evaluate calls
      // shaped as `window.__cbtest.handle({type:'sdp-answer', sdp:...})`,
      // `window.__cbtest.handle({type:'ice', candidate:...})`, and
      // demo-steering calls (set-scene, log-line, bar-set, flash, badge)
      // which forward to the demo module's send().
      //
      // Outbound (page → harness) goes through console.log with a
      // "CBTEST:" prefix, picked up by drive-recorder.mjs's
      // Runtime.consoleAPICalled subscription. We deliberately use
      // console.log rather than postMessage because postMessage cannot
      // reach the harness (the harness is in Node.js); CDP's console
      // relay is the natural channel.
      window.__cbtest = {
        sdp_in: null,
        ice_in: [],
        ready: false,
        codec: new URLSearchParams(location.search).get("codec") || "",
        handle(msg) {
          if (window.__cbtest._impl) return window.__cbtest._impl(msg);
          window.__cbtest._pending ||= [];
          window.__cbtest._pending.push(msg);
          return null;
        },
      };

      // ----- log + status --------------------------------------------
      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = cls || "";
      }
      function emit(level, msg, extra) {
        const ts = new Date().toISOString().slice(11, 23);
        const tail = extra === undefined
          ? ""
          : "  " + (typeof extra === "string" ? extra : safeStringify(extra));
        const line = document.createElement("div");
        line.className = level;
        line.textContent = `${ts} ${level.padEnd(4).toUpperCase()} ${msg}${tail}`;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
        const c = level === "err" ? console.error
                : level === "warn" ? console.warn
                : console.log;
        c(`[streamer ${level}]`, msg, extra ?? "");
      }
      function safeStringify(v) {
        try { return JSON.stringify(v); } catch { return String(v); }
      }
      function send(msg) {
        // The harness reads stdout for the magic prefix.
        console.log("CBTEST:" + JSON.stringify(msg));
      }

      // ----- demo + capture pipeline ---------------------------------
      //
      // Attach the demo to our visible canvas and capture from it. The
      // demo's send() handle is exposed via _demoImpl below so harness
      // CBTEST messages can steer it.
      const canvas = document.getElementById("stage");
      const demo = attachDemo(canvas, { fps: 30 });

      function captureFromCanvas() {
        if (typeof canvas.captureStream !== "function") {
          throw Object.assign(new Error("canvas.captureStream missing"),
                              { name: "CaptureStreamUnsupported" });
        }
        const s = canvas.captureStream(30);
        if (!s || s.getVideoTracks().length === 0) {
          throw Object.assign(new Error("captureStream produced no tracks"),
                              { name: "CaptureStreamEmpty" });
        }
        return s;
      }

      // ----- main lifecycle ------------------------------------------
      async function start() {
        emit("info", "streamer boot",
             { codec: window.__cbtest.codec || "(default)",
               canvas: { width: canvas.width, height: canvas.height } });

        // 1. Capture. Canvas first; degrade gracefully.
        let stream;
        try {
          stream = captureFromCanvas();
          emit("ok", "canvas.captureStream ok",
               { videoTracks: stream.getVideoTracks().length });
        } catch (err) {
          emit("warn", "canvas.captureStream failed; trying getDisplayMedia",
               { name: err?.name, message: err?.message });
          try {
            stream = await navigator.mediaDevices.getDisplayMedia({
              video: { frameRate: 30 },
              audio: false,
            });
            emit("ok", "getDisplayMedia ok",
                 { videoTracks: stream.getVideoTracks().length });
          } catch (err2) {
            emit("warn", "getDisplayMedia failed; falling back to getUserMedia",
                 { name: err2?.name, message: err2?.message });
            try {
              stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 640, height: 480, frameRate: 30 },
                audio: false,
              });
              emit("ok", "getUserMedia ok",
                   { videoTracks: stream.getVideoTracks().length });
            } catch (err3) {
              emit("err", "all capture sources failed", String(err3));
              send({ type: "fatal", reason: "no-capture",
                     detail: { canvas: String(err), display: String(err2),
                               user: String(err3) } });
              throw err3;
            }
          }
        }

        // Local <video> preview so a screenshot of the page looks right
        // even before the wire is up. Not required for the test path.
        document.getElementById("local").srcObject = stream;

        // 2. Build the peer connection.
        //
        // No iceServers: the harness peer is in the same network
        // namespace via host loopback (drive-recorder.mjs's Node.js
        // peer listens on 127.0.0.1, and either we're on the same
        // host in local dev or sharing pod netns in the chromeless-tests Job).
        // Host candidates are sufficient — STUN would just slow
        // first-frame.
        const pc = new RTCPeerConnection({});
        // window.pc — same hook the upstream streamer exposes for
        // window watchdog + introspection. The harness calls
        // pc.getStats() via Runtime.evaluate; window.pc is the entry
        // point, populated BEFORE we send the offer so the harness's
        // pollStatsUntilEncoded can race the first encoded frame.
        window.pc = pc;

        // 3. Add tracks (with optional codec pinning via transceiver).
        //
        // Pin the canvas-source track to the canvas dimensions via
        // applyConstraints. Without this, chromium's WebRTC pipeline
        // downscales aggressively when no bandwidth/CPU heuristic
        // signals are available — we'd see 320×180 in the recording
        // even though the canvas is 1280×720.
        const videoTrack = stream.getVideoTracks()[0];
        try {
          await videoTrack.applyConstraints({
            width:     { ideal: canvas.width },
            height:    { ideal: canvas.height },
            frameRate: { ideal: 30, max: 30 },
          });
          const settings = videoTrack.getSettings ? videoTrack.getSettings() : {};
          emit("ok", "track constraints applied",
               { width: settings.width, height: settings.height,
                 frameRate: settings.frameRate });
        } catch (err) {
          emit("warn", "applyConstraints failed (non-fatal)", String(err));
        }

        const tx = pc.addTransceiver(videoTrack, {
          direction: "sendonly",
          streams: [stream],
        });

        // Pin the sender's encoding parameters and degradation policy:
        //
        //   - degradationPreference: "maintain-resolution" — without
        //     this, chromium prefers to drop resolution under BWE
        //     pressure even when scaleResolutionDownBy=1 is set,
        //     because "balanced" (the default) trades resolution for
        //     framerate at the BWE/CPU layer BELOW where our scale
        //     factor applies. Setting this to maintain-resolution
        //     keeps frames coming out at the source dimensions.
        //
        //   - encodings replaced with a SINGLE entry (no rid) — by
        //     default modern chromium emits 3 simulcast layers (qvga
        //     + vga + hd) and the receiver-side getStats() reports
        //     the lowest active one. Forcing a single encoding both
        //     halves CPU and means our recorded bytes ARE the bytes
        //     we asserted on. scaleResolutionDownBy=1 + maxBitrate +
        //     maxFramerate then control that single layer.
        try {
          const params = tx.sender.getParameters();
          params.degradationPreference = "maintain-resolution";
          params.encodings = [{
            scaleResolutionDownBy: 1,
            maxBitrate:    6_000_000,
            maxFramerate:  30,
            networkPriority: "high",
          }];
          await tx.sender.setParameters(params);
          emit("ok", "sender parameters pinned",
               { degradationPreference: params.degradationPreference,
                 encodings: params.encodings });
        } catch (err) {
          emit("warn", "setParameters failed (non-fatal)", String(err));
        }

        // 3a. Codec preference. RTCRtpSender.getCapabilities returns
        //     the FULL ordered codec list (vp8, vp9, h264, av1, …)
        //     plus RTX/red/ulpfec/comfort-noise. We re-order so the
        //     requested codec wins, but keep the rest in original
        //     order so SDP negotiation still has a fallback if the
        //     receiver doesn't support our preferred one.
        if (window.__cbtest.codec) {
          try {
            const all = RTCRtpSender.getCapabilities("video").codecs;
            const wanted = window.__cbtest.codec.toLowerCase();
            const matchers = {
              vp9:  (c) => c.mimeType.toLowerCase() === "video/vp9",
              vp8:  (c) => c.mimeType.toLowerCase() === "video/vp8",
              h264: (c) => c.mimeType.toLowerCase() === "video/h264",
              av1:  (c) => c.mimeType.toLowerCase() === "video/av1",
            };
            const matcher = matchers[wanted];
            if (matcher) {
              const preferred = all.filter(matcher);
              const rest = all.filter((c) => !matcher(c));
              tx.setCodecPreferences([...preferred, ...rest]);
              emit("ok", "codec preference applied",
                   { wanted, matched: preferred.length });
            } else {
              emit("warn", "unknown codec preference", { wanted });
            }
          } catch (err) {
            emit("warn", "setCodecPreferences failed", String(err));
          }
        }

        // 4. PC event wiring.
        pc.onsignalingstatechange = () => {
          emit("info", `signalingState=${pc.signalingState}`);
        };
        pc.oniceconnectionstatechange = () => {
          const lvl = pc.iceConnectionState === "failed" ? "err" : "info";
          emit(lvl, `iceConnectionState=${pc.iceConnectionState}`);
          send({ type: "ice-state", state: pc.iceConnectionState });
        };
        pc.onconnectionstatechange = () => {
          const lvl = pc.connectionState === "failed" ? "err" : "info";
          emit(lvl, `connectionState=${pc.connectionState}`);
          send({ type: "pc-state", state: pc.connectionState });
        };
        pc.onicecandidate = (ev) => {
          if (ev.candidate) {
            send({ type: "ice", candidate: ev.candidate.toJSON() });
          } else {
            send({ type: "ice", candidate: null }); // end-of-candidates
          }
        };

        // 5. Inbound bridge — the harness pushes SDP answer + remote
        //    ICE candidates here. Demo-steering messages
        //    (set-scene, log-line, bar-set, flash, badge) forward to
        //    the demo module so the recording visibly reflects them.
        window.__cbtest._impl = async (msg) => {
          try {
            switch (msg?.type) {
              case "sdp-answer":
                await pc.setRemoteDescription({ type: "answer", sdp: msg.sdp });
                emit("ok", "← sdp-answer applied",
                     { sdpBytes: (msg.sdp || "").length });
                return { ok: true };
              case "ice":
                if (msg.candidate === null) {
                  emit("info", "← remote end-of-candidates");
                } else {
                  await pc.addIceCandidate(msg.candidate);
                  emit("info", "← ice added");
                }
                return { ok: true };
              case "set-scene":
              case "log-line":
              case "bar-set":
              case "flash":
              case "badge":
                return demo.send(msg);
              default:
                emit("warn", "unknown inbound type", msg);
                return { ok: false, error: "unknown-type" };
            }
          } catch (err) {
            emit("err", "inbound handler failed", String(err));
            return { ok: false, error: String(err) };
          }
        };
        // Drain anything queued before the impl was bound.
        if (Array.isArray(window.__cbtest._pending)) {
          for (const msg of window.__cbtest._pending) {
            window.__cbtest._impl(msg);
          }
          window.__cbtest._pending = [];
        }

        // 6. Create + send the offer.
        try {
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          send({ type: "sdp-offer", sdp: offer.sdp });
          emit("ok", "→ sdp-offer", { sdpBytes: offer.sdp?.length ?? 0 });
        } catch (err) {
          emit("err", "createOffer/setLocalDescription failed", String(err));
          send({ type: "fatal", reason: "offer-failed", detail: String(err) });
          throw err;
        }

        // 7. Mark page ready so the harness's poll knows the offer has
        //    been emitted (otherwise a fast harness might miss the
        //    console line).
        window.__cbtest.ready = true;
        send({ type: "ready" });
        setStatus("streamer ready — offer sent", "ok");

        // 8. Default scene script: boot → idle → streaming with a
        //    couple of log lines, so the recording always shows
        //    interesting motion even when the harness sends no
        //    steering messages of its own.
        setTimeout(() => demo.send({ type: "set-scene", value: "idle" }), 600);
        setTimeout(() => demo.send({ type: "set-scene", value: "streaming" }), 1500);
        setTimeout(() => demo.send({ type: "log-line",
                                     text: "[wire] sdp-offer → harness" }), 1700);
        setTimeout(() => demo.send({ type: "log-line",
                                     text: "[wire] sdp-answer ← harness" }), 1900);
        setTimeout(() => demo.send({ type: "log-line",
                                     text: "[wire] frame[0] flowing" }), 2400);
      }

      start().catch((err) => {
        setStatus(`streamer failed: ${err?.message ?? err}`, "err");
      });
    </script>
  </body>
</html>
