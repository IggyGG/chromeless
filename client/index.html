<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>chromeless — v0 client</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e0f12;
        --fg: #e6e7ea;
        --muted: #8a8e99;
        --accent: #6db3ff;
        --ok: #4ade80;
        --warn: #f59e0b;
        --err: #f87171;
        --panel: #16181d;
        --border: #262932;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
        font-size: 14px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.02em;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
      }
      .pill .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .pill[data-state="connecting"] .dot { background: var(--warn); }
      .pill[data-state="connected"]  .dot { background: var(--ok); }
      .pill[data-state="failed"]     .dot { background: var(--err); }
      .pill[data-state="closed"]     .dot { background: var(--muted); }
      .spacer { flex: 1; }
      button {
        font: inherit;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--accent);
        color: #07111e;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      /* Column layout so main takes whatever is left. This replaced
         `height: calc(100% - 50px)`, which hardcoded the header's height —
         adding the address bar made the page overflow by exactly one row, and
         a second magic number would break again on the next row. */
      body {
        display: flex;
        flex-direction: column;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 12px;
        padding: 12px 16px;
        flex: 1;
        min-height: 0; /* let the grid shrink instead of pushing the page taller */
      }
      #addressbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--border);
      }
      #addressbar input {
        flex: 1;
        padding: 6px 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--fg);
        font: inherit;
        outline: none;
      }
      #addressbar input:focus { border-color: var(--accent); }
      #addressbar input:disabled { opacity: 0.5; }
      #addressbar button {
        padding: 6px 10px;
        min-width: 34px;
      }
      .stage {
        background: #000;
        border: 1px solid var(--border);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      .stage .placeholder {
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        padding: 24px;
      }
      aside {
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      aside h2 {
        font-size: 12px;
        font-weight: 600;
        margin: 0;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .states {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        padding: 10px 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
      .states dt { color: var(--muted); }
      .states dd { margin: 0; }
      pre#log {
        flex: 1;
        margin: 0;
        padding: 10px 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        overflow: auto;
        border-top: 1px solid var(--border);
        background: #0b0c10;
      }
      pre#log .ts  { color: var(--muted); }
      pre#log .lvl-info { color: var(--accent); }
      pre#log .lvl-ok   { color: var(--ok); }
      pre#log .lvl-warn { color: var(--warn); }
      pre#log .lvl-err  { color: var(--err); }

      /* ── Page-dialog overlay (control channel) ─────────────────────────
         The guest's alert/confirm/prompt arrives on the `control` data
         channel and client/src/control.ts builds these elements. It builds
         them with class names ONLY — no inline styles — so until this block
         existed the "modal" was an unstyled flex child appended after
         <main>: no backdrop, not centered, not on top, and (because body is
         `flex-direction: column` and main is `flex: 1`) squeezed toward zero
         height below the fold.

         It was still clickable, so every automated check that asked "did the
         response reach the guest?" passed. Nothing asked "can a person SEE
         this?", because nothing had ever rendered it — the unit tests inject
         a mock presenter and vitest runs in the node environment, where
         there is no DOM at all. A real browser found it in one look.

         tests/interactive/ suite_dialogs now asserts the overlay's
         getBoundingClientRect() is non-empty AND inside the viewport, which
         is the check that fails if this block is ever dropped again. */
      .cb-control-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;           /* above <video>, which creates its own
                                    stacking context while playing */
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgb(0 0 0 / 55%);
        /* The guest is still running behind this. A backdrop that dims but
           does not hide keeps the page visible while making it obvious that
           input is being intercepted. */
      }
      .cb-control-box {
        width: min(480px, 100%);
        max-height: 100%;
        overflow-y: auto;
        padding: 18px 20px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: 0 12px 40px rgb(0 0 0 / 55%);
      }
      .cb-control-origin {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
        /* Page-controlled text. Long or hostile origins must not stretch the
           box off-screen or push the buttons out of reach. */
        overflow-wrap: anywhere;
      }
      .cb-control-message {
        margin: 0 0 14px;
        line-height: 1.45;
        white-space: pre-wrap;   /* preserve the page's own newlines */
        overflow-wrap: anywhere; /* control.ts caps length; this caps width */
      }
      .cb-control-input {
        width: 100%;
        font: inherit;
        padding: 7px 10px;
        margin-bottom: 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
      }
      .cb-control-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .cb-control-cancel {
        background: transparent;
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>chromeless</h1>
      <span class="pill" id="status" data-state="idle">
        <span class="dot"></span><span id="status-text">idle</span>
      </span>
      <span class="spacer"></span>
      <label class="pill" style="gap: 8px;">
        session
        <input
          id="session-id"
          value="dev"
          style="background:transparent;border:none;color:var(--fg);font:inherit;width:120px;outline:none;"
        />
      </label>
      <button id="connect">Connect</button>
      <!-- T81: webcam/mic passthrough toggle. Disabled until a peer
           connection is up; on click the client calls getUserMedia
           and adds the resulting tracks to the existing pc. -->
      <button id="passthrough-toggle"
              data-state="off"
              disabled
              title="Share your camera + microphone with the cloud browser">
        Share camera/mic
      </button>
    </header>
    <!--
      Address bar. Navigation does NOT ride the peer connection: this posts to
      the gateway, which issues CDP Page.navigate to the worker. The same shape
      the triform portal uses (there the control plane is physics). Disabled
      until a session is up, because there is nothing to drive before then.
    -->
    <form id="addressbar" autocomplete="off">
      <button type="button" id="nav-back" title="Back" disabled aria-label="Back">←</button>
      <button type="button" id="nav-forward" title="Forward" disabled aria-label="Forward">→</button>
      <button type="button" id="nav-reload" title="Reload" disabled aria-label="Reload">↻</button>
      <input
        id="nav-url"
        type="text"
        inputmode="url"
        enterkeyhint="go"
        spellcheck="false"
        placeholder="Search or enter URL"
        disabled
      />
      <button type="submit" id="nav-go" disabled>Go</button>
    </form>
    <main>
      <div class="stage" id="stage">
        <video id="remote" autoplay playsinline muted></video>
      </div>
      <aside>
        <h2>peer connection</h2>
        <dl class="states">
          <dt>signaling</dt>   <dd id="state-sig">—</dd>
          <dt>ice</dt>         <dd id="state-ice">—</dd>
          <dt>ice-gather</dt>  <dd id="state-iceg">—</dd>
          <dt>connection</dt>  <dd id="state-conn">—</dd>
          <dt>data-channel</dt><dd id="state-dc">—</dd>
        </dl>
        <h2>log</h2>
        <pre id="log"></pre>
      </aside>
    </main>
    <!--
      Optional runtime config. infra/compose.yaml generates config.js at
      container start to carry SIGNALING_URL into the page; when serving
      dist/ standalone (or over file://) the file simply won't exist, so
      this is loaded defensively — a missing config.js must not block
      main.js. `onerror` swallows the 404; main.js then falls back to
      the ?signaling= query param or its compile-time default.
      Deliberately NOT type="module": classic scripts are guaranteed to
      execute before the deferred module below.
    -->
    <script src="./config.js" onerror="void 0"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
