<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>chromeless — v0 client</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e0f12;
        --fg: #e6e7ea;
        --muted: #8a8e99;
        --accent: #6db3ff;
        --ok: #4ade80;
        --warn: #f59e0b;
        --err: #f87171;
        --panel: #16181d;
        --border: #262932;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
        font-size: 14px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.02em;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--panel);
        border: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
      }
      .pill .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .pill[data-state="connecting"] .dot { background: var(--warn); }
      .pill[data-state="connected"]  .dot { background: var(--ok); }
      .pill[data-state="failed"]     .dot { background: var(--err); }
      .pill[data-state="closed"]     .dot { background: var(--muted); }
      .spacer { flex: 1; }
      button {
        font: inherit;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--accent);
        color: #07111e;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      main {
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 12px;
        padding: 12px 16px;
        height: calc(100% - 50px);
      }
      .stage {
        background: #000;
        border: 1px solid var(--border);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      .stage .placeholder {
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        padding: 24px;
      }
      aside {
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      aside h2 {
        font-size: 12px;
        font-weight: 600;
        margin: 0;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .states {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        padding: 10px 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
      .states dt { color: var(--muted); }
      .states dd { margin: 0; }
      pre#log {
        flex: 1;
        margin: 0;
        padding: 10px 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        overflow: auto;
        border-top: 1px solid var(--border);
        background: #0b0c10;
      }
      pre#log .ts  { color: var(--muted); }
      pre#log .lvl-info { color: var(--accent); }
      pre#log .lvl-ok   { color: var(--ok); }
      pre#log .lvl-warn { color: var(--warn); }
      pre#log .lvl-err  { color: var(--err); }
    </style>
  </head>
  <body>
    <header>
      <h1>chromeless</h1>
      <span class="pill" id="status" data-state="idle">
        <span class="dot"></span><span id="status-text">idle</span>
      </span>
      <span class="spacer"></span>
      <label class="pill" style="gap: 8px;">
        session
        <input
          id="session-id"
          value="dev"
          style="background:transparent;border:none;color:var(--fg);font:inherit;width:120px;outline:none;"
        />
      </label>
      <button id="connect">Connect</button>
      <!-- T81: webcam/mic passthrough toggle. Disabled until a peer
           connection is up; on click the client calls getUserMedia
           and adds the resulting tracks to the existing pc. -->
      <button id="passthrough-toggle"
              data-state="off"
              disabled
              title="Share your camera + microphone with the cloud browser">
        Share camera/mic
      </button>
    </header>
    <main>
      <div class="stage" id="stage">
        <video id="remote" autoplay playsinline muted></video>
      </div>
      <aside>
        <h2>peer connection</h2>
        <dl class="states">
          <dt>signaling</dt>   <dd id="state-sig">—</dd>
          <dt>ice</dt>         <dd id="state-ice">—</dd>
          <dt>ice-gather</dt>  <dd id="state-iceg">—</dd>
          <dt>connection</dt>  <dd id="state-conn">—</dd>
          <dt>data-channel</dt><dd id="state-dc">—</dd>
        </dl>
        <h2>log</h2>
        <pre id="log"></pre>
      </aside>
    </main>
    <!--
      Optional runtime config. infra/compose.yaml generates config.js at
      container start to carry SIGNALING_URL into the page; when serving
      dist/ standalone (or over file://) the file simply won't exist, so
      this is loaded defensively — a missing config.js must not block
      main.js. `onerror` swallows the 404; main.js then falls back to
      the ?signaling= query param or its compile-time default.
      Deliberately NOT type="module": classic scripts are guaranteed to
      execute before the deferred module below.
    -->
    <script src="./config.js" onerror="void 0"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
